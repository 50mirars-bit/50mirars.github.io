<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1200">
<title>Your Cart | 50 Mirars</title>
<style>
body {
  font-family: Arial, sans-serif;
  margin: 0;
  background: #f9f9f9;
  color: #333;
}

/* Header */
header {
  background: #fff;
  padding: 20px 40px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-bottom: 1px solid #ddd;
}

header h1 {
  font-size: 28px;
  text-align: center;
  flex: 1;
}

.back-btn {
  background: #111;
  color: #fff;
  padding: 10px 20px;
  text-decoration: none;
  border-radius: 6px;
}

.logo {
  width: 120px;
  height: auto;
}

/* Cart Layout */
.cart-page {
  max-width: 1200px;
  margin: 40px auto;
  display: flex;
  gap: 30px;
}

/* Left side wider */
.cart-items th, .cart-items td {
  padding: 15px 25px; /* ⬆️ wider horizontal padding */
  border-bottom: 1px solid #ddd;
  text-align: center;
}

.cart-items th {
  font-size: 16px;
  font-weight: 600;
}

.cart-items td {
  vertical-align: middle;
}

.quantity-btn, .remove-btn {
  min-width: 40px;
}

/* Right side compact box */
.cart-summary {
  flex: 1;
  background: #fff;
  padding: 20px 25px;
  border-radius: 8px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.1);
  height: fit-content;
  align-self: flex-start;
  border: 1px solid #ddd;
}

.cart-summary h3 {
  margin-top: 0;
  font-size: 20px;
  font-weight: 600;
  margin-bottom: 15px;
}

.cart-summary p {
  margin: 8px 0;
  font-size: 15px;
  color: #333;
}

.checkout-btn {
  background: #009688;
  color: #fff;
  border: none;
  padding: 12px;
  border-radius: 6px;
  font-size: 16px;
  cursor: pointer;
  width: 100%;
  margin-top: 15px;
}
.cart-items table {
  width: 100%;
  border-collapse: collapse;
}

.cart-items img {
  width: 80px;
  border-radius: 6px;
}

.quantity-btn {
  background: #009688;
  color: #fff;
  border: none;
  padding: 6px 12px;
  border-radius: 4px;
  cursor: pointer;
}

.remove-btn {
  background: #e53935;
  color: #fff;
  border: none;
  padding: 6px 12px;
  border-radius: 4px;
  cursor: pointer;
}

/* Coupon */
.coupon {
  margin-top: 30px; /* space below table */
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: #f0f0f0; /* ✅ dark grey background */
  padding: 15px; /* adds breathing room inside */
  border-radius: 6px; /* smooth rounded corners */
}

.coupon input {
  flex: 1;
  padding: 10px;
  border: 1px solid #ccc;
  border-radius: 4px;
  background: #fff; /* white input field */
}

.coupon button {
  background: #009688;
  color: #fff;
  border: none;
  padding: 10px 20px;
  margin-left: 10px;
  border-radius: 4px;
  cursor: pointer;
}

.remove-coupon-btn {
  background: #e53935;
  color: #fff;
  border: none;
  padding: 10px 20px;
  margin-left: 10px;
  border-radius: 4px;
  cursor: pointer;
}

/* Right side: summary */
.cart-summary {
  flex: 1; /* ⬇️ make right side narrower */
  background: #fff;
  padding: 20px;
  border-radius: 8px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.1);
  height: fit-content;
  align-self: flex-start;
}
  
.cart-summary p {
  margin: 10px 0;
}

.checkout button {
  background: #28a745; /* green for success */
  color: #fff;
  padding: 14px 28px;
  font-size: 18px;
  border: none;
  border-radius: 6px;
  cursor: pointer;
  margin-top: 20px;
  width: 100%;
}

.checkout button:hover {
  background: #218838;
}
  
/* Footer */
footer {
  background: #111;
  color: #fff;
  padding: 40px;
  display: flex;
  justify-content: space-between;
  flex-wrap: wrap;
}

footer div {
  flex: 1;
  margin: 10px;
}

footer h4 {
  margin-bottom: 10px;
}

footer a {
  color: #c9a24d;
  text-decoration: none;
  display: block;
  margin: 5px 0;
}

footer a:hover {
  color: #fff;
}

.footer-bottom {
  text-align: center;
  margin-top: 20px;
  flex-basis: 100%;
}
</style>
</head>
<body>

<header>
  <a href="index.html" class="back-btn">← Back to Home</a>
  <h1>Your Cart</h1>
  <img src="logo.jpeg" alt="50 Mirars Logo" class="logo">
</header>

<section class="cart-page">
  <!-- Left side: items -->
  <div class="cart-items">
    <table>
      <thead>
        <tr>
          <th>Product</th>
          <th>Price</th>
          <th>Repeat</th>
          <th>Subtotal</th>
          <th>Remove</th>
        </tr>
      </thead>
      <tbody id="cart-items"></tbody>
    </table>

    <!-- Coupon section -->
    <div class="coupon">
      <input type="text" id="coupon-code" placeholder="Coupon Code">
      <button onclick="applyCoupon()">Apply Coupon</button>
      <button class="remove-coupon-btn" onclick="removeCoupon()">Remove Coupon</button>
    </div>
  </div>

  <!-- ✅ Right side: Order Summary -->
  <div class="cart-summary">
    <h3>Order Summary</h3>
    <p id="subtotal"></p>
    <p id="discount"></p>
    <p id="shipping">Shipping: Free</p>
    <p id="total"></p>
  <button onclick="proceedToCheckout()">Proceed to Checkout</button>
  </div>
  
</section>
  
<footer>
  <div>
    <h4>About</h4>
    <p>50 Mirars premium watches and accessories.</p>
  </div>
  <div>
    <h4>Categories</h4>
    <a href="#">Watches</a>
    <a href="#">Sunglasses</a>
    <a href="#">Limited Editions</a>
  </div>
  <div>
    <h4>Support</h4>
    <a href="mailto:50mirars@gmail.com">Email</a>
    <a href="https://wa.me/918209989013" target="_blank">WhatsApp</a>
    <a href="https://www.instagram.com/50mirars" target="_blank">Instagram</a>
  </div>
  <div class="footer-bottom">
    © 2026 50 Mirars. All Rights Reserved.
  </div>
</footer>

<script>
function renderCart() {
  let cart = JSON.parse(localStorage.getItem("cart")) || [];
  let cartTable = document.getElementById("cart-items");
  let subtotalBox = document.getElementById("subtotal");
  let totalBox = document.getElementById("total");

  cartTable.innerHTML = "";
  subtotalBox.innerHTML = "";
  totalBox.innerHTML = "";

  if (cart.length === 0) {
    cartTable.innerHTML = "<tr><td colspan='6'>Your cart is empty.</td></tr>";
    subtotalBox.innerHTML = "Subtotal: ₹0";
    totalBox.innerHTML = "Total: ₹0";
    return;
  }

  let subtotal = 0;
  cart.forEach((item, index) => {
    let price = parseFloat(item.price.replace(/[^0-9.]/g, ""));
    subtotal += price;

    cartTable.innerHTML += `
  <tr>
    <td>${item.name}</td>
    <td>₹${price.toLocaleString("en-IN")}</td>
    <td><button class="quantity-btn" onclick="addAgain(${index})">+</button></td>
    <td>₹${price.toLocaleString("en-IN")}</td>
    <td><button class="remove-btn" onclick="removeItem(${index})">Remove</button></td>
  </tr>
`;

  });

  subtotalBox.innerHTML = `Subtotal: ₹${subtotal.toLocaleString("en-IN")}`;
  totalBox.innerHTML = `Total: ₹${subtotal.toLocaleString("en-IN")}`;
}

function removeItem(index) {
  let cart = JSON.parse(localStorage.getItem("cart")) || [];
  cart.splice(index, 1);
  localStorage.setItem("cart", JSON.stringify(cart));
  renderCart();
}

function addAgain(index) {
  let cart = JSON.parse(localStorage.getItem("cart")) || [];
  let item = cart[index];
  cart.push({ name: item.name, price: item.price });
  localStorage.setItem("cart", JSON.stringify(cart));
  renderCart();
}

let discount = 0;
let appliedCoupon = null;

function applyCoupon() {
  const code = document.getElementById("coupon-code").value.trim().toUpperCase();
  let cart = JSON.parse(localStorage.getItem("cart")) || [];
  let subtotal = 0;

  cart.forEach(item => {
    subtotal += parseFloat(item.price.replace(/[^0-9.]/g, ""));
  });

  discount = 0;
  appliedCoupon = null;

  // 🎟️ Define your coupon codes
  if (code === "BIRTH1") {
    discount = subtotal * 0.20; // 20% off
    appliedCoupon = "BIRTH1";
  } else if (code === "10OFF10") {
    discount = subtotal * 0.10; // 10% off
    appliedCoupon = "10OFF10";
  } else {
    alert("Invalid coupon code");
  }

  updateSummary(subtotal);
}

function removeCoupon() {
  discount = 0;
  appliedCoupon = null;
  document.getElementById("coupon-code").value = "";

  // Recalculate subtotal without discount
  let cart = JSON.parse(localStorage.getItem("cart")) || [];
  let subtotal = 0;
  cart.forEach(item => {
    subtotal += parseFloat(item.price.replace(/[^0-9.]/g, ""));
  });

  updateSummary(subtotal);
}

function updateSummary(subtotal) {
  const total = subtotal - discount;
  document.getElementById("subtotal").innerText = `Subtotal: ₹${subtotal.toLocaleString("en-IN")}`;
  document.getElementById("discount").innerText = `Discount: ₹${discount.toLocaleString("en-IN")}`;
  document.getElementById("total").innerText = `Total: ₹${total.toLocaleString("en-IN")}`;
}

renderCart();

function proceedToCheckout() {
  // Save current cart state if needed
  localStorage.setItem("cart", JSON.stringify(JSON.parse(localStorage.getItem("cart")) || []));
  
  // Redirect to checkout page
  window.location.href = "checkout.html";
}
  
</script>

</body>
</html>
