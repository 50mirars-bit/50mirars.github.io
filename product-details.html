/* =========================================================
   BASIC RESET
========================================================= */

*{
    box-sizing:border-box;
}

body{
    margin:0;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    background:#fff;

    color:#111;
}


/* =========================================================
   HEADER
========================================================= */

.header{

    padding:22px 5%;

    border-bottom:
        1px solid #eee;

    display:flex;

    justify-content:space-between;

    align-items:center;
}

.logo{

    font-size:24px;

    font-weight:700;

    letter-spacing:2px;
}

.back{

    text-decoration:none;

    color:#111;

    font-weight:600;
}

.back:hover{

    color:#c9a24d;
}


/* =========================================================
   PRODUCT PAGE
========================================================= */

.page{

    max-width:1250px;

    margin:45px auto;

    padding:
        0 25px;

    display:grid;

    grid-template-columns:
        1.1fr 1fr;

    gap:65px;
}


/* =========================================================
   GALLERY
========================================================= */

.gallery{

    width:100%;
}

.main-media{

    height:560px;

    background:#f7f7f7;

    border-radius:10px;

    display:flex;

    align-items:center;

    justify-content:center;

    overflow:hidden;
}

.main-media img{

    width:100%;

    height:100%;

    object-fit:contain;
}

.main-media video{

    width:100%;

    height:100%;

    object-fit:contain;
}


/* =========================================================
   THUMBNAILS
========================================================= */

.thumbs{

    display:flex;

    gap:10px;

    margin-top:14px;

    overflow:auto;
}

.thumbs img{

    width:90px;

    height:90px;

    object-fit:cover;

    border:
        1px solid #ddd;

    border-radius:6px;

    cursor:pointer;

    flex-shrink:0;
}

.thumbs img:hover{

    border-color:#c9a24d;
}

.thumbs img.active{

    border:
        2px solid #c9a24d;
}


/* =========================================================
   PRODUCT INFORMATION
========================================================= */

.brand{

    font-size:13px;

    letter-spacing:3px;

    color:#888;

    text-transform:uppercase;

    margin-bottom:12px;
}

h1{

    font-family:
        Georgia,
        "Times New Roman",
        serif;

    font-size:42px;

    font-weight:500;

    line-height:1.15;

    margin:
        0 0 20px;
}

.price{

    font-size:30px;

    font-weight:700;

    color:#c9a24d;

    margin-bottom:22px;
}

.availability{

    display:inline-block;

    background:#f4f4f4;

    padding:
        8px 14px;

    margin-bottom:25px;

    font-size:14px;
}

.desc{

    font-size:16px;

    line-height:1.8;

    color:#555;

    margin-bottom:30px;
}


/* =========================================================
   PRODUCT DETAILS TABLE
========================================================= */

.title{

    font-size:20px;

    margin-bottom:15px;
}

table{

    width:100%;

    border-collapse:collapse;

    margin-bottom:30px;
}

td{

    padding:13px 5px;

    border-bottom:
        1px solid #eee;
}

td:first-child{

    width:40%;

    color:#777;
}


/* =========================================================
   ACTION BUTTONS
========================================================= */

.actions{

    display:flex;

    gap:12px;

    flex-wrap:wrap;
}

button,
.whatsapp{

    padding:
        14px 24px;

    font-size:15px;

    font-weight:600;

    border-radius:6px;

    cursor:pointer;

    text-decoration:none;
}

.cart{

    background:#fff;

    border:
        1px solid #111;

    color:#111;
}

.cart:hover{

    background:#c9a24d;

    border-color:#c9a24d;

    color:#fff;
}

.whatsapp{

    background:#111;

    color:#fff;
}

.whatsapp:hover{

    background:#c9a24d;

    color:#111;
}


/* =========================================================
   ERROR
========================================================= */

.error{

    text-align:center;

    padding:
        100px 20px;
}

.error h1{

    font-size:38px;
}


/* =========================================================
   MOBILE
========================================================= */

@media(max-width:800px){

    .page{

        grid-template-columns:1fr;

        gap:30px;

        margin:25px auto;

        padding:
            0 18px;
    }

    .main-media{

        height:420px;
    }

    h1{

        font-size:32px;
    }

    .actions > *{

        width:100%;

        text-align:center;
    }

    .header{

        padding:
            18px 20px;
    }

    .logo{

        font-size:20px;
    }

}

</style>

</head>

const app =
    document.getElementById("app");


/* =========================================================
   ESCAPE HTML
========================================================= */

function esc(value){

    return String(value)
        .replace(
            /[&<>'"]/g,

            character => ({

                "&":"&amp;",
                "<":"&lt;",
                ">":"&gt;",
                "'":"&#39;",
                '"':"&quot;"

            }[character])

        );

}


/* =========================================================
   RENDER PRODUCT
========================================================= */

function render(){

    if(!product){

        app.innerHTML = `

            <div class="error">

                <h1>
                    Product Not Found
                </h1>

                <p>
                    This product could not be found.
                </p>

                <a
                    class="back"
                    href="watches.html"
                >
                    ← Back to Watches
                </a>

            </div>

        `;

        return;
    }


    let media = "";


    /* =====================================================
       VIDEO PRODUCT
    ====================================================== */

    if(product.video){

        media = `

            <div class="main-media">

                <video
                    controls
                    playsinline
                >

                    <source
                        src="${esc(product.video)}"
                        type="video/mp4"
                    >

                    Your browser does not support
                    the video element.

                </video>

            </div>

        `;

    }


    /* =====================================================
       IMAGE PRODUCT
    ====================================================== */

    else{

        media = `

            <div class="main-media">

                <img
                    id="mainImage"
                    src="${esc(product.images[0] || "")}"
                    alt="${esc(product.name)}"
                >

            </div>


            <div class="thumbs">

                ${

                    product.images
                        .map(
                            (image,index) => `

                                <img
                                    src="${esc(image)}"
                                    class="${index === 0 ? "active" : ""}"
                                    onclick="changeImage(this)"
                                    alt="${esc(product.name)}"
                                >

                            `
                        )
                        .join("")

                }

            </div>

        `;

    }


    /* =====================================================
       COMPLETE PRODUCT PAGE
    ====================================================== */

    app.innerHTML = `

        <section class="page">


            <!-- GALLERY -->

            <section class="gallery">

                ${media}

            </section>


            <!-- PRODUCT INFORMATION -->

            <section>


                <div class="brand">

                    50 Mirars • Watch Collection

                </div>


                <h1>

                    ${esc(product.name)}

                </h1>


                <div class="price">

                    ${esc(product.price)}

                </div>


                <div class="availability">

                    ✓ Available

                </div>


                <p class="desc">

                    Explore the
                    ${esc(product.name)}
                    from the 50 Mirars watch collection.
                    View the product media, confirm the
                    displayed price, and contact us for
                    availability and further product
                    information.

                </p>


                <h2 class="title">

                    Product Details

                </h2>


                <table>

                    <tr>

                        <td>
                            Product
                        </td>

                        <td>
                            ${esc(product.name)}
                        </td>

                    </tr>


                    <tr>

                        <td>
                            Category
                        </td>

                        <td>
                            Watch
                        </td>

                    </tr>


                    <tr>

                        <td>
                            Price
                        </td>

                        <td>
                            ${esc(product.price)}
                        </td>

                    </tr>


                    <tr>

                        <td>
                            Availability
                        </td>

                        <td>
                            Available
                        </td>

                    </tr>

                </table>


                <!-- ACTIONS -->

                <div class="actions">


                    <!-- ADD TO CART -->

                    <button
                        class="cart"
                        onclick="addToCart()"
                    >

                        Add to Cart

                    </button>


                    <!-- WHATSAPP -->

                    <a
                        class="whatsapp"
                        target="_blank"
                        href="https://api.whatsapp.com/send?phone=918209989013&text=${encodeURIComponent(
                            "Hello 50 Mirars, I am interested in " +
                            product.name +
                            ". Please share availability and details."
                        )}"
                    >

                        Enquire Now

                    </a>


                </div>

            </section>

        </section>

    `;

}


/* =========================================================
   CHANGE IMAGE
========================================================= */

function changeImage(element){

    const mainImage =
        document.getElementById(
            "mainImage"
        );


    if(!mainImage){
        return;
    }


    mainImage.src =
        element.src;


    document
        .querySelectorAll(
            ".thumbs img"
        )
        .forEach(
            image => {

                image.classList.remove(
                    "active"
                );

            }
        );


    element.classList.add(
        "active"
    );

}


/* =========================================================
   ADD TO CART
========================================================= */

function addToCart(){

    if(!product){
        return;
    }


    let cart =
        JSON.parse(
            localStorage.getItem("cart")
        ) || [];


    const price =
        String(product.price)
            .replace(
                /[^0-9.]/g,
                ""
            );


    const image =
        product.images[0] ||
        "";


    cart.push({

        name:
            product.name,

        price:
            price,

        image:
            image

    });


    localStorage.setItem(
        "cart",
        JSON.stringify(cart)
    );


    window.location.href =
        "cart.html";

}


/* =========================================================
   LOAD PRODUCT
========================================================= */

render();

</script>


</body>

</html>
