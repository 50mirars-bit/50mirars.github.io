<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Couple Watches | 50 Mirars</title>

<style>
body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f4f1ea;
}

/* Page Title */
.page-title{
    text-align:center;
    padding:70px 20px 50px;
}
.page-title h1{
    font-size:64px;
    margin-bottom:20px;
    color:#111;
}
.title-line{
    width:160px;
    height:2px;
    background:#c9a24d;
    margin:0 auto;
    position:relative;
}
.title-line::after{
    content:"";
    width:12px;
    height:12px;
    background:#c9a24d;
    position:absolute;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%) rotate(45deg);
}

/* Product Grid */
.product-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:35px;
    max-width:1400px;
    margin:auto;
    padding:20px 40px 80px;
}
.product-card{
    background:white;
    border-radius:18px;
    overflow:hidden;
    text-align:center;
    box-shadow:0 8px 25px rgba(0,0,0,0.08);
    transition:0.3s;
}
.product-card:hover{
    transform:translateY(-5px);
}
.product-card img, .product-card video{
    width:100%;
    height:350px;
    object-fit:cover;
}
.product-card h3{
    font-size:22px;
    margin:25px 15px 10px;
    color:#111;
}
.price{
    color:#c9a24d;
    font-weight:bold;
    font-size:22px;
    margin:15px 0;
}
.enquire-btn{
    display:inline-block;
    margin-bottom:35px;
    padding:14px 35px;
    background:#c9a24d;
    color:white;
    text-decoration:none;
    border-radius:6px;
    font-weight:bold;
}

/* Back Button */
.home-btn{
    display:inline-block;
    background:#111;
    color:white;
    text-decoration:none;
    padding:12px 25px;
    border-radius:6px;
    font-weight:600;
    transition:0.3s;
}
.home-btn:hover{
    background:#c9a24d;
    color:black;
}

/* Responsive */
@media(max-width:768px){
    .page-title h1{font-size:42px;}
    .product-grid{grid-template-columns:1fr;padding:20px;}
    .product-card img, .product-card video{height:250px;}
}
</style>
</head>

<body>

<div style="padding:20px 40px;">
    <a href="index.html" class="home-btn">← Back to Home</a>
</div>

<div class="page-title">
  <h1>Couple Watches</h1>
  <div class="title-line"></div>
</div>

<div class="product-grid">
  <!-- Product cards go here -->
</div>
