<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checkout - Delivery Details</title>
  <style>
    body {background:#f5f5f5;font-family:'Segoe UI',Arial,sans-serif;}
    .delivery-form {max-width:600px;margin:50px auto;background:#fff;padding:30px;border-radius:10px;box-shadow:0 6px 18px rgba(0,0,0,0.12);}
    h2 {text-align:center;color:#009688;}
    .form-group {margin-bottom:15px;}
    label {font-weight:600;margin-bottom:5px;display:block;}
    input, textarea {width:100%;padding:12px;border:1px solid #ccc;border-radius:6px;}
    button {background:#009688;color:#fff;padding:14px;font-size:16px;font-weight:600;border:none;border-radius:6px;cursor:pointer;width:100%;}
    button:hover {background:#00796b;}
  </style>
</head>
<body>

<div class="delivery-form">
  <h2>Delivery Details</h2>
  <!-- Form submits to PHP script -->
  <form action="sendmail.php" method="POST">
    <div class="form-group">
      <label for="name">Full Name</label>
      <input type="text" name="name" id="name" required>
    </div>

    <div class="form-group">
      <label for="contact">Contact Number</label>
      <input type="tel" name="contact" id="contact" pattern="[0-9]{10}" required>
    </div>

    <div class="form-group">
      <label for="email">Mail ID</label>
      <input type="email" name="email" id="email" required>
    </div>

    <div class="form-group">
      <label for="address">Address</label>
      <textarea name="address" id="address" rows="3" required></textarea>
    </div>

    <button type="submit">Confirm & Continue</button>
  </form>
</div>

</body>
</html>
