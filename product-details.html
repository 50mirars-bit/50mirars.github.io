const params=new URLSearchParams(location.search);
const productId=Number(params.get("id"));
const product=products.find(p=>p.id===productId);
const app=document.getElementById("app");
const brandList=["Jaeger-LeCoultre","Audemars Piguet","Jacob & Co","Emporio Armani","Tommy Hilfiger","Tag Heuer","Patek Philippe","Richard Mille","Omega","Rolex","Seiko","Tissot","Versace","Cartier","Casio","Breitling","Tudor","Guess","Fossil","Maserati","Swatch","Rado","Armani Exchange","Franck Muller","Thomas Earnshaw","Bannon","Longiness"];
const getBrand=n=>brandList.find(b=>n.toLowerCase().startsWith(b.toLowerCase()))||"50 Mirars Collection";
const money=n=>"₹"+Number(n).toLocaleString("en-IN");
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));
const url=s=>encodeURI(s);
let quantity=1,currentMedia=0;

function mediaHTML(file,large){
 const video=/\.(mp4|webm|ogg)(\?.*)?$/i.test(file);
 return video?`<video src="${url(file)}" ${large?"controls":"muted"} playsinline loop preload="${large?"metadata":"none"}" ${large?"":"autoplay"}></video>`:`<img src="${url(file)}" alt="${esc(product.name)}" loading="${large?"eager":"lazy"}">`;
}
function render(){
 if(!product){app.innerHTML='<main class="empty"><div><div class="eyebrow">50 Mirars</div><h1>Piece Not Found</h1><p style="color:#716d64;margin-top:10px">The requested product is not in the current catalogue.</p><a href="watches.html">Return to Watches</a></div></main>';return;}
 document.title=product.name+" | 50 Mirars";
 const brand=getBrand(product.name),m=product.media||[];
 app.innerHTML=`
 <div class="crumbs"><a href="index.html">Home</a> / <a href="watches.html">Watches</a> / <span>${esc(product.name)}</span></div>
 <main class="atelier">
 <section class="hero-grid">
 <div class="gallery">
  <div class="main-media"><div class="media-label">50 Mirars / Royal Watch Atelier</div><div id="mainMediaContent"></div><div class="media-count" id="mediaCount"></div>
  ${m.length>1?`<div class="gallery-nav"><button class="gallery-arrow" id="prevMedia" aria-label="Previous"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button><button class="gallery-arrow" id="nextMedia" aria-label="Next"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button></div>`:""}
  </div><div class="thumbs" id="thumbs"></div>
 </div>
 <div class="product-copy">
  <div class="eyebrow">${esc(brand)}</div><h1 class="product-title">${esc(product.name)}</h1><div class="product-rule"></div><div class="price">${money(product.price)}</div>
  <div class="availability"><span class="availability-dot"></span> Available for order</div>
  <p class="lead">A carefully presented piece from the 50 Mirars collection, displayed through the Royal Watch Atelier experience.</p>
  <div class="purchase">
   <div class="quantity-row"><span class="quantity-label">Quantity</span><div class="qty"><button id="qtyMinus">−</button><span id="qtyValue">1</span><button id="qtyPlus">+</button></div></div>
   <div class="primary-actions"><button class="action primary" id="addCart">Add to Cart</button><button class="action secondary" id="buyNow">Buy Now</button></div>
   <div class="secondary-actions"><button class="text-action" id="wishlistBtn">♡ Add to Wishlist</button><button class="text-action" id="whatsappBtn">WhatsApp Enquire</button></div>
  </div>
  <div class="trust"><div class="trust-item">Secure order<br>experience</div><div class="trust-item">Premium<br>presentation</div><div class="trust-item">Personal<br>assistance</div></div>
 </div>
 </section>
 <section class="editorial"><div class="section-head"><div class="section-number">01 / The Piece</div><div><h2 class="section-title">The Details</h2><p class="section-intro">The product information below is generated directly from the current 50 Mirars catalogue database.</p></div></div>
 <div class="details-grid">
  <div class="detail"><strong>Collection</strong><span>50 Mirars Watches</span></div><div class="detail"><strong>Brand</strong><span>${esc(brand)}</span></div>
  <div class="detail"><strong>Product</strong><span>${esc(product.name)}</span></div><div class="detail"><strong>Price</strong><span>${money(product.price)}</span></div>
  <div class="detail"><strong>Media</strong><span>${m.length} ${m.length===1?"item":"items"}</span></div><div class="detail"><strong>Format</strong><span>${product.type==="video"?"Video presentation":"Image gallery"}</span></div>
  <div class="detail"><strong>Catalogue ID</strong><span>#${product.id}</span></div><div class="detail"><strong>Availability</strong><span>Available for order</span></div>
 </div></section>
 <section class="statement"><div class="statement-inner"><div class="statement-small">50 Mirars / The Watch Atelier</div><h2>More Than Time.<br>A Statement of Style.</h2><p>Every piece is presented with the visual restraint and attention to detail that define the 50 Mirars collection.</p></div></section>
 <section class="related"><div class="section-head"><div class="section-number">02 / The Collection</div><div><h2 class="section-title">You May Also Like</h2><p class="section-intro">Explore a few neighbouring pieces from the same watch collection.</p></div></div><div class="related-grid" id="relatedGrid"></div></section>
 </main>
 <footer class="footer"><span>© 2026 50 Mirars — The Watch &amp; Sunglasses Store</span><span>Luxury Watch Atelier</span></footer>`;
 buildGallery(m);buildRelated();bindActions();updateCartCount();
}
function buildGallery(m){
 const main=document.getElementById("mainMediaContent"),thumbs=document.getElementById("thumbs"),counter=document.getElementById("mediaCount");
 const show=i=>{currentMedia=(i+m.length)%m.length;main.innerHTML=mediaHTML(m[currentMedia],true);counter.textContent=`${String(currentMedia+1).padStart(2,"0")} / ${String(m.length).padStart(2,"0")}`;[...thumbs.children].forEach((x,j)=>x.classList.toggle("active",j===currentMedia));const v=main.querySelector("video");if(v)v.play().catch(()=>{});};
 thumbs.innerHTML=m.map((file,i)=>{const v=/\.(mp4|webm|ogg)(\?.*)?$/i.test(file);return `<button class="thumb ${i===0?"active":""}" data-index="${i}">${v?`<video src="${url(file)}" muted playsinline preload="metadata"></video><span class="thumb-video-mark">▶</span>`:`<img src="${url(file)}" alt="${esc(product.name)} ${i+1}" loading="lazy">`}</button>`}).join("");
 thumbs.querySelectorAll(".thumb").forEach(b=>b.onclick=()=>show(Number(b.dataset.index)));
 document.getElementById("prevMedia")?.addEventListener("click",()=>show(currentMedia-1));document.getElementById("nextMedia")?.addEventListener("click",()=>show(currentMedia+1));show(0);
}
function buildRelated(){
 const grid=document.getElementById("relatedGrid");const candidates=products.filter(p=>p.id!==product.id);const brand=getBrand(product.name);const same=candidates.filter(p=>getBrand(p.name)===brand);const pool=[...same,...candidates.filter(p=>!same.includes(p))].slice(0,4);
 grid.innerHTML=pool.map(p=>`<a class="related-card" href="product-details.html?id=${p.id}"><div class="related-media">${/\.(mp4|webm|ogg)$/i.test(p.media[0])?`<video src="${url(p.media[0])}" muted autoplay loop playsinline preload="metadata"></video>`:`<img src="${url(p.media[0])}" alt="${esc(p.name)}" loading="lazy">`}</div><div class="related-name">${esc(p.name)}</div><div class="related-price">${money(p.price)}</div><span class="related-link">View Product</span></a>`).join("");
}
function getCart(){try{const x=JSON.parse(localStorage.getItem("cart")||"[]");return Array.isArray(x)?x:[]}catch{return[]}}
function saveCart(c){localStorage.setItem("cart",JSON.stringify(c));updateCartCount()}
function updateCartCount(){const n=getCart().reduce((s,x)=>s+Number(x.quantity||1),0);const e=document.getElementById("cartCount");if(e)e.textContent=n>99?"99+":n}
function addToCart(go){const c=getCart(),x=c.find(i=>Number(i.id)===product.id);if(x)x.quantity=Math.min(10,Number(x.quantity||1)+quantity);else c.push({id:product.id,name:product.name,price:product.price,quantity,type:product.type,media:product.media});saveCart(c);toast(go?"Taking you to your bag":"Added to your bag");if(go)setTimeout(()=>location.href="cart.html",350)}
function bindActions(){
 document.getElementById("qtyMinus").onclick=()=>{quantity=Math.max(1,quantity-1);document.getElementById("qtyValue").textContent=quantity};
 document.getElementById("qtyPlus").onclick=()=>{quantity=Math.min(10,quantity+1);document.getElementById("qtyValue").textContent=quantity};
 document.getElementById("addCart").onclick=()=>addToCart(false);document.getElementById("buyNow").onclick=()=>addToCart(true);
 document.getElementById("wishlistBtn").onclick=()=>{let w=[];try{w=JSON.parse(localStorage.getItem("wishlist")||"[]")}catch{}if(!Array.isArray(w))w=[];if(!w.some(i=>Number(i.id??i)===product.id)){w.push({id:product.id,name:product.name,price:product.price,media:product.media});localStorage.setItem("wishlist",JSON.stringify(w));document.getElementById("wishlistBtn").textContent="♡ Added to Wishlist";toast("Added to wishlist")}else toast("Already in wishlist")};
 document.getElementById("whatsappBtn").onclick=()=>{const msg=`Hello 50 Mirars, I am interested in ${product.name} (₹${product.price.toLocaleString("en-IN")}).`;open(`https://wa.me/918209989013?text=${encodeURIComponent(msg)}`,"_blank")};
}
function toast(t){const e=document.getElementById("toast");e.textContent=t;e.classList.add("show");clearTimeout(window.__t);window.__t=setTimeout(()=>e.classList.remove("show"),2200)}
render();
</script>
