<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Tissot Collection | 50 Mirars</title>


<style>

/* =========================================================
   GLOBAL RESET
========================================================= */

*,
*::before,
*::after{
    box-sizing:border-box;
}

html{
    width:100%;
    margin:0;
    padding:0;
    overflow-x:hidden;
}

body{
    width:100%;
    margin:0;
    padding:0;

    font-family:Arial,sans-serif;

    background:
        radial-gradient(
            circle at 50% 15%,
            rgba(201,162,77,0.10),
            transparent 28%
        ),
        linear-gradient(
            135deg,
            #f7f3e9 0%,
            #eee8d9 50%,
            #f8f5ed 100%
        );

    color:#222;

    overflow-x:hidden;
}


/* =========================================================
   BACK TO HOME
========================================================= */

.home-area{
    width:100%;
    padding:20px;
}

.home-btn{
    display:inline-block;

    background:#111;
    color:#fff;

    text-decoration:none;

    padding:12px 25px;

    border-radius:6px;

    font-weight:600;

    transition:0.3s;
}

.home-btn:hover{
    background:#c9a24d;
    color:#111;
}


/* =========================================================
   PAGE TITLE
========================================================= */

.page-title{
    width:100%;

    text-align:center;

    padding:25px 20px 40px;
}

.page-title h1{
    margin:0 0 20px;

    font-size:64px;

    color:#111;
}

.title-line{
    width:160px;
    height:2px;

    background:#c9a24d;

    margin:0 auto;

    position:relative;
}

.title-line::after{
    content:"";

    width:12px;
    height:12px;

    background:#c9a24d;

    position:absolute;

    left:50%;
    top:50%;

    transform:
        translate(-50%,-50%)
        rotate(45deg);
}


/* =========================================================
   PRODUCTS GRID
========================================================= */

.products-grid{
    width:90%;
    max-width:1400px;

    margin:0 auto 100px;

    display:grid;

    grid-template-columns:
        repeat(3,minmax(0,1fr));

    gap:35px;
}


/* =========================================================
   PRODUCT CARD
========================================================= */

.product-card{
    width:100%;
    min-width:0;

    background:#fff;

    border-radius:15px;

    overflow:hidden;

    text-align:center;

    box-shadow:
        0 8px 25px
        rgba(0,0,0,0.08);
}


/* =========================================================
   NORMAL PRODUCT IMAGE
========================================================= */

.product-image{
    width:100%;

    height:350px;

    object-fit:cover;

    display:block;
}


/* =========================================================
   SLIDER
========================================================= */

.slider{
    width:100%;
    height:350px;

    position:relative;

    overflow:hidden;

    background:#f5f5f5;

    touch-action:pan-y;
}

.slide{
    position:absolute;

    inset:0;

    width:100%;
    height:100%;

    object-fit:cover;

    display:block;

    opacity:0;

    visibility:hidden;

    transition:
        opacity 0.45s ease;

    user-select:none;

    -webkit-user-drag:none;
}

.slide.active{
    opacity:1;
    visibility:visible;

    z-index:1;
}


/* =========================================================
   SLIDER BUTTONS
========================================================= */

.slider-btn{
    position:absolute;

    top:50%;

    transform:translateY(-50%);

    width:42px;
    height:42px;

    display:flex;

    align-items:center;
    justify-content:center;

    border:none;

    border-radius:50%;

    background:rgba(0,0,0,0.65);

    color:#fff;

    font-size:24px;

    cursor:pointer;

    z-index:5;

    transition:0.3s;
}

.slider-btn:hover{
    background:#c9a24d;
    color:#111;
}

.slider-prev{
    left:12px;
}

.slider-next{
    right:12px;
}


/* =========================================================
   SLIDER DOTS
========================================================= */

.slider-dots{
    position:absolute;

    left:0;
    right:0;

    bottom:12px;

    display:flex;

    justify-content:center;

    align-items:center;

    gap:7px;

    z-index:6;
}

.slider-dot{
    width:8px;
    height:8px;

    padding:0;

    border:none;

    border-radius:50%;

    background:rgba(255,255,255,0.65);

    cursor:pointer;

    transition:0.3s;
}

.slider-dot.active{
    width:10px;
    height:10px;

    background:#c9a24d;
}


/* =========================================================
   PRODUCT INFORMATION
========================================================= */

.product-card h3{
    margin:20px 15px 8px;

    font-size:19px;

    line-height:1.4;

    color:#222;

    overflow-wrap:break-word;
}

.price{
    color:#c9a24d;

    font-size:22px;

    font-weight:bold;

    margin-bottom:3px;
}


/* =========================================================
   PRODUCT BUTTONS
========================================================= */

.product-buttons{
    display:flex;

    justify-content:center;

    align-items:center;

    flex-wrap:wrap;

    gap:10px;

    margin-top:10px;

    margin-bottom:20px;

    padding:0 10px;
}

.enquire-btn,
.add-to-cart-btn{
    padding:10px 20px;

    border:1px solid #111;

    cursor:pointer;

    text-decoration:none;

    font-weight:600;

    border-radius:6px;

    font-size:16px;

    transition:0.3s;

    max-width:100%;
}


/* =========================================================
   ENQUIRE
========================================================= */

.enquire-btn{
    background:#111;
    color:#fff;
}

.enquire-btn:hover{
    background:#c9a24d;
    color:#111;
}


/* =========================================================
   ADD TO CART
========================================================= */

.add-to-cart-btn{
    background:#fff;
    color:#111;
}

.add-to-cart-btn:hover{
    background:#c9a24d;
    color:#fff;

    border-color:#c9a24d;
}


/* =========================================================
   TISSOT INFORMATION
========================================================= */

.tissot-info-section{
    width:100%;
    max-width:1400px;

    margin:45px auto 0;

    padding:35px 60px 55px;

    background:#fff;

    color:#111;

    overflow:hidden;
}

.tissot-info-grid{
    width:100%;

    display:grid;

    grid-template-columns:
        repeat(3,minmax(0,1fr));

    gap:55px;

    align-items:start;
}

.tissot-info-column{
    min-width:0;

    max-width:100%;

    overflow-wrap:break-word;

    word-wrap:break-word;
}

.tissot-info-section h2{
    margin:0 0 18px;

    font-size:16px;

    line-height:1.45;

    font-weight:400;
}

.tissot-info-section h3{
    margin:28px 0 17px;

    font-size:16px;

    line-height:1.45;

    font-weight:400;
}

.tissot-info-section p{
    margin:0 0 24px;

    font-size:13px;

    line-height:1.6;

    font-weight:400;

    overflow-wrap:break-word;

    word-wrap:break-word;
}


/* =========================================================
   FAQ
========================================================= */

.tissot-faq{
    margin-top:0;

    width:100%;
}

.tissot-faq-item{
    margin-bottom:20px;

    max-width:100%;
}

.tissot-faq-question{
    margin:0 0 3px !important;

    font-size:13px !important;

    line-height:1.5 !important;

    font-weight:600 !important;
}

.tissot-faq-answer{
    margin:0 !important;

    font-size:13px !important;

    line-height:1.6 !important;

    font-weight:400 !important;
}


/* =========================================================
   CONCLUSION
========================================================= */

.tissot-conclusion{
    width:100%;

    margin-top:40px;
}

.tissot-conclusion h2{
    margin:0 0 18px;

    font-size:16px;

    line-height:1.45;

    font-weight:400;
}

.tissot-conclusion p{
    font-size:13px;

    line-height:1.6;
}


/* =========================================================
   FOOTER
========================================================= */

.main-footer{
    width:100%;

    background:#080808;

    color:#fff;

    padding:70px 7% 25px;

    border-top:
        1px solid
        rgba(255,255,255,0.08);

    overflow:hidden;
}

.footer-container{
    width:100%;
    max-width:1400px;

    margin:0 auto;
}


/* =========================================================
   FOOTER TOP
========================================================= */

.footer-top{
    width:100%;

    display:grid;

    grid-template-columns:
        repeat(3,minmax(0,1fr));

    column-gap:70px;

    row-gap:40px;

    align-items:start;
}

.footer-top > h2{
    grid-column:1 / -1;

    margin:0 0 10px;

    font-family:
        Georgia,
        "Times New Roman",
        serif;

    font-size:42px;

    font-weight:500;

    line-height:1.2;

    color:#fff;

    text-align:center;
}

.contact-column,
.whatsapp-column{
    min-width:0;

    max-width:100%;

    text-align:center;

    overflow-wrap:break-word;
}

.contact-column h3,
.whatsapp-column h3{
    margin:0 0 22px;

    color:#fff;

    font-size:20px;

    font-weight:700;

    line-height:1.35;
}

.contact-column p{
    margin:12px 0 0;

    color:#bdbdbd;

    font-size:15px;

    line-height:1.6;
}

.footer-link{
    display:block;

    width:fit-content;
    max-width:100%;

    margin:0 auto 8px;

    color:#fff;

    text-decoration:none;

    font-size:16px;

    line-height:1.6;

    transition:color 0.3s ease;
}

.footer-link:hover{
    color:#c9a24d;
}


/* =========================================================
   WHATSAPP
========================================================= */

.whatsapp-title{
    display:flex;

    align-items:center;

    justify-content:center;

    gap:8px;

    flex-wrap:wrap;
}

.whatsapp-icon{
    width:28px;
    height:28px;

    object-fit:contain;

    display:inline-block;
}

.whatsapp-button{
    display:inline-flex;

    align-items:center;

    justify-content:center;

    min-width:205px;

    min-height:60px;

    max-width:100%;

    padding:13px 30px;

    background:#fff;

    color:#111;

    text-decoration:none;

    font-size:16px;

    font-weight:700;

    letter-spacing:0.2px;

    border:1px solid #fff;

    transition:all 0.3s ease;
}

.whatsapp-button:hover{
    background:#c9a24d;

    border-color:#c9a24d;

    color:#fff;

    transform:translateY(-2px);
}


/* =========================================================
   FOOTER MIDDLE
========================================================= */

.footer-middle{
    width:100%;

    display:grid;

    grid-template-columns:
        repeat(3,minmax(0,1fr));

    gap:50px;

    margin-top:65px;

    padding-top:45px;

    border-top:
        1px solid
        rgba(255,255,255,0.10);
}

.footer-links-column,
.footer-social{
    min-width:0;

    max-width:100%;

    text-align:center;
}

.footer-links-column h3,
.footer-social h3{
    margin:0 0 20px;

    color:#fff;

    font-size:18px;

    font-weight:700;
}

.footer-links-column a{
    display:block;

    width:fit-content;
    max-width:100%;

    margin:0 auto 14px;

    color:#d7d7d7;

    text-decoration:none;

    font-size:15px;

    line-height:1.5;

    transition:color 0.3s ease;
}

.footer-links-column a:hover{
    color:#c9a24d;
}

.footer-social p{
    margin:0 0 14px;

    color:#d7d7d7;

    font-size:15px;
}


/* =========================================================
   INSTAGRAM
========================================================= */

.instagram-button{
    width:58px;
    height:58px;

    display:inline-flex;

    align-items:center;
    justify-content:center;

    border:
        1px solid
        rgba(255,255,255,0.65);

    border-radius:9px;

    text-decoration:none;

    transition:all 0.3s ease;
}

.instagram-button:hover{
    border-color:#c9a24d;

    transform:translateY(-2px);
}

.instagram-button img{
    width:32px;
    height:32px;

    object-fit:contain;

    display:block;
}


/* =========================================================
   COPYRIGHT
========================================================= */

.footer-bottom{
    width:100%;

    margin-top:50px;

    padding-top:20px;

    border-top:
        1px solid
        rgba(255,255,255,0.10);
}

.footer-bottom p{
    margin:0;

    color:#aaa;

    font-size:13px;

    line-height:1.5;

    text-align:center;
}


/* =========================================================
   TABLET
========================================================= */

@media(max-width:1000px){

    .products-grid{
        grid-template-columns:
            repeat(2,minmax(0,1fr));
    }

    .tissot-info-grid{
        grid-template-columns:
            repeat(2,minmax(0,1fr));

        gap:35px;
    }

    .footer-top{
        grid-template-columns:
            repeat(2,minmax(0,1fr));
    }

    .footer-middle{
        grid-template-columns:
            repeat(2,minmax(0,1fr));
    }

}


/* =========================================================
   MOBILE
========================================================= */

@media(max-width:768px){

    .page-title{
        padding:25px 15px 30px;
    }

    .page-title h1{
        font-size:48px;
    }

    .products-grid{
        width:92%;

        grid-template-columns:1fr;

        gap:25px;

        margin-bottom:60px;
    }

    .slider{
        height:300px;
    }

    .product-image{
        height:300px;
    }

    .slider-btn{
        width:38px;
        height:38px;

        font-size:20px;
    }

    .product-buttons{
        gap:8px;

        padding:0 10px;
    }

    .enquire-btn,
    .add-to-cart-btn{
        padding:10px 15px;

        font-size:14px;
    }

    .tissot-info-section{
        width:100%;

        margin-top:30px;

        padding:30px 20px 45px;
    }

    .tissot-info-grid{
        grid-template-columns:1fr;

        gap:5px;
    }

    .main-footer{
        padding:55px 20px 25px;
    }

    .footer-top{
        grid-template-columns:1fr;

        column-gap:0;

        row-gap:40px;
    }

    .footer-top > h2{
        font-size:36px;
    }

    .footer-middle{
        grid-template-columns:1fr;

        gap:40px;

        margin-top:50px;

        padding-top:35px;
    }

}


/* =========================================================
   SMALL MOBILE
========================================================= */

@media(max-width:400px){

    .page-title h1{
        font-size:42px;
    }

    .products-grid{
        width:94%;
    }

    .product-buttons{
        flex-direction:column;

        width:100%;
    }

    .enquire-btn,
    .add-to-cart-btn{
        width:100%;

        max-width:260px;
    }

    .footer-top > h2{
        font-size:32px;
    }

}


/* =========================================================
   OVERFLOW PROTECTION
========================================================= */

img,
video,
iframe,
table{
    max-width:100%;
}

a,
button,
input,
textarea,
select{
    max-width:100%;
}

</style>

</head>


<body>
