<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=1200">

<title>Your Cart | 50 Mirars</title>

<style>

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f9f9f9;
    color: #222;
}

header {
    background: white;
    padding: 20px 40px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid #ddd;
}

header h1 {
    margin: 0;
    font-size: 28px;
}

.back-btn {
    background: #111;
    color: white;
    padding: 10px 20px;
    text-decoration: none;
    border-radius: 6px;
}

.logo {
    width: 120px;
}

.cart-page {
    max-width: 1200px;
    margin: 40px auto;
    padding: 0 20px;
}

.cart-box {
    background: white;
    padding: 25px;
    border-radius: 10px;
    border: 1px solid #ddd;
}

table {
    width: 100%;
    border-collapse: collapse;
}

th,
td {
    padding: 15px;
    border-bottom: 1px solid #ddd;
    text-align: center;
}

th {
    background: #f5f5f5;
}

.product-name {
    font-weight: bold;
}

.quantity-btn {
    background: #009688;
    color: white;
    border: none;
    padding: 6px 12px;
    border-radius: 4px;
    cursor: pointer;
}

.remove-btn {
    background: #e53935;
    color: white;
    border: none;
    padding: 7px 12px;
    border-radius: 4px;
    cursor: pointer;
}

.summary {
    margin-top: 30px;
    max-width: 400px;
    margin-left: auto;
    background: white;
    padding: 25px;
    border-radius: 10px;
    border: 1px solid #ddd;
}

.summary p {
    display: flex;
    justify-content: space-between;
}

.total {
    font-size: 20px;
    font-weight: bold;
    border-top: 1px solid #ddd;
    padding-top: 15px;
}

.checkout-btn {
    width: 100%;
    padding: 14px;
    background: #009688;
    color: white;
    border: none;
    border-radius: 6px;
    font-size: 16px;
    cursor: pointer;
}

.empty {
    text-align: center;
    padding: 40px;
    font-size: 20px;
}

</style>

</head>

<body>

<header>

<a href="index.html" class="back-btn">
← Back to Home
</a>

<h1>Your Cart</h1>

<img
    src="logo.jpeg"
    class="logo"
    alt="50 Mirars Logo"
>

</header>


<section class="cart-page">

<div class="cart-box">

<table>

<thead>

<tr>

<th>Product</th>

<th>Price</th>

<th>Quantity</th>

<th>Subtotal</th>

<th>Remove</th>

</tr>

</thead>

<tbody id="cart-items">

</tbody>

</table>

</div>


<div class="summary">

<h2>Order Summary</h2>

<p>
<span>Subtotal</span>
<span id="subtotal">₹0</span>
</p>

<p>
<span>Discount</span>
<span id="discount">₹0</span>
</p>

<p>
<span>Shipping</span>
<span>Free</span>
</p>

<p class="total">
<span>Total</span>
<span id="total">₹0</span>
</p>

<button
    class="checkout-btn"
    onclick="goToDelivery()"
>
Proceed to Delivery
</button>

</div>

</section>


<script>

function getCart() {

    return JSON.parse(
        localStorage.getItem("cart")
    ) || [];

}


function saveCart(cart) {

    localStorage.setItem(
        "cart",
        JSON.stringify(cart)
    );

}


function getPrice(item) {

    return parseFloat(
        String(item.price)
        .replace(/[^0-9.]/g, "")
    ) || 0;

}


function renderCart() {

    const cart = getCart();

    const cartItems =
        document.getElementById("cart-items");

    cartItems.innerHTML = "";

    if (cart.length === 0) {

        cartItems.innerHTML = `
            <tr>
                <td colspan="5">
                    <div class="empty">
                        Your cart is empty.
                    </div>
                </td>
            </tr>
        `;

        updateSummary();

        return;

    }


    const products = {};

    cart.forEach(function(item) {

        const key =
            item.name + "|" + item.price;

        if (!products[key]) {

            products[key] = {

                name: item.name,

                price: getPrice(item),

                quantity: 0

            };

        }

        products[key].quantity++;

    });


    Object.values(products).forEach(function(item) {

        const subtotal =
            item.price * item.quantity;


        cartItems.innerHTML += `

        <tr>

            <td class="product-name">
                ${item.name}
            </td>

            <td>
                ₹${item.price.toLocaleString("en-IN")}
            </td>

            <td>

                <button
                    class="quantity-btn"
                    onclick="changeQuantity('${item.name}', -1)"
                >
                    −
                </button>

                ${item.quantity}

                <button
                    class="quantity-btn"
                    onclick="changeQuantity('${item.name}', 1)"
                >
                    +
                </button>

            </td>

            <td>
                ₹${subtotal.toLocaleString("en-IN")}
            </td>

            <td>

                <button
                    class="remove-btn"
                    onclick="removeProduct('${item.name}')"
                >
                    Remove
                </button>

            </td>

        </tr>

        `;

    });


    updateSummary();

}


function changeQuantity(name, amount) {

    let cart = getCart();

    if (amount === 1) {

        const item =
            cart.find(
                item => item.name === name
            );

        if (item) {

            cart.push({
                name: item.name,
                price: item.price
            });

        }

    }


    if (amount === -1) {

        const index =
            cart.findIndex(
                item => item.name === name
            );

        if (index !== -1) {

            cart.splice(index, 1);

        }

    }


    saveCart(cart);

    renderCart();

}


function removeProduct(name) {

    let cart = getCart();

    cart = cart.filter(
        item => item.name !== name
    );

    saveCart(cart);

    renderCart();

}


function updateSummary() {

    const cart = getCart();

    let subtotal = 0;

    cart.forEach(function(item) {

        subtotal += getPrice(item);

    });


    const discount =
        parseFloat(
            localStorage.getItem("cartDiscount")
        ) || 0;


    const total =
        subtotal - discount;


    document.getElementById("subtotal")
        .innerText =
        "₹" + subtotal.toLocaleString("en-IN");


    document.getElementById("discount")
        .innerText =
        "₹" + discount.toLocaleString("en-IN");


    document.getElementById("total")
        .innerText =
        "₹" + total.toLocaleString("en-IN");


    localStorage.setItem(
        "orderSubtotal",
        subtotal
    );

    localStorage.setItem(
        "orderDiscount",
        discount
    );

    localStorage.setItem(
        "orderTotal",
        total
    );

}


function goToDelivery() {

    const cart = getCart();

    if (cart.length === 0) {

        alert("Your cart is empty.");

        return;

    }


    window.location.href =
        "delivery.html";

}


renderCart();

</script>

</body>

</html>
