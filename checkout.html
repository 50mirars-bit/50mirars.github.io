<style>
.delivery-form {
  max-width: 650px;
  margin: 50px auto;
  background: linear-gradient(135deg, #ffffff, #f9f9f9); /* soft gradient */
  padding: 40px;
  border-radius: 12px;
  box-shadow: 0 6px 18px rgba(0,0,0,0.12);
  font-family: 'Segoe UI', Arial, sans-serif;
}

.delivery-form h2 {
  margin-bottom: 30px;
  text-align: center;
  font-size: 26px;
  font-weight: 700;
  color: #009688;
  letter-spacing: 1px;
  border-bottom: 2px solid #009688;
  display: inline-block;
  padding-bottom: 5px;
}

.form-group {
  display: flex;
  flex-direction: column;
  margin-bottom: 20px;
}

.form-group label {
  font-weight: 600;
  margin-bottom: 8px;
  color: #444;
}

.form-group input,
.form-group textarea {
  padding: 14px;
  border: 1px solid #ccc;
  border-radius: 8px;
  font-size: 15px;
  transition: all 0.3s ease;
  background: #fafafa;
}

.form-group input:focus,
.form-group textarea:focus {
  border-color: #009688;
  background: #fff;
  box-shadow: 0 0 8px rgba(0,150,136,0.25);
  outline: none;
}

.delivery-form button {
  background: linear-gradient(135deg, #009688, #00796b);
  color: #fff;
  padding: 16px;
  font-size: 18px;
  font-weight: 600;
  border: none;
  border-radius: 8px;
  cursor: pointer;
  width: 100%;
  margin-top: 25px;
  transition: transform 0.2s ease, box-shadow 0.3s ease;
}

.delivery-form button:hover {
  transform: translateY(-3px);
  box-shadow: 0 6px 12px rgba(0,0,0,0.15);
}

.form-row {
  display: flex;
  gap: 20px;
  margin-bottom: 20px;
}

.form-row .form-group {
  flex: 1;
  display: flex;
  flex-direction: column;
}

@media (max-width: 768px) {
  .form-row {
    flex-direction: column;
  }
}
  
</style>

<div class="delivery-form">
  <h2>Delivery Details</h2>
  <form action="https://formspree.io/f/xdaqrvld" method="POST">

    <div class="form-row">
      <div class="form-group">
        <label for="name">Full Name</label>
        <input type="text" name="name" id="name" required>
      </div>
      <div class="form-group">
        <label for="contact">Contact Number</label>
        <input type="tel" name="contact" id="contact" pattern="[0-9]{10}" required>
      </div>
    </div>

    <div class="form-row">
      <div class="form-group">
        <label for="email">Mail ID</label>
        <input type="email" name="email" id="email" required>
      </div>
      <div class="form-group">
        <label for="pincode">Pincode</label>
        <input type="text" name="pincode" id="pincode" pattern="[0-9]{6}" required>
      </div>
    </div>

    <div class="form-row">
      <div class="form-group">
        <label for="city">City</label>
        <input type="text" name="city" id="city" required>
      </div>
      <div class="form-group">
        <label for="state">State</label>
        <input type="text" name="state" id="state" required>
      </div>
    </div>

    <div class="form-row">
      <div class="form-group">
        <label for="landmark">Landmark</label>
        <input type="text" name="landmark" id="landmark" required>
      </div>
      <div class="form-group">
        <label for="address">Address</label>
        <textarea name="address" id="address" rows="3" required></textarea>
      </div>
    </div>

    <!-- Redirect to payment page after submission -->
    <input type="hidden" name="_redirect" value="payment.html">

    <button type="submit">Confirm & Continue</button>
  </form>
</div>

<script>

function validateForm() {
  const fields = ["name", "contact", "email", "address", "city", "state", "pincode", "landmark"];
  for (let id of fields) {
    const value = document.getElementById(id).value.trim();
    if (!value) {
      alert("Please fill all mandatory fields.");
      return false;
    }
  }
  alert("Delivery details confirmed!");
  window.location.href = "payment.html"; // redirect to payment page
  return true;
}

emailjs.send("service_id","template_id",{
  name: document.getElementById("name").value,
  contact: document.getElementById("contact").value,
  email: document.getElementById("email").value,
  address: document.getElementById("address").value,
  city: document.getElementById("city").value,
  state: document.getElementById("state").value,
  pincode: document.getElementById("pincode").value,
  landmark: document.getElementById("landmark").value
});

</script>
