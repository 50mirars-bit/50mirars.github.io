<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FAQs - 50 Mirars</title>

<style>
body{
    margin:0;
    font-family:Arial, sans-serif;
    background:#f8f6f2;
    color:#222;
}

.header{
    background:white;
    padding:25px 8%;
    border-bottom:1px solid #ddd;
}

.header a{
    text-decoration:none;
    color:#c79a3b;
    font-weight:bold;
}

.container{
    max-width:1000px;
    margin:auto;
    padding:60px 20px;
}

h1{
    text-align:center;
    margin-bottom:50px;
    font-size:42px;
}

.faq-item{
    background:white;
    padding:25px;
    margin-bottom:20px;
    border-left:4px solid #c79a3b;
    box-shadow:0 5px 15px rgba(0,0,0,0.05);
    transition:all 0.3s ease;
}

.faq-question{
    width:100%;
    background:none;
    border:none;
    text-align:left;
    font-size:22px;
    font-weight:bold;
    cursor:pointer;
    padding:10px 0;
    color:#222;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.faq-icon{
    font-size:24px;
    color:#c79a3b;
    transition:transform 0.3s ease;
}

.faq-answer{
    display:none;
    padding-top:10px;
    line-height:1.8;
}

.faq-item.active .faq-answer{
    display:block;
}

.back-btn{
    display:inline-block;
    margin-top:30px;
    padding:12px 25px;
    background:#111;
    color:white;
    text-decoration:none;
    font-weight:bold;
    border-radius:5px;
    transition:0.3s;
}

.back-btn:hover{
    background:#c9a24d;
    color:black;
}

.footer{
    text-align:center;
    padding:30px;
    background:#111;
    color:white;
}
</style>
</head>

<body>

<div class="header">
<div class="container">

<h1>Frequently Asked Questions</h1>

<!-- Example FAQ item -->
<div class="faq-item">
  <button class="faq-question">
    Your Question Here
    <span class="faq-icon">+</span>
  </button>
  <div class="faq-answer">
    <p>Your answer goes here.</p>
  </div>
</div>

<!-- Add more faq-item blocks as needed -->

<a href="index.html" class="back-btn">← Back to Home</a>

</div>
</div>

<script>
const faqItems = document.querySelectorAll('.faq-item');

faqItems.forEach(item => {
  const question = item.querySelector('.faq-question');
  const icon = item.querySelector('.faq-icon');

  question.addEventListener('click', () => {
    item.classList.toggle('active');
    if (item.classList.contains('active')) {
      icon.textContent = '–';
    } else {
      icon.textContent = '+';
    }
  });
});
</script>

<div class="footer">
© 2026 50 Mirars. All Rights Reserved.
</div>

</body>
</html>
