<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<meta name="theme-color" content="#f4f0e8">

<meta
    name="description"
    content="Explore the 50 Mirars luxury watch collection."
>

<title>Luxury Watches | 50 Mirars</title>


<style>

/* =========================================================
   50 MIRARS — WATCH CATALOGUE
   ROYAL EDITORIAL COLLECTION
========================================================= */


/* ---------------------------------------------------------
   RESET
--------------------------------------------------------- */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{

    background:#f4f0e8;

    color:#191817;

    font-family:
        "Helvetica Neue",
        Helvetica,
        Arial,
        sans-serif;

    -webkit-font-smoothing:antialiased;

    overflow-x:hidden;
}


/* ---------------------------------------------------------
   MAIN CATALOGUE
--------------------------------------------------------- */

.watch-catalogue{

    width:100%;

    min-height:100vh;

    padding:24px 36px 30px;

    background:#f4f0e8;
}


/* ---------------------------------------------------------
   CATALOGUE LAYOUT
--------------------------------------------------------- */

.catalogue-layout{

    width:100%;

    max-width:1500px;

    margin:0 auto;

    display:grid;

    grid-template-columns:208px minmax(0,1fr);

    column-gap:36px;

    align-items:start;
}


/* =========================================================
   LEFT FILTER SIDEBAR
========================================================= */

.filters-sidebar{

    width:100%;

    border-right:1px solid #d9d4ca;

    min-height:1040px;

    padding-right:28px;

    position:relative;
}


/* ---------------------------------------------------------
   FILTER HEADER
--------------------------------------------------------- */

.filters-heading{

    height:58px;

    display:flex;

    align-items:flex-start;

    justify-content:space-between;

    border-bottom:1px solid #d9d4ca;

    padding-bottom:17px;
}

.filters-title{

    font-size:11px;

    font-weight:600;

    letter-spacing:2px;

    color:#262522;
}

.clear-filters{

    border:none;

    background:none;

    color:#77736c;

    font-size:9px;

    letter-spacing:.6px;

    cursor:pointer;

    padding:0;

    transition:.2s ease;
}

.clear-filters:hover{

    color:#111;
}


/* ---------------------------------------------------------
   FILTER GROUP
--------------------------------------------------------- */

.filter-group{

    border-bottom:1px solid #ded9d0;

    padding:21px 0 19px;
}

.filter-group:last-child{

    border-bottom:none;
}


.filter-group-header{

    width:100%;

    display:flex;

    justify-content:space-between;

    align-items:center;

    margin-bottom:17px;
}


.filter-group-title{

    font-size:10px;

    font-weight:600;

    letter-spacing:1.6px;

    color:#2b2926;
}

.filter-chevron{

    font-size:12px;

    color:#5e5a53;

    line-height:1;

    transition:transform .25s ease;
}


/* ---------------------------------------------------------
   FILTER OPTIONS
--------------------------------------------------------- */

.filter-options{

    display:flex;

    flex-direction:column;

    gap:13px;
}


.filter-option{

    display:flex;

    align-items:center;

    gap:9px;

    cursor:pointer;

    color:#68645d;

    font-size:10px;

    letter-spacing:.15px;

    line-height:1.3;

    transition:color .2s ease;
}

.filter-option:hover{

    color:#1d1c1a;
}


/* Hide native checkbox appearance */

.filter-option input{

    appearance:none;

    -webkit-appearance:none;

    width:12px;

    height:12px;

    border:1px solid #c8c3b9;

    background:#f7f4ed;

    flex:none;

    cursor:pointer;

    position:relative;
}


.filter-option input:checked{

    border-color:#9e8044;

    background:#9e8044;
}


.filter-option input:checked::after{

    content:"";

    position:absolute;

    left:3px;

    top:0px;

    width:3px;

    height:7px;

    border:solid #fff;

    border-width:0 1px 1px 0;

    transform:rotate(45deg);
}


/* =========================================================
   PRODUCTS AREA
========================================================= */

.products-area{

    min-width:0;
}


/* ---------------------------------------------------------
   TOP BAR
--------------------------------------------------------- */

.products-topbar{

    min-height:58px;

    display:flex;

    align-items:flex-start;

    justify-content:space-between;

    gap:30px;

    border-bottom:1px solid #d9d4ca;

    padding-bottom:13px;
}


/* ---------------------------------------------------------
   BRAND NAVIGATION
--------------------------------------------------------- */

.brand-navigation{

    display:flex;

    align-items:flex-start;

    gap:34px;

    flex-wrap:wrap;

    min-width:0;
}


.brand-button{

    position:relative;

    border:none;

    background:none;

    padding:3px 0 15px;

    color:#5d5952;

    font-size:9px;

    font-weight:500;

    letter-spacing:1.15px;

    white-space:nowrap;

    cursor:pointer;

    transition:color .2s ease;
}


.brand-button:hover{

    color:#1a1917;
}


.brand-button.active{

    color:#171614;
}


.brand-button.active::after{

    content:"";

    position:absolute;

    bottom:0;

    left:0;

    width:100%;

    height:1px;

    background:#a98a4b;
}


/* ---------------------------------------------------------
   SORT
--------------------------------------------------------- */

.sort-wrapper{

    flex:none;

    position:relative;
}


.sort-select{

    appearance:none;

    -webkit-appearance:none;

    width:137px;

    height:30px;

    border:1px solid #d7d2c8;

    background:#f5f1e9;

    color:#555149;

    padding:0 30px 0 12px;

    font-size:9px;

    letter-spacing:.2px;

    outline:none;

    cursor:pointer;
}


.sort-wrapper::after{

    content:"⌄";

    position:absolute;

    right:11px;

    top:5px;

    color:#68635c;

    font-size:13px;

    pointer-events:none;
}


/* =========================================================
   PRODUCT GRID
========================================================= */

.products-grid{

    display:grid;

    grid-template-columns:
        repeat(3,minmax(0,1fr));

    column-gap:28px;

    row-gap:20px;

    padding-top:28px;
}


/* =========================================================
   PRODUCT CARD
========================================================= */

.product-card{

    min-width:0;

    border:1px solid #ddd8cf;

    background:#f4f0e8;

    position:relative;

    transition:
        transform .3s ease,
        border-color .3s ease;

    overflow:hidden;
}


.product-card:hover{

    border-color:#c9c2b6;

    transform:translateY(-2px);
}


/* ---------------------------------------------------------
   MEDIA AREA
--------------------------------------------------------- */

.product-media{

    width:100%;

    aspect-ratio:1.32 / 1;

    background:#ebe6dc;

    position:relative;

    overflow:hidden;
}


/*
   Video itself
*/

.product-media video{

    width:100%;

    height:100%;

    object-fit:cover;

    display:block;

    background:#ebe6dc;
}


/* ---------------------------------------------------------
   WISHLIST BUTTON
--------------------------------------------------------- */

.wishlist-button{

    position:absolute;

    top:11px;

    right:11px;

    z-index:5;

    width:24px;

    height:24px;

    border:none;

    background:transparent;

    display:flex;

    align-items:center;

    justify-content:center;

    cursor:pointer;

    color:#45423d;

    transition:.2s ease;
}


.wishlist-button svg{

    width:14px;

    height:14px;

    fill:none;

    stroke:currentColor;

    stroke-width:1.3;

    transition:.2s ease;
}


.wishlist-button:hover{

    color:#9c7a37;
}


.wishlist-button.active{

    color:#9c7a37;
}


.wishlist-button.active svg{

    fill:#9c7a37;
}


/* =========================================================
   PRODUCT INFORMATION
========================================================= */

.product-information{

    padding:12px 8px 9px;
}


.product-brand{

    font-size:10px;

    font-weight:600;

    letter-spacing:1px;

    color:#292724;

    margin-bottom:4px;

    text-transform:uppercase;
}


.product-name{

    font-family:
        Georgia,
        "Times New Roman",
        serif;

    font-size:11px;

    font-weight:400;

    color:#282622;

    line-height:1.35;

    min-height:15px;

    margin-bottom:3px;
}


.product-specification{

    font-size:9px;

    color:#777169;

    line-height:1.4;

    min-height:13px;

    margin-bottom:13px;
}


.product-price{

    font-size:11px;

    font-weight:500;

    color:#262421;

    letter-spacing:.2px;

    margin-bottom:12px;
}


/* ---------------------------------------------------------
   VIEW PRODUCT BUTTON
--------------------------------------------------------- */

.view-product-button{

    width:100%;

    height:30px;

    border:1px solid #bbb5aa;

    background:transparent;

    color:#35322e;

    display:flex;

    align-items:center;

    justify-content:center;

    gap:6px;

    font-size:8px;

    letter-spacing:1.15px;

    font-weight:500;

    text-decoration:none;

    cursor:pointer;

    transition:
        background .25s ease,
        color .25s ease,
        border-color .25s ease;
}


.view-product-button:hover{

    background:#25231f;

    border-color:#25231f;

    color:#f7f3eb;
}


.view-arrow{

    font-size:11px;

    line-height:1;
}


/* =========================================================
   EMPTY STATE
========================================================= */

.no-products{

    display:none;

    padding:90px 20px;

    text-align:center;

    border:1px solid #ddd8cf;

    margin-top:28px;

    color:#777169;
}


.no-products.visible{

    display:block;
}


.no-products-title{

    font-family:
        Georgia,
        "Times New Roman",
        serif;

    font-size:20px;

    margin-bottom:8px;

    color:#292724;
}


.no-products-text{

    font-size:10px;

    letter-spacing:.5px;
}


/* =========================================================
   PAGINATION
========================================================= */

.pagination{

    display:flex;

    justify-content:center;

    align-items:center;

    gap:22px;

    padding:20px 0 5px;
}


.pagination-arrow{

    border:none;

    background:none;

    color:#6e6961;

    font-size:16px;

    cursor:pointer;

    line-height:1;

    padding:0 3px;
}


.pagination-arrow:hover{

    color:#171614;
}


.page-number{

    width:21px;

    height:21px;

    display:flex;

    align-items:center;

    justify-content:center;

    border:none;

    background:transparent;

    color:#555149;

    font-size:9px;

    cursor:pointer;

    border-radius:50%;
}


.page-number.active{

    background:#171614;

    color:#f5f1e9;
}


.page-number:hover:not(.active){

    color:#111;
}


/* =========================================================
   MOBILE FILTER BUTTON
========================================================= */

.mobile-filter-button{

    display:none;

    width:100%;

    height:42px;

    border:1px solid #d2ccc1;

    background:#f5f1e9;

    color:#36332e;

    font-size:9px;

    letter-spacing:1.2px;

    cursor:pointer;

    margin-bottom:14px;
}


/* =========================================================
   MOBILE OVERLAY
========================================================= */

.filter-overlay{

    display:none;
}


/* =========================================================
   RESPONSIVE
========================================================= */

@media(max-width:1050px){

    .watch-catalogue{

        padding:22px 24px 28px;
    }

    .catalogue-layout{

        grid-template-columns:190px minmax(0,1fr);

        column-gap:28px;
    }

    .filters-sidebar{

        padding-right:22px;
    }

    .brand-navigation{

        gap:23px;
    }

    .products-grid{

        column-gap:18px;
    }
}


@media(max-width:820px){

    .watch-catalogue{

        padding:18px 18px 25px;
    }

    .catalogue-layout{

        display:block;
    }

    .mobile-filter-button{

        display:block;
    }

    .filters-sidebar{

        position:fixed;

        left:-310px;

        top:0;

        width:290px;

        height:100vh;

        min-height:100vh;

        z-index:1000;

        background:#f4f0e8;

        padding:25px 28px;

        border-right:1px solid #d4cec3;

        overflow-y:auto;

        transition:left .3s ease;
    }

    .filters-sidebar.mobile-open{

        left:0;
    }

    .filter-overlay{

        position:fixed;

        inset:0;

        z-index:999;

        background:rgba(20,19,17,.25);

        backdrop-filter:blur(2px);

    }

    .filter-overlay.visible{

        display:block;
    }

    .products-topbar{

        min-height:auto;

        flex-direction:column;

        gap:16px;

        padding-bottom:15px;
    }

    .brand-navigation{

        width:100%;

        gap:20px;

        overflow-x:auto;

        flex-wrap:nowrap;

        padding-bottom:2px;

        scrollbar-width:none;
    }

    .brand-navigation::-webkit-scrollbar{

        display:none;
    }

    .sort-wrapper{

        align-self:flex-end;
    }

    .products-grid{

        grid-template-columns:
            repeat(2,minmax(0,1fr));

        gap:16px;

        padding-top:20px;
    }
}


@media(max-width:540px){

    .watch-catalogue{

        padding:14px 12px 22px;
    }

    .mobile-filter-button{

        height:40px;
    }

    .products-grid{

        grid-template-columns:1fr;

        gap:14px;
    }

    .product-media{

        aspect-ratio:1.45 / 1;
    }

    .product-information{

        padding:13px 11px 11px;
    }

    .product-brand{

        font-size:10px;
    }

    .product-name{

        font-size:12px;
    }

    .product-specification{

        font-size:9px;
    }

    .product-price{

        font-size:12px;
    }

    .pagination{

        gap:17px;

        padding-top:18px;
    }
}


</style>

</head>


<body>

</main>

            "Seiko 5 Sports SRPDK1.mp4"
        ],

        link:"product-details.html?id=127"
    }

];


/* =========================================================
   STATE
========================================================= */

let currentBrand = "All";


/* =========================================================
   ELEMENTS
========================================================= */

const productsGrid =
    document.getElementById("productsGrid");

const noProducts =
    document.getElementById("noProducts");

const sortSelect =
    document.getElementById("sortSelect");

const clearFilters =
    document.getElementById("clearFilters");

const brandButtons =
    document.querySelectorAll(".brand-button");

const filterInputs =
    document.querySelectorAll(
        '.filter-option input'
    );

const mobileFilterButton =
    document.getElementById(
        "mobileFilterButton"
    );

const filtersSidebar =
    document.getElementById(
        "filtersSidebar"
    );

const filterOverlay =
    document.getElementById(
        "filterOverlay"
    );


/* =========================================================
   FORMAT PRICE
========================================================= */

function formatPrice(price){

    return "₹ " +
        Number(price).toLocaleString("en-IN");

}


/* =========================================================
   GET CURRENT FILTERS
========================================================= */

function getSelectedFilters(){

    const selectedPrices =
        [...document.querySelectorAll(
            'input[name="price"]:checked'
        )].map(
            input => input.value
        );


    const selectedMovements =
        [...document.querySelectorAll(
            'input[name="movement"]:checked'
        )].map(
            input => input.value
        );


    const selectedStraps =
        [...document.querySelectorAll(
            'input[name="strap"]:checked'
        )].map(
            input => input.value
        );


    return {

        prices:selectedPrices,

        movements:selectedMovements,

        straps:selectedStraps

    };

}


/* =========================================================
   PRICE FILTER
========================================================= */

function priceMatches(price, selectedPrices){

    if(selectedPrices.length === 0){

        return true;

    }


    return selectedPrices.some(range => {

        if(range === "under25000"){

            return price < 25000;

        }


        if(range === "25000-50000"){

            return price >= 25000 &&
                   price <= 50000;

        }


        if(range === "50000-100000"){

            return price >= 50000 &&
                   price <= 100000;

        }


        if(range === "100000-200000"){

            return price >= 100000 &&
                   price <= 200000;

        }


        if(range === "above200000"){

            return price > 200000;

        }


        return true;

    });

}


/* =========================================================
   FILTER PRODUCTS
========================================================= */

function getFilteredProducts(){

    const filters =
        getSelectedFilters();


    let result =
        watches.filter(product => {


            /* BRAND */

            if(
                currentBrand !== "All" &&
                product.brand !== currentBrand
            ){

                return false;

            }


            /* PRICE */

            if(
                !priceMatches(
                    product.price,
                    filters.prices
                )
            ){

                return false;

            }


            /* MOVEMENT */

            if(
                filters.movements.length > 0 &&
                !filters.movements.includes(
                    product.movement
                )
            ){

                return false;

            }


            /* STRAP */

            if(
                filters.straps.length > 0 &&
                !filters.straps.includes(
                    product.strap
                )
            ){

                return false;

            }


            return true;

        });


    return result;

}


/* =========================================================
   SORT PRODUCTS
========================================================= */

function sortProducts(products){

    const sortValue =
        sortSelect.value;


    const sorted =
        [...products];


    if(sortValue === "low"){

        sorted.sort(
            (a,b) => a.price - b.price
        );

    }


    if(sortValue === "high"){

        sorted.sort(
            (a,b) => b.price - a.price
        );

    }


    if(sortValue === "az"){

        sorted.sort(
            (a,b) =>
                a.name.localeCompare(b.name)
        );

    }


    if(sortValue === "za"){

        sorted.sort(
            (a,b) =>
                b.name.localeCompare(a.name)
        );

    }


    return sorted;

}


/* =========================================================
   PRODUCT CARD
========================================================= */

function createProductCard(product){

    const card =
        document.createElement("article");

    card.className =
        "product-card";


    card.dataset.id =
        product.id;


    card.innerHTML = `

        <div class="product-media">

            <video
                src="${product.media[0]}"
                autoplay
                muted
                loop
                playsinline
                preload="metadata"
            ></video>


            <button
                class="wishlist-button"
                type="button"
                aria-label="Add to wishlist"
                data-wishlist-id="${product.id}"
            >

                <svg
                    viewBox="0 0 24 24"
                    aria-hidden="true"
                >

                    <path
                        d="
                        M20.84 4.61
                        a5.5 5.5 0 0 0-7.78 0
                        L12 5.67
                        l-1.06-1.06
                        a5.5 5.5 0 0 0-7.78 7.78
                        l1.06 1.06
                        L12 21.23
                        l7.78-7.78
                        1.06-1.06
                        a5.5 5.5 0 0 0 0-7.78z
                        "
                    ></path>

                </svg>

            </button>

        </div>


        <div class="product-information">

            <div class="product-brand">
                ${product.brand}
            </div>


            <div class="product-name">
                ${product.name}
            </div>


            <div class="product-specification">
                ${product.movement} | ${product.strap}
            </div>


            <div class="product-price">
                ${formatPrice(product.price)}
            </div>


            <a
                class="view-product-button"
                href="${product.link}"
            >

                VIEW PRODUCT

                <span class="view-arrow">
                    →
                </span>

            </a>

        </div>

    `;


    return card;

}


/* =========================================================
   RENDER PRODUCTS
========================================================= */

function renderProducts(){

    let filteredProducts =
        getFilteredProducts();


    filteredProducts =
        sortProducts(
            filteredProducts
        );


    productsGrid.innerHTML = "";


    if(filteredProducts.length === 0){

        noProducts.classList.add(
            "visible"
        );

        return;

    }


    noProducts.classList.remove(
        "visible"
    );


    filteredProducts.forEach(product => {

        productsGrid.appendChild(
            createProductCard(product)
        );

    });


    initializeWishlistButtons();

}


/* =========================================================
   WISHLIST
========================================================= */

function initializeWishlistButtons(){

    const buttons =
        document.querySelectorAll(
            ".wishlist-button"
        );


    buttons.forEach(button => {

        const id =
            button.dataset.wishlistId;


        let wishlist =
            JSON.parse(
                localStorage.getItem(
                    "50mirars-wishlist"
                ) || "[]"
            );


        if(
            wishlist.includes(id)
        ){

            button.classList.add(
                "active"
            );

        }


        button.addEventListener(
            "click",
            function(){

                let currentWishlist =
                    JSON.parse(
                        localStorage.getItem(
                            "50mirars-wishlist"
                        ) || "[]"
                    );


                if(
                    currentWishlist.includes(id)
                ){

                    currentWishlist =
                        currentWishlist.filter(
                            item => item !== id
                        );

                    button.classList.remove(
                        "active"
                    );

                }

                else{

                    currentWishlist.push(id);

                    button.classList.add(
                        "active"
                    );

                }


                localStorage.setItem(
                    "50mirars-wishlist",
                    JSON.stringify(
                        currentWishlist
                    )
                );

            }
        );

    });

}


/* =========================================================
   BRAND BUTTONS
========================================================= */

brandButtons.forEach(button => {

    button.addEventListener(
        "click",
        function(){

            brandButtons.forEach(item => {

                item.classList.remove(
                    "active"
                );

            });


            this.classList.add(
                "active"
            );


            currentBrand =
                this.dataset.brand;


            renderProducts();

        }
    );

});


/* =========================================================
   FILTER EVENTS
========================================================= */

filterInputs.forEach(input => {

    input.addEventListener(
        "change",
        renderProducts
    );

});


/* =========================================================
   SORT
========================================================= */

sortSelect.addEventListener(
    "change",
    renderProducts
);


/* =========================================================
   CLEAR ALL FILTERS
========================================================= */

clearFilters.addEventListener(
    "click",
    function(){

        filterInputs.forEach(input => {

            input.checked = false;

        });


        currentBrand = "All";


        brandButtons.forEach(button => {

            button.classList.remove(
                "active"
            );

        });


        document
            .querySelector(
                '.brand-button[data-brand="All"]'
            )
            .classList.add("active");


        sortSelect.value =
            "popular";


        renderProducts();

    }
);


/* =========================================================
   MOBILE FILTER
========================================================= */

mobileFilterButton.addEventListener(
    "click",
    function(){

        filtersSidebar.classList.add(
            "mobile-open"
        );

        filterOverlay.classList.add(
            "visible"
        );

    }
);


/* =========================================================
   CLOSE MOBILE FILTER
========================================================= */

filterOverlay.addEventListener(
    "click",
    function(){

        filtersSidebar.classList.remove(
            "mobile-open"
        );

        filterOverlay.classList.remove(
            "visible"
        );

    }
);


/* =========================================================
   INITIAL RENDER
========================================================= */

renderProducts();

</script>


</body>

</html>
