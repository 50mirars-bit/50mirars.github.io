<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checkout - Delivery Details</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    body {
      margin:0;
      font-family:'Segoe UI',Arial,sans-serif;
      background:#f4f6f9;
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
    }
    .delivery-form {
      width:95%;
      max-width:900px;
      background:#ffffff;
      padding:50px;
      border-radius:20px;
      box-shadow:0 15px 35px rgba(0,0,0,0.12);
      animation:fadeIn 0.6s ease;
      border-top:8px solid #1565c0; /* Professional accent bar */
    }
    @keyframes fadeIn {
      from {opacity:0; transform:translateY(20px);}
      to {opacity:1; transform:translateY(0);}
    }
    .delivery-form h2 {
      text-align:center;
      font-size:32px;
      font-weight:700;
      color:#1565c0;
      margin-bottom:40px;
      letter-spacing:1px;
    }
    .form-section {
      margin-bottom:35px;
    }
    .row {
      display:flex;
      gap:30px;
      margin-bottom:25px;
      flex-wrap:wrap;
    }
    .row .input-group {
      flex:1;
      display:flex;
      flex-direction:column;
    }
    label {
      font-weight:600;
      margin-bottom:8px;
      color:#333;
      font-size:15px;
    }
    input, textarea {
      padding:14px;
      border:1px solid #d0d7de;
      border-radius:10px;
      font-size:15px;
      outline:none;
      transition:0.3s;
      background:#fdfdfd;
    }
    input:focus, textarea:focus {
      border-color:#1565c0;
      box-shadow:0 0 10px rgba(21,101,192,0.25);
      background:#fff;
    }
    textarea {
      resize:none;
      min-height:110px;
    }
    .submit-btn {
      width:100%;
      padding:18px;
      background:linear-gradient(135deg,#1565c0,#0d47a1);
      color:#fff;
      font-size:18px;
      font-weight:600;
      border:none;
      border-radius:12px;
      cursor:pointer;
      transition:0.3s;
      letter-spacing:0.5px;
    }
    .submit-btn:hover {
      background:linear-gradient(135deg,#0d47a1,#002171);
      transform:translateY(-2px);
      box-shadow:0 8px 18px rgba(0,0,0,0.25);
    }
  </style>
</head>
<body>
  <div class="delivery-form">
    <h2>Delivery Details</h2>
    <form id="checkoutForm" action="sendmail.php" method="POST">

      <!-- Section 1: First + Last Name -->
      <div class="form-section">
        <div class="row">
          <div class="input-group">
            <label for="fname">First Name</label>
            <input type="text" id="fname" name="fname" required>
          </div>
          <div class="input-group">
            <label for="lname">Last Name</label>
            <input type="text" id="lname" name="lname" required>
          </div>
        </div>
        <div class="row">
          <div class="input-group">
            <label for="contact">Contact Number</label>
            <input type="tel" id="contact" name="contact" required>
          </div>
          <div class="input-group">
            <label for="email">Mail ID</label>
            <input type="email" id="email" name="email" required>
          </div>
        </div>
      </div>

      <!-- Section 2: City + State, Pincode + Landmark, Address -->
      <div class="form-section">
        <div class="row">
          <div class="input-group">
            <label for="city">City</label>
            <input type="text" id="city" name="city" required>
          </div>
          <div class="input-group">
            <label for="state">State</label>
            <input type="text" id="state" name="state" required>
          </div>
        </div>
        <div class="row">
          <div class="input-group">
            <label for="pincode">Pincode</label>
            <input type="text" id="pincode" name="pincode" required>
          </div>
          <div class="input-group">
            <label for="landmark">Landmark</label>
            <input type="text" id="landmark" name="landmark" required>
          </div>
        </div>
        <div class="row">
          <div class="input-group" style="flex:1;">
            <label for="address">Address</label>
            <textarea id="address" name="address" required></textarea>
          </div>
        </div>
      </div>

      <button type="submit" class="submit-btn">Confirm & Continue</button>
    </form>
  </div>
</body>
</html>
