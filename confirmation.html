<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Order Confirmation - 50 Mirars</title>
  <style>
    body {
      font-family:'Segoe UI',Arial,sans-serif;
      background:#f5f5f5;
      margin:0;
      display:flex;
      align-items:center;
      justify-content:center;
      height:100vh;
    }
    .confirmation-box {
      background:#ffffff;
      padding:50px;
      border-radius:16px;
      box-shadow:0 8px 20px rgba(0,0,0,0.15);
      text-align:center;
      max-width:600px;
      width:90%;
      animation:fadeIn 0.6s ease;
    }
    .confirmation-box h2 {
      color:#28a745;
      font-size:32px;
      margin-bottom:20px;
    }
    .confirmation-box p {
      font-size:18px;
      color:#333;
      margin-bottom:10px;
    }
    .confirmation-box .brand {
      font-weight:700;
      color:#ff6f00;
    }
    @keyframes fadeIn {
      from {opacity:0; transform:translateY(20px);}
      to {opacity:1; transform:translateY(0);}
    }
    .btn {
      display:inline-block;
      margin-top:25px;
      padding:14px 28px;
      background:#ff6f00;
      color:#fff;
      font-size:16px;
      font-weight:600;
      border:none;
      border-radius:10px;
      text-decoration:none;
      transition:0.3s;
    }
    .btn:hover {
      background:#e65100;
      transform:translateY(-2px);
      box-shadow:0 6px 12px rgba(0,0,0,0.2);
    }
  </style>
</head>
<body>
  <div class="confirmation-box">
    <h2>✅ Order Confirmed</h2>
    <p>Thanks! for shopping from <span class="brand">50 Mirars</span></p>
    <p>Your order is confirmed and will be processed shortly.</p>
    <a href="index.html" class="btn">Continue Shopping</a>
  </div>
</body>
</html>
