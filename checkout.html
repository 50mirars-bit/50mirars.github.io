<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checkout - Delivery Details</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    body {
      background:#f5f5f5;
      margin:0;
      font-family:'Segoe UI',Arial,sans-serif;
    }
    .delivery-form {
      max-width:700px;
      margin:50px auto;
      background:#fff;
      padding:40px;
      border-radius:12px;
      box-shadow:0 6px 18px rgba(0,0,0,0.12);
    }
    .delivery-form h2 {
      margin-bottom:30px;
      text-align:center;
      font-size:26px;
      font-weight:700;
      color:#009688;
      letter-spacing:1px;
      border-bottom:2px solid #009688;
      padding-bottom:10px;
    }
    .form-section {
      margin-bottom:25px;
    }
    .row {
      display:flex;
      gap:20px;
      margin-bottom:20px;
    }
    .row .input-group {
      flex:1;
      display:flex;
      flex-direction:column;
    }
    label {
      font-weight:600;
      margin-bottom:6px;
      color:#333;
    }
    input, textarea {
      padding:12px;
      border:1px solid #ccc;
      border-radius:6px;
      font-size:15px;
      outline:none;
      transition:0.3s;
    }
    input:focus, textarea:focus {
      border-color:#009688;
      box-shadow:0 0 6px rgba(0,150,136,0.3);
    }
    textarea {
      resize:none;
      min-height:80px;
    }
    .submit-btn {
      width:100%;
      padding:14px;
      background:#009688;
      color:#fff;
      font-size:16px;
      font-weight:600;
      border:none;
      border-radius:8px;
      cursor:pointer;
      transition:0.3s;
    }
    .submit-btn:hover {
      background:#00796b;
    }
  </style>
</head>
<body>
  <div class="delivery-form">
    <h2>Delivery Details</h2>
    <form id="checkoutForm" action="sendmail.php" method="POST">

      <!-- Section 1: Name + Contact + Email -->
      <div class="form-section">
        <div class="row">
          <div class="input-group">
            <label for="name">Full Name</label>
            <input type="text" id="name" name="name" required>
          </div>
          <div class="input-group">
            <label for="contact">Contact Number</label>
            <input type="tel" id="contact" name="contact" required>
          </div>
        </div>
        <div class="row">
          <div class="input-group" style="flex:1;">
            <label for="email">Email ID</label>
            <input type="email" id="email" name="email" required>
          </div>
        </div>
      </div>

      <!-- Section 2: City + State + Pincode + Address -->
      <div class="form-section">
        <div class="row">
          <div class="input-group">
            <label for="city">City</label>
            <input type="text" id="city" name="city" required>
          </div>
          <div class="input-group">
            <label for="state">State</label>
            <input type="text" id="state" name="state" required>
          </div>
          <div class="input-group">
            <label for="pincode">Pincode</label>
            <input type="text" id="pincode" name="pincode" required>
          </div>
        </div>
        <div class="row">
          <div class="input-group" style="flex:1;">
            <label for="address">Address</label>
            <textarea id="address" name="address" required></textarea>
          </div>
        </div>
      </div>

      <button type="submit" class="submit-btn">Confirm & Continue</button>
    </form>
  </div>
</body>
</html>
