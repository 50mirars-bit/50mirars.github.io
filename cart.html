<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1200">
<title>Your Cart | 50 Mirars</title>
<link rel="stylesheet" href="style.css">
<style>
body {
  font-family: Arial, sans-serif;
  margin: 0;
  background: #f9f9f9;
  color: #333;
}

/* Header */
header {
  background: #fff;
  padding: 20px 40px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-bottom: 1px solid #ddd;
}

header h1 {
  font-size: 28px;
  text-align: center;
  flex: 1;
}

.back-btn {
  background: #111;
  color: #fff;
  padding: 10px 20px;
  text-decoration: none;
  border-radius: 6px;
}

.logo {
  width: 120px;
  height: auto;
}

/* Cart Layout */
.cart-page {
  max-width: 1200px;
  margin: 40px auto;
  display: flex;
  gap: 30px;
}

/* Left side: items */
.cart-items {
  flex: 2;
  background: #fff;
  padding: 20px;
  border-radius: 8px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.1);
}

.cart-items table {
  width: 100%;
  border-collapse: collapse;
}

.cart-items th, .cart-items td {
  padding: 15px;
  border-bottom: 1px solid #ddd;
  text-align: center;
}

.cart-items img {
  width: 80px;
  border-radius: 6px;
}

.quantity-btn {
  background: #009688;
  color: #fff;
  border: none;
  padding: 6px 12px;
  border-radius: 4px;
  cursor: pointer;
}

.remove-btn {
  background: #e53935;
  color: #fff;
  border: none;
  padding: 6px 12px;
  border-radius: 4px;
  cursor: pointer;
}

/* Coupon */
.coupon {
  margin-top: 20px;
  display: flex;
  justify-content: space-between;
}

.coupon input {
  flex: 1;
  padding: 10px;
  border: 1px solid #ddd;
  border-radius: 4px;
}

.coupon button {
  background: #009688;
  color: #fff;
  border: none;
  padding: 10px 20px;
  margin-left: 10px;
  border-radius: 4px;
  cursor: pointer;
}

/* Right side: summary */
.cart-summary {
  flex: 1;
  background: #fff;
  padding: 20px;
  border-radius: 8px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.1);
}

.cart-summary h3 {
  margin-top: 0;
  font-size: 22px;
}

.cart-summary p {
  margin: 10px 0;
}

.checkout-btn {
  background: #009688;
  color: #fff;
  border: none;
  padding: 12px;
  border-radius: 6px;
  font-size: 16px;
  cursor: pointer;
  width: 100%;
}
