<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=1000"
>

<meta
    name="theme-color"
    content="#f7f3e9"
>

<meta
    name="description"
    content="50 Mirars — Royal Sunglasses Atelier. Explore the selected sunglasses in a premium editorial product experience."
>

<title>Sunglasses Details | 50 Mirars</title>

<style>

/* =========================================================
   50 MIRARS — ROYAL SUNGLASSES ATELIER
   PRODUCT DETAILS
========================================================= */

@import url(
'https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Inter:wght@300;400;500;600&display=swap'
);

:root{
    --ivory:#f7f3e9;
    --paper:#fbf9f4;
    --ink:#111;
    --muted:#716d64;
    --gold:#c9a24d;
    --gold-dark:#9b762c;
    --line:rgba(17,17,17,.14);
    --max:1320px;
}

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html{
    scroll-behavior:smooth;
}

body{
    background:var(--ivory);
    color:var(--ink);
    font-family:Inter,Arial,Helvetica,sans-serif;
    overflow-x:hidden;
}

img,
video{
    max-width:100%;
}

a{
    color:inherit;
    text-decoration:none;
}

button{
    font:inherit;
}

::selection{
    background:var(--gold);
    color:#111;
}

/* =========================================================
   HEADER
========================================================= */

.site-header{
    min-height:100px;
    border-bottom:1px solid var(--line);
    display:flex;
    align-items:center;
    padding:0 48px;
    background:rgba(247,243,233,.96);
    backdrop-filter:blur(14px);
    position:sticky;
    top:0;
    z-index:100;
}

.brand{
    display:inline-block;
    font-family:Georgia,"Times New Roman",serif;
    font-size:28px;
    letter-spacing:.14em;
    line-height:1;
    text-transform:uppercase;
}

.brand-sub{
    display:block;
    font-family:Inter,Arial,sans-serif;
    font-size:8px;
    font-weight:500;
    line-height:1.2;
    letter-spacing:.32em;
    color:var(--gold-dark);
    margin-top:7px;
}

/* =========================================================
   BREADCRUMBS
========================================================= */

.crumbs{
    width:100%;
    max-width:var(--max);
    margin:0 auto;
    padding:30px 42px 10px;
    color:var(--muted);
    font-size:10px;
    letter-spacing:.18em;
    text-transform:uppercase;
    overflow:hidden;
}

.crumbs a:hover{
    color:var(--gold-dark);
}

.crumbs span{
    overflow-wrap:anywhere;
}

/* =========================================================
   MAIN
========================================================= */

.atelier{
    width:100%;
    max-width:var(--max);
    margin:0 auto;
    padding:28px 42px 90px;
}

/* =========================================================
   HERO
========================================================= */

.hero-grid{
    display:grid;
    grid-template-columns:minmax(0,1.12fr) minmax(360px,.88fr);
    gap:76px;
    align-items:start;
}

/* =========================================================
   GALLERY
========================================================= */

.gallery{
    min-width:0;
}

.gallery-label{
    display:block;
    position:relative;
    z-index:2;
    font-size:9px;
    letter-spacing:.24em;
    text-transform:uppercase;
    color:var(--muted);
    margin-bottom:18px;
    padding-left:2px;
    min-height:14px;
}

.main-media{
    position:relative;
    isolation:isolate;
    background:var(--paper);
    min-height:680px;
    height:680px;
    border:1px solid rgba(17,17,17,.08);
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
}

.main-media::before{
    content:"";
    position:absolute;
    width:72%;
    height:72%;
    border-radius:50%;
    background:radial-gradient(
        circle,
        rgba(201,162,77,.12),
        transparent 68%
    );
    pointer-events:none;
}

.main-media img,
.main-media video{
    position:relative;
    z-index:1;
    width:100%;
    height:100%;
    object-fit:contain;
    display:block;
}

.media-count{
    position:absolute;
    z-index:3;
    right:22px;
    bottom:20px;
    font-size:9px;
    letter-spacing:.16em;
    color:var(--muted);
    background:rgba(251,249,244,.78);
    padding:6px 9px;
}

.gallery-nav{
    position:absolute;
    z-index:5;
    left:18px;
    right:18px;
    top:50%;
    transform:translateY(-50%);
    display:flex;
    justify-content:space-between;
    pointer-events:none;
}

.gallery-arrow{
    pointer-events:auto;
    width:42px;
    height:42px;
    border:1px solid var(--line);
    border-radius:50%;
    background:rgba(251,249,244,.88);
    cursor:pointer;
    display:grid;
    place-items:center;
    transition:.25s;
}

.gallery-arrow:hover{
    border-color:var(--gold);
    transform:scale(1.04);
}

.gallery-arrow svg{
    width:17px;
    height:17px;
    stroke:currentColor;
    fill:none;
    stroke-width:1.4;
}

.thumbs{
    display:flex;
    gap:10px;
    overflow-x:auto;
    padding:16px 0 4px;
    scrollbar-width:thin;
}

.thumb{
    flex:0 0 86px;
    height:86px;
    background:var(--paper);
    border:1px solid var(--line);
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
    overflow:hidden;
}

.thumb.active{
    border-color:var(--gold);
    box-shadow:inset 0 0 0 1px var(--gold);
}

.thumb img,
.thumb video{
    width:100%;
    height:100%;
    object-fit:contain;
}

.thumb-video-mark{
    position:absolute;
    right:7px;
    bottom:7px;
    width:19px;
    height:19px;
    border-radius:50%;
    background:#111;
    color:#fff;
    display:grid;
    place-items:center;
    font-size:8px;
}

/* =========================================================
   PRODUCT COPY
========================================================= */

.product-copy{
    min-width:0;
    padding:26px 0 0;
}

.eyebrow{
    font-size:10px;
    letter-spacing:.35em;
    color:var(--gold-dark);
    text-transform:uppercase;
    margin-bottom:18px;
}

.product-title{
    font-family:"Cormorant Garamond",Georgia,serif;
    font-size:clamp(48px,5.1vw,78px);
    line-height:.92;
    font-weight:500;
    letter-spacing:-.025em;
    max-width:650px;
    overflow-wrap:anywhere;
}

.product-rule{
    width:72px;
    height:1px;
    background:var(--gold);
    margin:28px 0;
}

.price{
    font-family:"Cormorant Garamond",Georgia,serif;
    font-size:35px;
}

.availability{
    display:flex;
    align-items:center;
    gap:9px;
    margin:18px 0 28px;
    font-size:10px;
    letter-spacing:.18em;
    text-transform:uppercase;
    color:#555;
}

.availability-dot{
    width:7px;
    height:7px;
    flex:0 0 7px;
    border-radius:50%;
    background:#4b6b45;
}

.availability-dot.out{
    background:#8b3838;
}

.lead{
    font-family:"Cormorant Garamond",Georgia,serif;
    font-size:17px;
    line-height:1.75;
    color:#45423c;
    max-width:530px;
}

/* =========================================================
   PURCHASE
========================================================= */

.purchase{
    margin-top:36px;
    border-top:1px solid var(--line);
    border-bottom:1px solid var(--line);
    padding:22px 0;
}

.quantity-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:20px;
    margin-bottom:18px;
}

.quantity-label{
    font-size:9px;
    letter-spacing:.24em;
    text-transform:uppercase;
    color:var(--muted);
}

.qty{
    display:flex;
    align-items:center;
    border:1px solid var(--line);
}

.qty button{
    width:36px;
    height:38px;
    border:0;
    background:transparent;
    cursor:pointer;
    font-size:17px;
}

.qty button:hover{
    background:#fffaf0;
}

.qty span{
    width:40px;
    text-align:center;
    font-size:12px;
}

.primary-actions{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
}

.action{
    min-width:0;
    height:52px;
    border:1px solid var(--ink);
    background:transparent;
    cursor:pointer;
    text-transform:uppercase;
    letter-spacing:.17em;
    font-size:10px;
    transition:.25s;
}

.action.primary{
    background:var(--ink);
    color:var(--ivory);
}

.action:hover{
    transform:translateY(-1px);
}

.action.primary:hover{
    background:#292723;
}

.action.secondary:hover{
    background:#fffaf0;
    border-color:var(--gold);
}

.action:disabled{
    cursor:not-allowed;
    opacity:.45;
    transform:none;
}

.secondary-actions{
    display:flex;
    gap:20px;
    margin-top:18px;
}

.text-action{
    border:0;
    background:none;
    cursor:pointer;
    font-size:10px;
    letter-spacing:.13em;
    text-transform:uppercase;
    color:#5f5a51;
    padding:4px 0;
    border-bottom:1px solid transparent;
}

.text-action:hover{
    color:var(--gold-dark);
    border-color:var(--gold);
}

/* =========================================================
   TRUST
========================================================= */

.trust{
    display:grid;
    grid-template-columns:repeat(3,minmax(0,1fr));
    gap:14px;
    margin-top:30px;
}

.trust-item{
    border-top:1px solid var(--line);
    padding-top:13px;
    font-size:9px;
    line-height:1.55;
    color:var(--muted);
    text-transform:uppercase;
    letter-spacing:.11em;
}

/* =========================================================
   EDITORIAL
========================================================= */

.editorial{
    margin-top:110px;
    border-top:1px solid var(--line);
    padding-top:80px;
}

.section-head{
    display:grid;
    grid-template-columns:180px minmax(0,1fr);
    gap:55px;
    margin-bottom:48px;
}

.section-number{
    font-size:10px;
    letter-spacing:.22em;
    color:var(--gold-dark);
    text-transform:uppercase;
}

.section-title{
    font-family:"Cormorant Garamond",Georgia,serif;
    font-size:52px;
    font-weight:500;
    line-height:1;
}

.section-intro{
    max-width:700px;
    margin-top:10px;
    font-family:"Cormorant Garamond",Georgia,serif;
    font-size:18px;
    line-height:1.8;
    color:#4b4841;
}

/* =========================================================
   DETAILS
========================================================= */

.details-grid{
    display:grid;
    grid-template-columns:minmax(0,1fr) minmax(0,1fr);
    column-gap:90px;
}

.detail{
    min-width:0;
    padding:22px 0;
    border-bottom:1px solid var(--line);
    display:grid;
    grid-template-columns:minmax(105px,auto) minmax(0,1fr);
    align-items:start;
    column-gap:28px;
    font-size:11px;
}

.detail strong{
    min-width:0;
    font-weight:500;
    text-transform:uppercase;
    letter-spacing:.14em;
    color:#5e5a52;
    white-space:nowrap;
}

.detail span{
    min-width:0;
    color:#8a857b;
    text-align:right;
    overflow-wrap:anywhere;
}

/* =========================================================
   STATEMENT
========================================================= */

.statement{
    margin-top:90px;
    background:#111;
    color:var(--ivory);
    min-height:390px;
    display:grid;
    place-items:center;
    text-align:center;
    padding:60px 30px;
    position:relative;
    overflow:hidden;
}

.statement::before{
    content:"50";
    position:absolute;
    font-family:Georgia,serif;
    font-size:300px;
    color:rgba(255,255,255,.025);
    line-height:.8;
}

.statement-inner{
    position:relative;
    z-index:1;
    max-width:900px;
}

.statement-small{
    font-size:9px;
    letter-spacing:.35em;
    color:var(--gold);
    text-transform:uppercase;
}

.statement h2{
    font-family:"Cormorant Garamond",Georgia,serif;
    font-size:clamp(44px,6vw,78px);
    font-weight:500;
    line-height:.95;
    margin:18px 0;
}

.statement p{
    max-width:570px;
    margin:auto;
    color:#bdb7aa;
    font-family:"Cormorant Garamond",Georgia,serif;
    font-size:17px;
    line-height:1.7;
}

/* =========================================================
   RELATED
========================================================= */

.related{
    margin-top:100px;
}

.related-grid{
    display:grid;
    grid-template-columns:repeat(4,minmax(0,1fr));
    gap:18px;
}

.related-card{
    min-width:0;
    background:var(--paper);
    border:1px solid rgba(17,17,17,.08);
    padding:16px;
    transition:.25s;
}

.related-card:hover{
    transform:translateY(-4px);
    border-color:rgba(201,162,77,.55);
}

.related-media{
    width:100%;
    height:240px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#f8f5ed;
    margin-bottom:18px;
    overflow:hidden;
}

.related-media img,
.related-media video{
    width:100%;
    height:100%;
    object-fit:contain;
}

.related-name{
    font-family:"Cormorant Garamond",Georgia,serif;
    font-size:20px;
    font-weight:500;
    line-height:1.05;
    overflow-wrap:anywhere;
}

.related-price{
    font-size:11px;
    color:var(--muted);
    margin-top:8px;
}

.related-link{
    display:inline-block;
    margin-top:15px;
    font-size:9px;
    letter-spacing:.17em;
    text-transform:uppercase;
    color:var(--gold-dark);
}

/* =========================================================
   TOAST
========================================================= */

.toast{
    position:fixed;
    left:50%;
    bottom:28px;
    transform:translate(-50%,20px);
    background:#111;
    color:#fffdf8;
    padding:14px 22px;
    font-size:10px;
    letter-spacing:.12em;
    text-transform:uppercase;
    opacity:0;
    pointer-events:none;
    transition:.3s;
    z-index:300;
    max-width:calc(100vw - 30px);
    text-align:center;
}

.toast.show{
    opacity:1;
    transform:translate(-50%,0);
}

/* =========================================================
   EMPTY
========================================================= */

.empty{
    min-height:70vh;
    display:grid;
    place-items:center;
    text-align:center;
    padding:50px 20px;
}

.empty h1{
    font-family:"Cormorant Garamond",Georgia,serif;
    font-size:56px;
    font-weight:500;
}

.empty p{
    color:var(--muted);
    margin-top:10px;
}

.empty a{
    display:inline-block;
    margin-top:20px;
    text-decoration:underline;
}

/* =========================================================
   50 MIRARS — ROYAL EDITORIAL FOOTER
========================================================= */

.main-footer{
    width:100%;
    background:#f7f3e9;
    color:#111;
    border-top:1px solid rgba(17,17,17,.12);
}


/* =========================================================
   FOOTER INNER
========================================================= */

.footer-container{
    width:100%;
    max-width:1450px;
    margin:0 auto;
    padding:72px 55px 0;
}


/* =========================================================
   TOP FOOTER
========================================================= */

.footer-top{
    display:grid;

    grid-template-columns:
        1.45fr
        1fr
        1fr
        1fr
        .9fr;

    gap:42px;

    padding-bottom:62px;
}


/* =========================================================
   BRAND
========================================================= */

.footer-brand{
    min-width:0;
    padding-right:25px;
}


.footer-brand-name{
    display:inline-block;

    color:#111;

    font-family:
        Georgia,
        "Times New Roman",
        serif;

    font-size:
        clamp(40px,4vw,58px);

    font-weight:400;

    letter-spacing:.12em;

    line-height:1;

    text-decoration:none;
}


.footer-brand-name:hover{
    opacity:.7;
}


.footer-brand-sub{
    margin-top:13px;

    font-size:9px;

    font-weight:600;

    letter-spacing:.27em;

    color:#39362f;
}


.footer-brand-line{
    width:46px;
    height:2px;

    margin-top:28px;

    background:#c9a24d;
}


.footer-brand-text{
    margin-top:19px;

    font-family:
        Georgia,
        "Times New Roman",
        serif;

    font-size:16px;

    font-style:italic;

    line-height:1.65;

    color:#555047;
}


/* =========================================================
   FOOTER COLUMNS
========================================================= */

.footer-column{
    min-width:0;

    padding-left:30px;

    border-left:
        1px solid
        rgba(155,118,44,.35);

    display:flex;

    flex-direction:column;

    align-items:flex-start;
}


.footer-column h3{
    margin:0 0 21px;

    font-size:10px;

    font-weight:700;

    letter-spacing:.19em;

    text-transform:uppercase;

    color:#1a1815;
}


.footer-column a{
    position:relative;

    display:inline-block;

    width:max-content;
    max-width:100%;

    margin-bottom:12px;

    color:#555047;

    font-size:13px;

    line-height:1.5;

    text-decoration:none;

    transition:
        color .25s ease,
        transform .25s ease;
}


.footer-column a::after{
    content:"";

    position:absolute;

    left:0;
    bottom:-3px;

    width:0;
    height:1px;

    background:#c9a24d;

    transition:
        width .25s ease;
}


.footer-column a:hover{
    color:#111;

    transform:translateX(3px);
}


.footer-column a:hover::after{
    width:100%;
}


/* =========================================================
   SOCIAL
========================================================= */

.footer-social-icons{
    display:flex;

    align-items:center;

    gap:14px;

    margin-bottom:18px;
}


.footer-social-icon{
    width:40px;
    height:40px;

    border:
        1px solid
        rgba(17,17,17,.35);

    border-radius:50%;

    display:flex;

    align-items:center;
    justify-content:center;

    color:#111;

    transition:
        background .25s ease,
        color .25s ease,
        border-color .25s ease,
        transform .25s ease;
}


.footer-social-icon:hover{
    background:#111;

    color:#f7f3e9;

    border-color:#111;

    transform:translateY(-2px);
}


.footer-social-icon svg{
    width:18px;
    height:18px;

    display:block;

    fill:none;

    stroke:currentColor;

    stroke-width:1.5;
}


.footer-social-icon.whatsapp svg{
    fill:currentColor;

    stroke:none;
}


.footer-social-text{
    margin:0;

    font-family:
        Georgia,
        "Times New Roman",
        serif;

    font-size:14px;

    line-height:1.65;

    font-style:italic;

    color:#555047;
}


/* =========================================================
   GOLD DIVIDER
========================================================= */

.footer-divider{
    width:100%;

    height:1px;

    background:
        rgba(155,118,44,.38);
}


/* =========================================================
   COPYRIGHT
========================================================= */

.footer-bottom{
    min-height:72px;

    display:flex;

    align-items:center;

    justify-content:center;

    text-align:center;

    padding:20px 10px;
}


.footer-copyright{
    font-size:10px;

    line-height:1.7;

    letter-spacing:.08em;

    color:#6d685f;
}


/* =========================================================
   RESPONSIVE — TABLET
========================================================= */

@media(max-width:1050px){

    .footer-container{
        padding:
            62px
            30px
            0;
    }

    .footer-top{
        grid-template-columns:
            1.4fr
            1fr
            1fr;

        gap:40px;
    }

    .footer-brand{
        grid-column:1 / -1;

        padding-right:0;

        padding-bottom:15px;
    }

    .footer-column{
        padding-left:24px;
    }

}


/* =========================================================
   RESPONSIVE — MOBILE
========================================================= */

@media(max-width:700px){

    .footer-container{
        padding:
            55px
            22px
            0;
    }

    .footer-top{
        grid-template-columns:1fr;

        gap:0;

        padding-bottom:42px;
    }

    .footer-brand{
        padding-bottom:38px;

        text-align:center;

        display:flex;

        flex-direction:column;

        align-items:center;
    }

    .footer-brand-name{
        font-size:38px;

        letter-spacing:.10em;
    }

    .footer-brand-sub{
        font-size:8px;

        letter-spacing:.22em;
    }

    .footer-brand-text{
        font-size:15px;
    }

    .footer-column{
        padding:
            27px
            0;

        border-left:0;

        border-top:
            1px solid
            rgba(155,118,44,.25);

        align-items:center;

        text-align:center;
    }

    .footer-column h3{
        margin-bottom:18px;
    }

    .footer-column a{
        width:auto;
    }

    .footer-column a:hover{
        transform:none;
    }

    .footer-social-icons{
        justify-content:center;
    }

    .footer-social-text{
        text-align:center;
    }

}


/* =========================================================
   SMALL MOBILE
========================================================= */

@media(max-width:400px){

    .footer-container{
        padding-left:16px;
        padding-right:16px;
    }

    .footer-brand-name{
        font-size:32px;
    }

    .footer-brand-sub{
        font-size:7px;

        letter-spacing:.18em;
    }

    .footer-copyright{
        font-size:9px;
    }

}
</style>

</head>

<body>

<header class="site-header">

    <a href="index.html" class="brand-link">

        <div class="brand">

            50 MIRARS

            <span class="brand-sub">
                THE WATCH &amp; SUNGLASSES STORE
            </span>

        </div>

    </a>

</header>

<div id="app"></div>

<div
    class="toast"
    id="toast"
    aria-live="polite"

const params = new URLSearchParams(location.search);

const productId = Number(
    params.get("id")
);

    item => item.id === productId
);

    document.getElementById("app");


/* =========================================================
   HELPERS
========================================================= */

const money = number =>
    "₹" +
    Number(number).toLocaleString("en-IN");


const esc = value =>
    String(value).replace(
        /[&<>"']/g,
        character => ({
            "&":"&amp;",
            "<":"&lt;",
            ">":"&gt;",
            '"':"&quot;",
            "'":"&#039;"
        })[character]
    );


const url = value =>
    encodeURI(value);


const isVideo = file =>
    /\.(mp4|webm|ogg)(\?.*)?$/i.test(file);


/* =========================================================
   NORMALIZE MEDIA
========================================================= */

function getMedia(product){

    if(!product){
        return [];
    }

    if(product.media === "gallery"){
        return (product.gallery || []).map(
            item => ({
                type:item.type,
                file:item.file
            })
        );
    }

    return [{
        type:product.media,
        file:product.file
    }];
}


/* =========================================================
   MEDIA HTML
========================================================= */

function mediaHTML(item, large = false){

    if(!item){
        return "";
    }

    const file =
        typeof item === "string"
            ? item
            : item.file;

    const type =
        typeof item === "string"
            ? (
                isVideo(file)
                    ? "video"
                    : "image"
            )
            : item.type;


    if(
        type === "video" ||
        isVideo(file)
    ){

        return `
            <video
                src="${url(file)}"
                ${
                    large
                        ? "controls"
                        : "muted autoplay"
                }
                playsinline
                loop
                preload="${
                    large
                        ? "metadata"
                        : "none"
                }"
                ${
                    large
                        ? ""
                        : "aria-hidden='true'"
                }
            ></video>
        `;

    }


    return `
        <img
            src="${url(file)}"
            alt="${esc(product.name)}"
            ${
                large
                    ? 'loading="eager"'
                    : 'loading="lazy"'
            }
            draggable="false"
        >
    `;
}

/* =========================================================
   GALLERY
========================================================= */

function buildGallery(media){

    const main =
        document.getElementById(
            "mainMediaContent"
        );

    const thumbs =
        document.getElementById(
            "thumbs"
        );

    const counter =
        document.getElementById(
            "mediaCount"
        );

    if(!media.length){

        main.innerHTML = `
            <div
                style="
                    color:#716d64;
                    font-size:10px;
                    letter-spacing:.15em;
                    text-transform:uppercase;
                "
            >
                No media available
            </div>
        `;

        counter.textContent = "";

        return;
    }


    const show = index => {

        currentMedia =
            (index + media.length) %
            media.length;


        main.innerHTML =
            mediaHTML(
                media[currentMedia],
                true
            );


        counter.textContent =
            `${String(currentMedia + 1).padStart(2,"0")} / ${String(media.length).padStart(2,"0")}`;


        [
            ...thumbs.children
        ].forEach(
            (item,index) => {

                item.classList.toggle(
                    "active",
                    index === currentMedia
                );

            }
        );


        const video =
    main.querySelector("video");

if(video){

    video.currentTime = 0;

    video.play().catch(
        () => {}
    );

}
    };


    thumbs.innerHTML =
        media.map(
            (item,index) => {

                const file =
                    typeof item === "string"
                    ? item
                    : item.file;

                const video =
                    typeof item === "string"
                    ? isVideo(file)
                    : item.type === "video";


                return `

                    <button
                        class="thumb ${
                            index === 0
                            ? "active"
                            : ""
                        }"
                        data-index="${index}"
                        type="button"
                        aria-label="View media ${index + 1}"
                    >

                        ${
                            video

                            ?

                            `

                               <video
    src="${url(firstFile)}"
    muted
    autoplay
    loop
    playsinline
    preload="none"
    aria-hidden="true"
></video>

                                <span class="thumb-video-mark">
                                    ▶
                                </span>

                            `

                            :

                            `

                                <img
                                    src="${url(file)}"
                                    alt="${esc(product.name)} ${index + 1}"
                                    loading="lazy"
                                >

                            `
                        }

                    </button>

                `;

            }
        ).join("");


    thumbs
        .querySelectorAll(".thumb")
        .forEach(button => {

            button.addEventListener(
                "click",
                () => {

                    show(
                        Number(
                            button.dataset.index
                        )
                    );

                }
            );

        });


    const previous =
        document.getElementById(
            "prevMedia"
        );

    const next =
        document.getElementById(
            "nextMedia"
        );


    if(previous){

        previous.addEventListener(
            "click",
            () => show(
                currentMedia - 1
            )
        );

    }


    if(next){

        next.addEventListener(
            "click",
            () => show(
                currentMedia + 1
            )
        );

    }


    show(0);
}


/* =========================================================
   RELATED SUNGLASSES
========================================================= */

function buildRelated(){

    const grid =
        document.getElementById(
            "relatedGrid"
        );

    if(!grid){
        return;
    }


    const candidates =
        sunglasses.filter(
            item =>
                item.id !== product.id
        );


    const sameBrand =
        candidates.filter(
            item =>
                item.brand === product.brand
        );


    const differentBrand =
        candidates.filter(
            item =>
                !sameBrand.includes(item)
        );


    const pool =
        [
            ...sameBrand,
            ...differentBrand
        ].slice(0,4);


    grid.innerHTML =
        pool.map(item => {

            const media =
                getMedia(item);

            const firstMedia =
                media[0];


            const firstFile =
                firstMedia.file;


            const video =
                firstMedia.type === "video" ||
                isVideo(firstFile);


            return `

                <a
                    class="related-card"
                    href="product-detailssunglasses.html?id=${item.id}"
                >

                    <div class="related-media">

                        ${
                            video

                            ?

                            `

                                <video
                                    src="${url(firstFile)}"
                                    muted
                                    autoplay
                                    loop
                                    playsinline
                                    preload="metadata"
                                ></video>

                            `

                            :

                            `

                                <img
                                    src="${url(firstFile)}"
                                    alt="${esc(item.name)}"
                                    loading="lazy"
                                >

                            `
                        }

                    </div>


                    <div class="related-name">
                        ${esc(item.name)}
                    </div>


                    <div class="related-price">
                        ${money(item.price)}
                    </div>


                    <span class="related-link">
                        View Product
                    </span>

                </a>

            `;

        }).join("");
}


/* =========================================================
   CART
========================================================= */

function getCart(){

    try{

        const saved =
            JSON.parse(
                localStorage.getItem("cart") ||
                "[]"
            );

        return Array.isArray(saved)
            ? saved
            : [];

    }catch(error){

        return [];

    }
}


function saveCart(cart){

    localStorage.setItem(
        "cart",
        JSON.stringify(cart)
    );

}


/* =========================================================
   ADD TO CART
========================================================= */

function addToCart(goToCart=false){

    if(product.outOfStock){

        toast(
            "This product is currently out of stock"
        );

        return;
    }


    const cart =
        getCart();


    const existing =
        cart.find(
            item =>
                Number(item.id) ===
                product.id
        );


    if(existing){

        existing.quantity =
            Math.min(
                10,
                Number(
                    existing.quantity || 1
                ) + quantity
            );

    }else{

        cart.push({

            id:product.id,

            name:product.name,

            price:product.price,

            quantity:quantity,

            type:product.media,

            media:getMedia(product).map(
                item => item.file
            )

        });

    }


    saveCart(cart);


    if(goToCart){

        toast(
            "Taking you to your bag"
        );

        setTimeout(
            () => {

                location.href =
                    "cart.html";

            },
            350
        );

    }else{

        toast(
            "Added to your bag"
        );

    }

}


/* =========================================================
   ACTIONS
========================================================= */

function bindActions(){

    const minus =
        document.getElementById(
            "qtyMinus"
        );

    const plus =
        document.getElementById(
            "qtyPlus"
        );

    const value =
        document.getElementById(
            "qtyValue"
        );


    if(minus){

        minus.onclick = () => {

            quantity =
                Math.max(
                    1,
                    quantity - 1
                );

            value.textContent =
                quantity;

        };

    }


    if(plus){

        plus.onclick = () => {

            quantity =
                Math.min(
                    10,
                    quantity + 1
                );

            value.textContent =
                quantity;

        };

    }


    const addCartButton =
        document.getElementById(
            "addCart"
        );


    if(addCartButton){

        addCartButton.onclick = () => {

            addToCart(false);

        };

    }


    const buyNowButton =
        document.getElementById(
            "buyNow"
        );


    if(buyNowButton){

        buyNowButton.onclick = () => {

            addToCart(true);

        };

    }


    const whatsappButton =
        document.getElementById(
            "whatsappBtn"
        );


    if(whatsappButton){

        whatsappButton.onclick = () => {

            const message =
                `Hello 50 Mirars, I am interested in ${product.name} (₹${product.price.toLocaleString("en-IN")}).`;

            const whatsappURL =
                `https://wa.me/918209989013?text=${encodeURIComponent(message)}`;

            window.open(
                whatsappURL,
                "_blank",
                "noopener,noreferrer"
            );

        };

    }

}


/* =========================================================
   TOAST
========================================================= */

function toast(message){

    const element =
        document.getElementById(
            "toast"
        );


    if(!element){
        return;
    }


    element.textContent =
        message;


    element.classList.add(
        "show"
    );


    clearTimeout(
        window.__toastTimer
    );


    window.__toastTimer =
        setTimeout(
            () => {

                element.classList.remove(
                    "show"
                );

            },
            2200
        );

}
