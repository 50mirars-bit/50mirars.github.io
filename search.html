<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=1250"
>

<title>Search Results | 50 Mirars</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial, sans-serif;
    background:#f8f6f1;
    color:#111;
}

/* =========================
   HEADER
========================= */

header{
    padding:25px;
    text-align:center;
    background:#111;
    color:white;
}

header h1{
    font-size:28px;
    letter-spacing:2px;
}

/* =========================
   SEARCH TITLE
========================= */

.search-heading{
    text-align:center;
    padding:50px 20px 30px;
}

.search-heading h2{
    font-size:32px;
    margin-bottom:10px;
}

.search-heading p{
    color:#666;
}

header{
    position:relative;
    padding:20px 30px;
    min-height:90px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#111;
    color:white;
}

.site-logo{
    position:absolute;
    left:30px;
    top:50%;
    transform:translateY(-50%);
    width:120px;
    height:auto;
    object-fit:contain;
}

.back-home{
    position:absolute;
    right:30px;
    top:50%;
    transform:translateY(-50%);

    text-decoration:none;
    color:#111;
    background:white;

    padding:11px 18px;
    border-radius:6px;

    font-size:14px;
    font-weight:bold;

    transition:0.3s;
}

.back-home:hover{
    background:#ddd;
}

header h1{
    font-size:28px;
    letter-spacing:2px;
}
    

/* =========================
   PRODUCTS GRID
========================= */

.products-grid{
    width:90%;
    max-width:1400px;
    margin:auto;

    display:grid;

    grid-template-columns:
        repeat(4,1fr);

    gap:25px;

    padding-bottom:60px;
}

/* =========================
   PRODUCT CARD
========================= */

.product-card{
    background:white;
    border-radius:12px;

    overflow:hidden;

    box-shadow:
        0 5px 20px rgba(0,0,0,0.08);

    transition:0.3s;
}

.product-card:hover{
    transform:translateY(-5px);
}

.product-image{
    width:100%;
    height:280px;

    object-fit:cover;

    background:#f2f2f2;
}

.product-info{
    padding:20px;
}

.product-name{
    font-size:18px;
    font-weight:bold;

    margin-bottom:8px;
}

.product-brand{
    color:#777;

    font-size:14px;

    margin-bottom:10px;
}

.product-price{
    font-size:18px;

    font-weight:bold;

    margin-bottom:15px;
}

.view-product{
    display:block;

    text-align:center;

    text-decoration:none;

    background:#111;

    color:white;

    padding:12px;

    border-radius:6px;

    transition:0.3s;
}

.view-product:hover{
    background:#333;
}

/* =========================
   NO RESULTS
========================= */

.no-results{
    text-align:center;

    padding:80px 20px;

    font-size:20px;

    color:#777;
}

/* =========================
   MOBILE
========================= */

@media(max-width:900px){

    .products-grid{
        grid-template-columns:
            repeat(2,1fr);
    }

}

@media(max-width:600px){

    .products-grid{
        grid-template-columns:
            1fr;
    }

}

</style>

</head>


<body>


<header>

    <img
        src="50 Mirars Logo.png"
        class="site-logo"
        alt="50 Mirars"
    >

    <a
        href="index.html"
        class="back-home"
    >
        ← Back to Home
    </a>

    <h1>50 MIRARS</h1>

</header>

<section class="search-heading">

    <h2 id="searchTitle">
        Search Results
    </h2>

    <p id="searchDescription">
        Discover products from 50 Mirars.
    </p>

</section>


<section>

    <div
        class="products-grid"
        id="productsGrid"
    >

    </div>

</section>

<script src="search-products.js"></script>

<script>

/* =====================================================
   GET SEARCH TERM
===================================================== */

const searchParams =
    new URLSearchParams(
        window.location.search
    );

const searchTerm =
    searchParams.get("q");


/* =====================================================
   ELEMENTS
===================================================== */

const productsGrid =
    document.getElementById("productsGrid");

const searchTitle =
    document.getElementById("searchTitle");

const searchDescription =
    document.getElementById("searchDescription");


/* =====================================================
   SEARCH PRODUCTS
===================================================== */

if(searchTerm){

    const searchText =
        searchTerm
        .toLowerCase()
        .trim();


    searchTitle.textContent =
        `Search Results for "${searchTerm}"`;


    searchDescription.textContent =
        "Products matching your search";


    /* =============================================
       FIND MATCHING PRODUCTS
    ============================================= */

    const results =
        searchProducts.filter(product => {

            return (

                product.name
                    .toLowerCase()
                    .includes(searchText)

                ||

                product.brand
                    .toLowerCase()
                    .includes(searchText)

                ||

                product.category
                    .toLowerCase()
                    .includes(searchText)

            );

        });


    /* =============================================
       SHOW PRODUCTS
    ============================================= */

    if(results.length > 0){

        results.forEach(product => {

            const card =
                document.createElement("div");

            card.className =
                "product-card";


            card.innerHTML = `

                <img
                    src="${product.image}"
                    class="product-image"
                    alt="${product.name}"
                >

                <div class="product-info">

                    <div class="product-name">
                        ${product.name}
                    </div>

                    <div class="product-brand">
                        ${product.brand}
                    </div>

                    <div class="product-price">
                        ${product.price}
                    </div>

                    <a
                        href="${product.link}"
                        class="view-product"
                    >
                        View Product
                    </a>

                </div>

            `;


            productsGrid.appendChild(card);

        });

    }


    /* =============================================
       NO RESULTS
    ============================================= */

    else{

        productsGrid.innerHTML = `

            <div class="no-results">

                No products found for
                "<strong>${searchTerm}</strong>"

            </div>

        `;

    }

}

</script>

</body>

</html>
