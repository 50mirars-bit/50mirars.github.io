<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checkout - Delivery Details</title>

  <!-- Font Awesome for icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    body {
      background: #f5f5f5;
      margin: 0;
      font-family: 'Segoe UI', Arial, sans-serif;
    }

    .delivery-form {
      max-width: 650px;
      margin: 50px auto;
      background: linear-gradient(135deg, #ffffff, #f9f9f9);
      padding: 40px;
      border-radius: 12px;
      box-shadow: 0 6px 18px rgba(0,0,0,0.12);
    }

    .delivery-form h2 {
      margin-bottom: 30px;
      text-align: center;
      font-size: 26px;
      font-weight: 700;
      color: #009688;
      letter-spacing: 1px;
      border-bottom: 2px solid #009688;
      display: inline-block;
      padding-bottom: 5px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      margin-bottom: 20px;
    }

    .form-group label {
      font-weight: 600;
      margin-bottom: 8px;
      color: #444;
    }

    .form-group input,
    .form-group textarea {
      padding: 14px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 15px;
      transition: all 0.3s ease;
      background: #fafafa;
    }

    .form-group input:focus,
    .form-group textarea:focus {
      border-color: #009688;
      background: #fff;
      box-shadow: 0 0 8px rgba(0,150,136,0.25);
      outline: none;
    }

    .progress-bar {
      display: flex;
      justify-content: space-between;
      margin-bottom: 30px;
      position: relative;
      max-width: 650px;
      margin: 30px auto;
    }

    .progress-bar::before {
      content: "";
      position: absolute;
      top: 50%;
      left: 0;
      right: 0;
      height: 4px;
      background: #ddd;
      z-index: 0;
    }

    .step {
      position: relative;
      z-index: 1;
      background: #ddd;
      color: #555;
      font-weight: 600;
      padding: 10px 20px;
      border-radius: 20px;
      transition: all 0.3s ease;
    }

    .step.active {
      background: #009688;
      color: #fff;
      box-shadow: 0 4px 10px rgba(0,150,136,0.3);
    }

    .delivery-form button {
      background: linear-gradient(135deg, #009688, #00796b);
      color: #fff;
      padding: 16px;
      font-size: 18px;
      font-weight: 600;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      width: 100%;
      margin-top: 25px;
      transition: transform 0.2s ease, box-shadow 0.3s ease;
    }

    .delivery-form button:hover {
      transform: translateY(-3px);
      box-shadow: 0 6px 12px rgba(0,0,0,0.15);
    }

    .form-row {
      display: flex;
      gap: 20px;
      margin-bottom: 20px;
    }

    .form-row .form-group {
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    @media (max-width: 768px) {
      .form-row {
        flex-direction: column;
      }
    }

    .input-icon {
      position: relative;
    }

    .input-icon i {
      position: absolute;
      left: 12px;
      top: 40px;
      color: #009688;
      font-size: 16px;
    }

    .input-icon input,
    .input-icon textarea {
      padding-left: 40px;
    }
  </style>
</head>
<body>

  <!-- Progress Bar -->
  <div class="progress-bar">
    <div class="step active">Delivery</div>
    <div class="step">Payment</div>
    <div class="step">Confirmation</div>
  </div>

  <!-- Delivery Form -->
  <div class="delivery-form">
    <h2>Delivery Details</h2>
    <form action="https://formspree.io/f/xdaqrvld" method="POST">

      <div class="form-row">
        <div class="form-group input-icon">
          <label for="name">Full Name</label>
          <i class="fas fa-user"></i>
          <input type="text" name="name" id="name" required>
        </div>
        <div class="form-group input-icon">
          <label for="contact">Contact Number</label>
          <i class="fas fa-phone"></i>
          <input type="tel" name="contact" id="contact" pattern="[0-9]{10}" required>
        </div>
      </div>

      <div class="form-row">
        <div class="form-group input-icon">
          <label for="email">Mail ID</label>
          <i class="fas fa-envelope"></i>
          <input type="email" name="email" id="email" required>
        </div>
        <div class="form-group input-icon">
          <label for="pincode">Pincode</label>
          <i class="fas fa-map-pin"></i>
          <input type="text" name="pincode" id="pincode" pattern="[0-9]{6}" required>
        </div>
      </div>

      <div class="form-row">
        <div class="form-group input-icon">
          <label for="city">City</label>
          <i class="fas fa-city"></i>
          <input type="text" name="city" id="city" required>
        </div>
        <div class="form-group input-icon">
          <label for="state">State</label>
          <i class="fas fa-flag"></i>
          <input type="text" name="state" id="state" required>
        </div>
      </div>

      <div class="form-row">
        <div class="form-group input-icon">
          <label for="landmark">Landmark</label>
          <i class="fas fa-location-dot"></i>
          <input type="text" name="landmark" id="landmark" required>
        </div>
        <div class="form-group input-icon">
          <label for="address">Address</label>
          <i class="fas fa-home"></i>
          <textarea name="address" id="address" rows="3" required></textarea>
        </div>
      </div>

      <!-- Redirect to payment page after submission -->
      <input type="hidden" name="_redirect" value="payment.html">

      <button type="submit">Confirm & Continue</button>
    </form>
  </div>

</body>
</html>
