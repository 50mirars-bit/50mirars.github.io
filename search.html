<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=1250">

<meta
    name="description"
    content="Search luxury watches and sunglasses at 50 Mirars."
>

<title>Search | 50 Mirars</title>

<style>

/* =========================================================
   GLOBAL
========================================================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial, Helvetica, sans-serif;
    background:#fff;
    color:#111;
}

a{
    text-decoration:none;
    color:inherit;
}

img{
    display:block;
    max-width:100%;
}

/* =========================================================
   HEADER
========================================================= */

.search-header{

    background:#fff;
    border-bottom:1px solid #eee;

    padding:25px 40px;

    display:flex;
    align-items:center;
    justify-content:space-between;

    gap:30px;
    flex-wrap:wrap;
}

.brand{

    display:flex;
    align-items:center;
    gap:18px;
}

.brand img{
    height:60px;
}

.brand-text h1{

    font-family:Georgia,"Times New Roman",serif;

    font-size:34px;

    letter-spacing:5px;
}

.brand-text span{

    color:#b38a38;

    font-size:10px;

    letter-spacing:3px;

    font-weight:bold;
}

/* =========================================================
   BACK BUTTON
========================================================= */

.back-btn{

    padding:12px 24px;

    border:1px solid #111;

    border-radius:30px;

    transition:.3s;
}

.back-btn:hover{

    background:#111;

    color:#fff;
}

/* =========================================================
   PAGE TITLE
========================================================= */

.page-title{

    text-align:center;

    padding:45px 20px 20px;
}

.page-title h2{

    font-family:Georgia,"Times New Roman",serif;

    font-size:42px;

    margin-bottom:10px;
}

.page-title p{

    color:#666;

    font-size:17px;
}

/* =========================================================
   RESULTS CONTAINER
========================================================= */

.results-container{

    max-width:1400px;

    margin:auto;

    padding:30px 40px 80px;
}

.results-grid{

    display:grid;

    grid-template-columns:repeat(4,1fr);

    gap:28px;
}

/* =========================================================
   PRODUCT CARD
========================================================= */

.product-card{

    background:#fff;

    border:1px solid #eee;

    border-radius:16px;

    overflow:hidden;

    transition:.35s;
}

.product-card:hover{

    transform:translateY(-6px);

    box-shadow:0 18px 35px rgba(0,0,0,.12);
}

.product-card img{

    width:100%;

    height:280px;

    object-fit:cover;
}

.product-card video{

    width:100%;

    height:280px;

    object-fit:cover;

    display:block;
}

.product-info{

    padding:20px;
}

.category{

    display:inline-block;

    background:#faf5e6;

    color:#b38a38;

    padding:6px 12px;

    border-radius:20px;

    font-size:12px;

    font-weight:bold;

    margin-bottom:12px;
}

.product-info h3{

    font-size:19px;

    margin-bottom:12px;

    line-height:1.35;
}

.price{

    font-size:22px;

    font-weight:bold;

    color:#111;

    margin-bottom:18px;
}

.view-btn{

    display:block;

    text-align:center;

    background:#111;

    color:#fff;

    padding:13px;

    border-radius:8px;

    transition:.3s;
}

.view-btn:hover{

    background:#b38a38;
}

/* =========================================================
   EMPTY STATE
========================================================= */

.no-results{

    text-align:center;

    padding:80px 20px;

    grid-column:1/-1;
}

.no-results h3{

    font-size:34px;

    margin-bottom:12px;
}

.no-results p{

    color:#666;

    font-size:17px;

    line-height:1.6;
}

/* =========================================================
   ERROR STATE
========================================================= */

.search-error{

    text-align:center;

    padding:80px 20px;

    grid-column:1/-1;
}

.search-error h3{

    font-size:30px;

    margin-bottom:12px;
}

.search-error p{

    color:#666;

    line-height:1.7;
}

/* =========================================================
   RESPONSIVE
========================================================= */

@media(max-width:1200px){

    .results-grid{
        grid-template-columns:repeat(3,1fr);
    }

}

@media(max-width:850px){

    .results-grid{
        grid-template-columns:repeat(2,1fr);
    }

    .search-header{
        padding:20px;
    }

}

@media(max-width:550px){

    .results-grid{
        grid-template-columns:1fr;
    }

    .page-title h2{
        font-size:30px;
    }

    .brand-text h1{
        font-size:24px;
    }

}

</style>

</head>

<body>

<!-- =========================================================
     HEADER
========================================================= -->

<header class="search-header">

    <div class="brand">

        <img
            src="logo.jpeg"
            alt="50 Mirars Logo"
        >

        <div class="brand-text">

            <h1>50 MIRARS</h1>

            <span>WATCHES • SUNGLASSES</span>

        </div>

    </div>

    <a
        href="index.html"
        class="back-btn"
    >
        ← Back to Home
    </a>

</header>


<!-- =========================================================
     TITLE
========================================================= -->

<section class="page-title">

    <h2 id="searchTitle">
        Search Results
    </h2>

    <p>
        Discover luxury watches and premium sunglasses.
    </p>

</section>


<!-- =========================================================
     RESULTS
========================================================= -->

<section class="results-container">

    <div
        class="results-grid"
        id="resultsGrid"
    ></div>

</section>


<!-- =========================================================
     PRODUCT DATABASE
========================================================= -->

<script src="products.js"></script>


<!-- =========================================================
     SEARCH ENGINE
========================================================= -->

<script>

document.addEventListener("DOMContentLoaded", function(){

    const params = new URLSearchParams(
        window.location.search
    );

    const query = (
        params.get("q") || ""
    ).trim();


    const searchTitle =
        document.getElementById("searchTitle");

    const grid =
        document.getElementById("resultsGrid");


    /* =====================================================
       CHECK PRODUCT DATABASE
    ===================================================== */

    if(
        typeof products === "undefined" ||
        !Array.isArray(products)
    ){

        searchTitle.textContent =
            "Search";

        grid.innerHTML = `

            <div class="search-error">

                <h3>Search is temporarily unavailable</h3>

                <p>
                    The product database could not be loaded.
                    Please refresh the page and try again.
                </p>

            </div>

        `;

        return;
    }


    /* =====================================================
       EMPTY SEARCH
    ===================================================== */

    if(!query){

        searchTitle.textContent =
            "Search Products";

        grid.innerHTML = `

            <div class="no-results">

                <h3>Search for a Product</h3>

                <p>
                    Search by product name, brand or category.
                </p>

            </div>

        `;

        return;
    }


    /* =====================================================
       PAGE TITLE
    ===================================================== */

    searchTitle.textContent =
        `Search results for "${query}"`;


    /* =====================================================
       NORMALIZE SEARCH
    ===================================================== */

    const searchTerm = query
        .toLowerCase()
        .replace(/\s+/g, " ")
        .trim();


    /* =====================================================
       SEARCH COMPLETE PRODUCT DATABASE
    ===================================================== */

    const results = products.filter(function(product){

        const name =
            String(product.name || "").toLowerCase();

        const brand =
            String(product.brand || "").toLowerCase();

        const category =
            String(product.category || "").toLowerCase();

        const searchableText = [

            name,
            brand,
            category

        ].join(" ");


        return searchableText.includes(searchTerm);

    });


    /* =====================================================
       NO RESULTS
    ===================================================== */

    if(results.length === 0){

        grid.innerHTML = `

            <div class="no-results">

                <h3>No Products Found</h3>

                <p>
                    We couldn't find any products matching
                    "<strong>${escapeHTML(query)}</strong>".
                </p>

                <p style="margin-top:10px;">
                    Try searching for a brand such as
                    Rolex, Cartier, Tommy Hilfiger, Tissot,
                    Seiko or Guess.
                </p>

            </div>

        `;

        return;
    }


    /* =====================================================
       DISPLAY RESULTS
    ===================================================== */

    grid.innerHTML = "";


    results.forEach(function(product){

        const card =
            document.createElement("div");

        card.className =
            "product-card";


        /* =================================================
           MEDIA
        ================================================= */

        let mediaHTML = "";


        if(product.image){

            mediaHTML = `

                <img
                    src="${escapeAttribute(product.image)}"
                    alt="${escapeAttribute(product.name)}"
                    loading="lazy"
                >

            `;

        }

        else if(product.video){

            mediaHTML = `

                <video
                    src="${escapeAttribute(product.video)}"
                    autoplay
                    muted
                    loop
                    playsinline
                    preload="metadata"
                ></video>

            `;

        }

        else{

            mediaHTML = `

                <div
                    style="
                        height:280px;
                        display:flex;
                        align-items:center;
                        justify-content:center;
                        background:#f7f7f7;
                        color:#777;
                    "
                >
                    No Image Available
                </div>

            `;

        }


        /* =================================================
           CARD
        ================================================= */

        card.innerHTML = `

            ${mediaHTML}

            <div class="product-info">

                <span class="category">
                    ${escapeHTML(product.category || "")}
                </span>

                <h3>
                    ${escapeHTML(product.name || "")}
                </h3>

                <div class="price">
                    ${escapeHTML(product.price || "")}
                </div>

                <a
                    href="${escapeAttribute(product.link || "#")}"
                    class="view-btn"
                >
                    View Product
                </a>

            </div>

        `;


        grid.appendChild(card);

    });

});


/* =========================================================
   SECURITY / HTML HELPERS
========================================================= */

function escapeHTML(value){

    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}


function escapeAttribute(value){

    return escapeHTML(value);

}

</script>

</body>

</html>
