<style>
.delivery-form {
  max-width: 500px;
  margin: 40px auto;
  background: #fff;
  padding: 25px;
  border-radius: 8px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.1);
}

.delivery-form h2 {
  margin-bottom: 20px;
  text-align: center;
  font-size: 22px;
  font-weight: 700;
}

.form-group {
  display: flex;
  flex-direction: column;
  margin-bottom: 15px;
}

.form-group label {
  font-weight: 600;
  margin-bottom: 5px;
}

.form-group input,
.form-group textarea {
  padding: 10px;
  border: 1px solid #ccc;
  border-radius: 6px;
  font-size: 14px;
}

.delivery-form button {
  background-color: #009688; /* same as Apply Coupon */
  color: #fff;
  padding: 12px;
  font-size: 16px;
  border: none;
  border-radius: 6px;
  cursor: pointer;
  width: 100%;
  margin-top: 10px;
}

.delivery-form button:hover {
  background-color: #00796b;
}

</style>
</head>

<div class="delivery-form">
  <h2>Delivery Details</h2>
  <form id="deliveryForm" onsubmit="return validateForm()">
    
    <div class="form-group">
      <label for="name">Full Name</label>
      <input type="text" id="name" required>
    </div>

    <div class="form-group">
      <label for="contact">Contact Number</label>
      <input type="tel" id="contact" pattern="[0-9]{10}" required>
    </div>

    <div class="form-group">
      <label for="email">Mail ID</label>
      <input type="email" id="email" required>
    </div>

    <div class="form-group">
      <label for="address">Address</label>
      <textarea id="address" rows="3" required></textarea>
    </div>

    <div class="form-group">
      <label for="city">City</label>
      <input type="text" id="city" required>
    </div>

    <div class="form-group">
      <label for="state">State</label>
      <input type="text" id="state" required>
    </div>

    <div class="form-group">
      <label for="pincode">Pincode</label>
      <input type="text" id="pincode" pattern="[0-9]{6}" required>
    </div>

    <div class="form-group">
      <label for="landmark">Landmark</label>
      <input type="text" id="landmark" required>
    </div>

    <button type="submit">Confirm & Continue</button>
  </form>
</div>

<script>

function validateForm() {
  const fields = ["name", "contact", "email", "address", "city", "state", "pincode", "landmark"];
  for (let id of fields) {
    const value = document.getElementById(id).value.trim();
    if (!value) {
      alert("Please fill all mandatory fields.");
      return false;
    }
  }
  alert("Delivery details confirmed!");
  window.location.href = "payment.html"; // redirect to payment page
  return true;
}

emailjs.send("service_id","template_id",{
  name: document.getElementById("name").value,
  contact: document.getElementById("contact").value,
  email: document.getElementById("email").value,
  address: document.getElementById("address").value,
  city: document.getElementById("city").value,
  state: document.getElementById("state").value,
  pincode: document.getElementById("pincode").value,
  landmark: document.getElementById("landmark").value
});

</script>
