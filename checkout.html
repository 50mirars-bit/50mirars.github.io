<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checkout - Delivery Details</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    body {
      margin:0;
      font-family:'Segoe UI',Arial,sans-serif;
      background:linear-gradient(135deg,#009688,#004d40);
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
    }
    .delivery-form {
      width:90%;
      max-width:800px;
      background:#ffffff;
      padding:40px;
      border-radius:16px;
      box-shadow:0 10px 25px rgba(0,0,0,0.25);
      animation:fadeIn 0.6s ease;
    }
    @keyframes fadeIn {
      from {opacity:0; transform:translateY(20px);}
      to {opacity:1; transform:translateY(0);}
    }
    .delivery-form h2 {
      text-align:center;
      font-size:28px;
      font-weight:700;
      color:#004d40;
      margin-bottom:30px;
      position:relative;
    }
    .delivery-form h2::after {
      content:"";
      display:block;
      width:60px;
      height:3px;
      background:#009688;
      margin:10px auto 0;
      border-radius:2px;
    }
    .form-section {
      margin-bottom:30px;
    }
    .row {
      display:flex;
      gap:20px;
      margin-bottom:20px;
      flex-wrap:wrap;
    }
    .row .input-group {
      flex:1;
      display:flex;
      flex-direction:column;
    }
    label {
      font-weight:600;
      margin-bottom:6px;
      color:#333;
    }
    input, textarea {
      padding:12px;
      border:1px solid #ccc;
      border-radius:8px;
      font-size:15px;
      outline:none;
      transition:0.3s;
      background:#fafafa;
    }
    input:focus, textarea:focus {
      border-color:#009688;
      box-shadow:0 0 8px rgba(0,150,136,0.4);
      background:#fff;
    }
    textarea {
      resize:none;
      min-height:90px;
    }
    .submit-btn {
      width:100%;
      padding:16px;
      background:linear-gradient(135deg,#009688,#00796b);
      color:#fff;
      font-size:17px;
      font-weight:600;
      border:none;
      border-radius:10px;
      cursor:pointer;
      transition:0.3s;
      letter-spacing:0.5px;
    }
    .submit-btn:hover {
      background:linear-gradient(135deg,#00796b,#004d40);
      transform:translateY(-2px);
      box-shadow:0 6px 12px rgba(0,0,0,0.2);
    }
  </style>
</head>
<body>

    <h2>Delivery Details</h2>
    <form id="checkoutForm" action="sendmail.php" method="POST">

      <!-- Section 1: Name + Contact + Email -->
      <div class="form-section">
        <div class="row">
          <div class="input-group">
            <label for="name">Full Name</label>
            <input type="text" id="name" name="name" required>
          </div>
          <div class="input-group">
            <label for="contact">Contact Number</label>
            <input type="tel" id="contact" name="contact" required>
          </div>
        </div>
        <div class="row">
          <div class="input-group" style="flex:1;">
            <label for="email">Email ID</label>
            <input type="email" id="email" name="email" required>
          </div>
        </div>
      </div>
