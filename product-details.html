<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<meta
    name="theme-color"
    content="#f7f3e9"
>

<meta
    name="description"
    content="50 Mirars — Royal Watch Atelier. Explore the selected watch in a premium editorial product experience."
>

<title>Product Details | 50 Mirars</title>


<style>

/* =========================================================
   50 MIRARS — ROYAL WATCH ATELIER
   PRODUCT DETAILS
   ========================================================= */

@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Inter:wght@300;400;500;600&display=swap');


/* =========================================================
   ROOT
   ========================================================= */

:root{

    --ivory:#f7f3e9;
    --paper:#fbf9f4;

    --ink:#111111;
    --muted:#716d64;

    --gold:#c9a24d;
    --gold-dark:#9b762c;

    --line:rgba(17,17,17,.14);

    --max:1320px;

}


/* =========================================================
   RESET
   ========================================================= */

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html{
    scroll-behavior:smooth;
}

body{
    background:var(--ivory);
    color:var(--ink);

    font-family:
        Inter,
        Arial,
        Helvetica,
        sans-serif;

    overflow-x:hidden;
}

img,
video{
    max-width:100%;
}

a{
    color:inherit;
    text-decoration:none;
}

button{
    font:inherit;
}

::selection{
    background:var(--gold);
    color:#111;
}


/* =========================================================
   HEADER
   ========================================================= */

.site-header{

    min-height:100px;

    border-bottom:1px solid var(--line);

    display:flex;
    align-items:center;

    padding:0 48px;

    background:rgba(247,243,233,.96);

    backdrop-filter:blur(14px);

    position:sticky;
    top:0;

    z-index:100;

}


.brand{

    display:inline-block;

    font-family:
        Georgia,
        "Times New Roman",
        serif;

    font-size:28px;

    letter-spacing:.14em;

    line-height:1;

    text-transform:uppercase;

}


.brand-sub{

    display:block;

    font-family:Inter,Arial,sans-serif;

    font-size:8px;

    font-weight:500;

    line-height:1.2;

    letter-spacing:.32em;

    color:var(--gold-dark);

    text-align:left;

    margin-top:7px;

}


/* =========================================================
   MAIN CONTAINER
   ========================================================= */

.crumbs{
    width:100%;
    max-width:var(--max);

    margin:0 auto;

    padding:
        30px
        42px
        10px;

    color:var(--muted);

    font-size:10px;

    letter-spacing:.18em;

    text-transform:uppercase;

    overflow:hidden;

}

.crumbs a:hover{
    color:var(--gold-dark);
}

.crumbs span{
    display:inline;


    overflow-wrap:anywhere;

}


.atelier{

    width:100%;
    max-width:var(--max);

    margin:0 auto;

    padding:
        28px
        42px
        90px;

}


/* =========================================================
   HERO
   ========================================================= */

.hero-grid{

    display:grid;

    grid-template-columns:
        minmax(0,1.12fr)
        minmax(360px,.88fr);

    gap:76px;

    align-items:start;

}


/* =========================================================
   GALLERY
========================================================= */

.gallery {
    min-width: 0;
}

/* LABEL IS NOW OUTSIDE THE IMAGE / VIDEO */
.gallery-label {
    display:block;
    position:relative;
    z-index:2;
    font-size: 9px;
    letter-spacing: .24em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 18px;
    padding-left: 2px;
    min-height:14px;
}

/* MAIN MEDIA BOX */
.main-media {
    position: relative;
    isolation:isolate;
    background: var(--paper);
    min-height: 680px;
    height: 680px;
    border: 1px solid rgba(17,17,17,.08);

    display: flex;
    align-items: center;
    justify-content: center;

    overflow: hidden;
}

/* Soft luxury background glow */
.main-media::before {
    content: "";
    position: absolute;

    width: 72%;
    height: 72%;

    border-radius: 50%;

    background:
        radial-gradient(
            circle,
            rgba(201,162,77,.12),
            transparent 68%
        );

    pointer-events: none;
}

/* IMAGE + VIDEO */
.main-media img,
.main-media video {
    position: relative;
    z-index: 1;

    width: 100%;
    height: 100%;

    object-fit: contain;
    display: block;
}

/* MEDIA COUNTER */
.media-count {
    position: absolute;
    z-index: 3;

    right: 22px;
    bottom: 20px;

    font-size: 9px;
    letter-spacing: .16em;

    color: var(--muted);

    background: rgba(251,249,244,.78);
    padding: 6px 9px;
}

/* NAVIGATION */
.gallery-nav {
    position: absolute;
    z-index: 5;

    left: 18px;
    right: 18px;
    top: 50%;

    transform: translateY(-50%);

    display: flex;
    justify-content: space-between;

    pointer-events: none;
}

.gallery-arrow {
    pointer-events: auto;

    width: 42px;
    height: 42px;

    border: 1px solid var(--line);
    border-radius: 50%;

    background: rgba(251,249,244,.88);

    cursor: pointer;

    display: grid;
    place-items: center;

    transition: .25s;
}

.gallery-arrow:hover {
    border-color: var(--gold);
    transform: scale(1.04);
}

.gallery-arrow svg {
    width: 17px;
    height: 17px;

    stroke: currentColor;
    fill: none;
    stroke-width: 1.4;
}

/* THUMBNAILS */
.thumbs {
    display: flex;
    gap: 10px;

    overflow-x: auto;

    padding: 16px 0 4px;

    scrollbar-width: thin;
}

.thumb {
    flex: 0 0 86px;

    height: 86px;

    background: var(--paper);

    border: 1px solid var(--line);

    cursor: pointer;

    display: flex;
    align-items: center;
    justify-content: center;

    position: relative;

    overflow: hidden;
}

.thumb.active {
    border-color: var(--gold);

    box-shadow:
        inset 0 0 0 1px var(--gold);
}

.thumb img,
.thumb video {
    width: 100%;
    height: 100%;

    object-fit: contain;
}

.thumb-video-mark {
    position: absolute;

    right: 7px;
    bottom: 7px;

    width: 19px;
    height: 19px;

    border-radius: 50%;

    background: #111;
    color: #fff;

    display: grid;
    place-items: center;

    font-size: 8px;
}

/* =========================================================
   PRODUCT COPY
   ========================================================= */

.product-copy{

    min-width:0;

    padding:
        26px
        0
        0;

}


.eyebrow{

    font-size:10px;

    letter-spacing:.35em;

    color:var(--gold-dark);

    text-transform:uppercase;

    margin-bottom:18px;

}


.product-title{

    font-family:
        "Cormorant Garamond",
        Georgia,
        serif;

    font-size:
        clamp(
            48px,
            5.1vw,
            78px
        );

    line-height:.92;

    font-weight:500;

    letter-spacing:-.025em;

    max-width:650px;

    overflow-wrap:anywhere;

}


.product-rule{

    width:72px;
    height:1px;

    background:var(--gold);

    margin:28px 0;

}


.price{

    font-family:
        "Cormorant Garamond",
        Georgia,
        serif;

    font-size:35px;

}


.availability{

    display:flex;

    align-items:center;

    gap:9px;

    margin:
        18px
        0
        28px;

    font-size:10px;

    letter-spacing:.18em;

    text-transform:uppercase;

    color:#555;

}


.availability-dot{

    width:7px;
    height:7px;

    flex:0 0 7px;

    border-radius:50%;

    background:#4b6b45;

}


.lead{

    font-family:
        "Cormorant Garamond",
        Georgia,
        serif;

    font-size:17px;

    line-height:1.75;

    color:#45423c;

    max-width:530px;

}


/* =========================================================
   PURCHASE
   ========================================================= */

.purchase{

    margin-top:36px;

    border-top:1px solid var(--line);

    border-bottom:1px solid var(--line);

    padding:
        22px
        0;

}


.quantity-row{

    display:flex;

    align-items:center;

    justify-content:space-between;

    gap:20px;

    margin-bottom:18px;

}


.quantity-label{

    font-size:9px;

    letter-spacing:.24em;

    text-transform:uppercase;

    color:var(--muted);

}


.qty{

    display:flex;

    align-items:center;

    border:1px solid var(--line);

}


.qty button{

    width:36px;
    height:38px;

    border:0;

    background:transparent;

    cursor:pointer;

    font-size:17px;

}


.qty button:hover{
    background:#fffaf0;
}


.qty span{

    width:40px;

    text-align:center;

    font-size:12px;

}


/* =========================================================
   ACTIONS
   ========================================================= */

.primary-actions{

    display:grid;

    grid-template-columns:
        1fr
        1fr;

    gap:10px;

}


.action{

    min-width:0;

    height:52px;

    border:1px solid var(--ink);

    background:transparent;

    cursor:pointer;

    text-transform:uppercase;

    letter-spacing:.17em;

    font-size:10px;

    transition:
        transform .25s ease,
        background .25s ease,
        border-color .25s ease;

}


.action.primary{

    background:var(--ink);

    color:var(--ivory);

}


.action:hover{

    transform:translateY(-1px);

}


.action.primary:hover{

    background:#292723;

}


.action.secondary:hover{

    background:#fffaf0;

    border-color:var(--gold);

}


.secondary-actions{

    display:flex;

    gap:20px;

    margin-top:18px;

}


.text-action{

    border:0;

    background:none;

    cursor:pointer;

    font-size:10px;

    letter-spacing:.13em;

    text-transform:uppercase;

    color:#5f5a51;

    padding:4px 0;

    border-bottom:1px solid transparent;

}


.text-action:hover{

    color:var(--gold-dark);

    border-color:var(--gold);

}


/* =========================================================
   TRUST
   ========================================================= */

.trust{

    display:grid;

    grid-template-columns:
        repeat(3,minmax(0,1fr));

    gap:14px;

    margin-top:30px;

}


.trust-item{

    border-top:1px solid var(--line);

    padding-top:13px;

    font-size:9px;

    line-height:1.55;

    color:var(--muted);

    text-transform:uppercase;

    letter-spacing:.11em;

}


/* =========================================================
   EDITORIAL DETAILS
   ========================================================= */

.editorial{

    margin-top:110px;

    border-top:1px solid var(--line);

    padding-top:80px;

}


.section-head{

    display:grid;

    grid-template-columns:
        180px
        minmax(0,1fr);

    gap:55px;

    margin-bottom:48px;

}


.section-number{

    font-size:10px;

    letter-spacing:.22em;

    color:var(--gold-dark);

    text-transform:uppercase;

}


.section-title{

    font-family:
        "Cormorant Garamond",
        Georgia,
        serif;

    font-size:52px;

    font-weight:500;

    line-height:1;

}


.section-intro{

    max-width:700px;

    margin-top:10px;

    font-family:
        "Cormorant Garamond",
        Georgia,
        serif;

    font-size:18px;

    line-height:1.8;

    color:#4b4841;

}


/* =========================================================
   DETAILS GRID
   FIXED SPACING
   ========================================================= */

.details-grid{
    display:grid;

    grid-template-columns:
        minmax(0,1fr)
        minmax(0,1fr);

    column-gap:90px;

    row-gap:0;

    width:100%;

}


.detail{
    min-width:0;

    padding:22px 0;

    border-bottom:1px solid var(--line);

    display:grid;

    grid-template-columns:
        minmax(105px,auto)
        minmax(0,1fr);

    align-items:start;

    column-gap:28px;

    font-size:11px;

}


.detail strong{

    min-width:0;

    font-weight:500;

    text-transform:uppercase;

    letter-spacing:.14em;

    color:#5e5a52;

    white-space:nowrap;

}


.detail span{

    min-width:0;

    color:#8a857b;

    text-align:right;

    overflow-wrap:anywhere;

    word-break:normal;

}


/* =========================================================
   STATEMENT
   ========================================================= */

.statement{

    margin-top:90px;

    background:#111;

    color:var(--ivory);

    min-height:390px;

    display:grid;

    place-items:center;

    text-align:center;

    padding:
        60px
        30px;

    position:relative;

    overflow:hidden;

}


.statement::before{

    content:"50";

    position:absolute;

    font-family:Georgia,serif;

    font-size:300px;

    color:rgba(255,255,255,.025);

    line-height:.8;

}


.statement-inner{

    position:relative;

    z-index:1;

    max-width:900px;

}


.statement-small{

    font-size:9px;

    letter-spacing:.35em;

    color:var(--gold);

    text-transform:uppercase;

}


.statement h2{

    font-family:
        "Cormorant Garamond",
        Georgia,
        serif;

    font-size:
        clamp(
            44px,
            6vw,
            78px
        );

    font-weight:500;

    line-height:.95;

    margin:18px 0;

}


.statement p{

    max-width:570px;

    margin:auto;

    color:#bdb7aa;

    font-family:
        "Cormorant Garamond",
        Georgia,
        serif;

    font-size:17px;

    line-height:1.7;

}


/* =========================================================
   RELATED
   ========================================================= */

.related{

    margin-top:100px;

}


.related-grid{

    display:grid;

    grid-template-columns:
        repeat(4,minmax(0,1fr));

    gap:18px;

}


.related-card{

    min-width:0;

    background:var(--paper);

    border:1px solid rgba(17,17,17,.08);

    padding:16px;

    transition:
        transform .25s ease,
        border-color .25s ease;

}


.related-card:hover{

    transform:translateY(-4px);

    border-color:rgba(201,162,77,.55);

}


.related-media{

    width:100%;

    height:240px;

    display:flex;

    align-items:center;
    justify-content:center;

    background:#f8f5ed;

    margin-bottom:18px;

    overflow:hidden;

}


.related-media img,
.related-media video{

    width:100%;
    height:100%;

    object-fit:contain;

}


.related-name{

    font-family:
        "Cormorant Garamond",
        Georgia,
        serif;

    font-size:20px;

    font-weight:500;

    line-height:1.05;

    overflow-wrap:anywhere;

}


.related-price{

    font-size:11px;

    color:var(--muted);

    margin-top:8px;

}


.related-link{

    display:inline-block;

    margin-top:15px;

    font-size:9px;

    letter-spacing:.17em;

    text-transform:uppercase;

    color:var(--gold-dark);

}


/* =========================================================
   TOAST
   ========================================================= */

.toast{

    position:fixed;

    left:50%;
    bottom:28px;

    transform:
        translate(-50%,20px);

    background:#111;

    color:#fffdf8;

    padding:
        14px
        22px;

    font-size:10px;

    letter-spacing:.12em;

    text-transform:uppercase;

    opacity:0;

    pointer-events:none;

    transition:.3s;

    z-index:300;

    max-width:
        calc(100vw - 30px);

    text-align:center;

}


.toast.show{

    opacity:1;

    transform:
        translate(-50%,0);

}


/* =========================================================
   EMPTY STATE
   ========================================================= */

.empty{

    min-height:70vh;

    display:grid;

    place-items:center;

    text-align:center;

    padding:50px 20px;

}


.empty h1{

    font-family:
        "Cormorant Garamond",
        Georgia,
        serif;

    font-size:56px;

    font-weight:500;

}


.empty p{

    color:var(--muted);

    margin-top:10px;

}


.empty a{

    display:inline-block;

    margin-top:20px;

    text-decoration:underline;

}

/* =========================================================
   FOOTER
========================================================= */

.main-footer{

    margin-top:0;

    background:#111;

    color:#fff;

    border-top:
        1px solid
        rgba(17,17,17,.12);

}


.footer-container{

    width:100%;

    max-width:1400px;

    margin:0 auto;

    padding:
        60px
        50px
        0;

}


/* Footer top */

.footer-top{

    display:grid;

    grid-template-columns:
        1fr
        1fr
        1fr;

    gap:50px;

    padding-bottom:50px;

    border-bottom:
        1px solid
        rgba(255,255,255,.15);

}


.footer-top > h2{

    grid-column:
        1 / -1;

    text-align:center;

    margin:
        0
        0
        10px;

    font-family:
        Georgia,
        "Times New Roman",
        serif;

    font-size:38px;

    font-weight:400;

    color:#c9a24d;

}


/* Footer headings */

.contact-column h3,
.whatsapp-column h3,
.footer-links-column h3,
.footer-social h3{

    color:#c9a24d;

    font-size:12px;

    letter-spacing:.12em;

    text-transform:uppercase;

    margin:
        0
        0
        18px;

}


/* Contact */

.contact-column{

    text-align:left;

}


.contact-column p{

    color:#999;

    font-size:13px;

    line-height:1.7;

}


.footer-link{

    display:block;

    color:#fff;

    text-decoration:none;

    margin-bottom:12px;

    font-size:13px;

    transition:.25s ease;

}


.footer-link:hover{

    color:#c9a24d;

}


/* =========================================================
   WHATSAPP
========================================================= */

.whatsapp-column{

    text-align:center;

}


.whatsapp-title{

    display:flex;

    align-items:center;

    justify-content:center;

    gap:10px;

}


.whatsapp-icon{

    width:28px !important;

    height:28px !important;

    object-fit:contain !important;

}


.whatsapp-button{

    display:inline-block;

    background:#c9a24d;

    color:#111;

    text-decoration:none;

    padding:
        12px
        28px;

    border-radius:0;

    font-size:11px;

    font-weight:700;

    letter-spacing:.08em;

    text-transform:uppercase;

    transition:.25s ease;

}


.whatsapp-button:hover{

    background:#fff;

    color:#111;

}


/* =========================================================
   FOOTER MIDDLE
========================================================= */

.footer-middle{

    display:grid;

    grid-template-columns:
        1fr
        1fr
        1fr;

    gap:50px;

    padding:50px 0;

}


.footer-links-column{

    display:flex;

    flex-direction:column;

}


.footer-links-column a{

    color:#bbb;

    text-decoration:none;

    margin-bottom:13px;

    font-size:13px;

    transition:.25s ease;

}


.footer-links-column a:hover{

    color:#c9a24d;

}


/* =========================================================
   INSTAGRAM
========================================================= */

.footer-social{

    text-align:center;

}


.footer-social p{

    color:#999;

    margin-bottom:15px;

    font-size:13px;

}


.instagram-button{

    display:inline-flex;

    align-items:center;

    justify-content:center;

    width:50px;

    height:50px;

    border:
        1px solid
        #c9a24d;

    border-radius:50%;

    transition:.25s ease;

}


.instagram-button:hover{

    background:#c9a24d;

}


.instagram-button img{

    width:28px;

    height:28px;

    object-fit:contain;

}


/* =========================================================
   COPYRIGHT
========================================================= */

.footer-bottom{

    border-top:
        1px solid
        rgba(255,255,255,.15);

    text-align:center;

    padding:
        25px
        10px;

}


.footer-bottom p{

    margin:0;

    color:#777;

    font-size:12px;

    line-height:1.6;

}

/* =========================================================
   TABLET / SMALL LAPTOP
========================================================= */

@media (max-width: 1100px) {

    .site-header {
        padding: 0 28px;
    }

    .atelier {
        padding-left: 28px;
        padding-right: 28px;
    }

    .hero-grid {
        grid-template-columns:
            minmax(0, 1fr)
            minmax(330px, .75fr);

        gap: 42px;
    }

    .main-media {
        height: 600px;
        min-height: 600px;
    }

    .main-media img,
    .main-media video {
        height: 100%;
    }

    .product-title {
        font-size: clamp(48px, 5vw, 68px);
    }

    .section-head {
        grid-template-columns: 150px 1fr;
        gap: 35px;
    }

    .related-grid {
        grid-template-columns: repeat(3, 1fr);
    }
}


/* =========================================================
   TABLET / MOBILE
========================================================= */

@media (max-width: 850px) {

    .site-header {
        height: 74px;
        padding: 0 22px;
    }

    .brand {
        font-size: 22px;
    }

    .brand-sub {
        font-size: 7px;
    }

    .crumbs {
        padding: 22px 24px 8px;
    }

    .atelier {
        padding: 18px 24px 70px;
    }

    .hero-grid {
        grid-template-columns: 1fr;
        gap: 45px;
    }

    .product-copy {
        padding-top: 0;
    }

    .main-media {
        width: 100%;
        height: min(680px, 82vw);
        min-height: 460px;
    }

    .gallery-label {
        margin-bottom: 12px;
    }

    .section-head {
        grid-template-columns: 1fr;
        gap: 14px;
    }

    .details-grid {
        grid-template-columns: 1fr;
    }

    .related-grid {
        grid-template-columns: repeat(2, 1fr);
    }
}


/* =========================================================
   MOBILE
========================================================= */

@media (max-width: 620px) {

    .site-header {
        height: 68px;
        padding: 0 16px;
    }

    .brand {
        font-size: 18px;
        letter-spacing: .11em;
    }

    .brand-sub {
        font-size: 6px;
        letter-spacing: .26em;
        margin-top: 4px;
    }

/* =========================================================

const money = number => {

        Number(number).toLocaleString(
            "en-IN"

};


const esc = value => {

    return String(value).replace(
        /[&<>"']/g,
        character => ({

            "&":"&amp;",
            "<":"&lt;",
            ">":"&gt;",
            '"':"&quot;",
            "'":"&#039;"

        })[character]
    );

};


const url = value => {

    return encodeURI(value);

};


const isVideo = file => {

    return /\.(mp4|webm|ogg)(\?.*)?$/i.test(
        file
    );

};

/* =========================================================

function mediaHTML(file, large = false){

    if(isVideo(file)){

        return `
            <video
                src="${url(file)}"
                ${large ? "controls" : "muted"}
                playsinline
                loop
                preload="${large ? "metadata" : "none"}"
                ${large ? "" : "autoplay"}
            ></video>
        `;

    }


    return `
        <img
            src="${url(file)}"
            alt="${esc(product.name)}"
            loading="${large ? "eager" : "lazy"}"
        >
    `;

}

function buildGallery(media){

    const main =
        document.getElementById(
            "mainMediaContent"
        );

    const thumbs =
        document.getElementById(
            "thumbs"
        );

    const counter =
        document.getElementById(
            "mediaCount"
        );


    if(!media.length){

        main.innerHTML = `
            <div
                style="
                    color:#716d64;
                    font-size:10px;
                    letter-spacing:.15em;
                    text-transform:uppercase;
                "
            >
                No media available
            </div>
        `;

        return;

    }


    const show = index => {

        currentMedia =
            (index + media.length) %
            media.length;


        main.innerHTML =
            mediaHTML(
                media[currentMedia],
                true
            );


        counter.textContent =
            `${String(currentMedia + 1).padStart(2,"0")}
             /
             ${String(media.length).padStart(2,"0")}`;


        [
            ...thumbs.children
        ].forEach(
            (item,index) => {

                item.classList.toggle(
                    "active",
                    index === currentMedia
                );

            }
        );


        const video =
            main.querySelector("video");


        if(video){

            video.play().catch(
                () => {}
            );

        }

    };


    thumbs.innerHTML =
        media.map(
            (file,index) => {

                const video =
                    isVideo(file);


                return `

                    <button
                        class="thumb ${
                            index === 0
                            ? "active"
                            : ""
                        }"
                        data-index="${index}"
                        type="button"
                        aria-label="View media ${index + 1}"
                    >

                        ${
                            video

                            ?

                            `
                                <video
                                    src="${url(file)}"
                                    muted
                                    playsinline
                                    preload="metadata"
                                ></video>

                                <span class="thumb-video-mark">
                                    ▶
                                </span>
                            `

                            :

                            `
                                <img
                                    src="${url(file)}"
                                    alt="${esc(product.name)} ${index + 1}"
                                    loading="lazy"
                                >
                            `
                        }

                    </button>

                `;

            }
        ).join("");


    thumbs
        .querySelectorAll(".thumb")
        .forEach(button => {

            button.addEventListener(
                "click",
                () => {

                    show(
                        Number(
                            button.dataset.index
                        )
                    );

                }
            );

        });


    const previous =
        document.getElementById(
            "prevMedia"
        );


    const next =
        document.getElementById(
            "nextMedia"
        );


    if(previous){

        previous.addEventListener(
            "click",
            () => show(
                currentMedia - 1
            )
        );

    }


    if(next){

        next.addEventListener(
            "click",
            () => show(
                currentMedia + 1
            )
        );

    }


    show(0);

}


/* =========================================================

   ========================================================= */

function buildRelated(){

    const grid =
        document.getElementById(
            "relatedGrid"
        );


    if(!grid){
        return;
    }


    const candidates =
        products.filter(
            item =>
                item.id !== product.id
        );


    const currentBrand =
        getBrand(product.name);


    const sameBrand =
        candidates.filter(
            item =>
                getBrand(item.name) ===
                currentBrand
        );


    const differentBrand =
        candidates.filter(
            item =>
                !sameBrand.includes(item)
        );


    const pool =
        [
            ...sameBrand,
            ...differentBrand
        ].slice(0,4);


    grid.innerHTML =
        pool.map(item => {

            const firstMedia =
                item.media[0];


            return `

                <a
                    class="related-card"
                    href="product-details.html?id=${item.id}"
                >

                    <div class="related-media">

                        ${
                            isVideo(firstMedia)

                            ?

                            `
                                <video
                                    src="${url(firstMedia)}"
                                    muted
                                    autoplay
                                    loop
                                    playsinline
                                    preload="metadata"
                                ></video>
                            `

                            :

                            `
                                <img
                                    src="${url(firstMedia)}"
                                    alt="${esc(item.name)}"
                                    loading="lazy"
                                >
                            `
                        }

                    </div>


                    <div class="related-name">
                        ${esc(item.name)}
                    </div>


                    <div class="related-price">
                        ${money(item.price)}
                    </div>


                    <span class="related-link">
                        View Product

                </a>

            `;

        }).join("");

}


/* =========================================================
   CART
   ========================================================= */

function getCart(){

    try{

        const saved =
            JSON.parse(
                localStorage.getItem("cart") ||
                "[]"
            );


        return Array.isArray(saved)
            ? saved
            : [];

    }catch(error){

        return [];

    }

}


function saveCart(cart){

    localStorage.setItem(
        "cart",
        JSON.stringify(cart)
    );

}


/* =========================================================
   ADD TO CART
   ========================================================= */

function addToCart(goToCart = false){

    const cart =
        getCart();


    const existing =
        cart.find(
            item =>
                Number(item.id) ===
                product.id
        );


    if(existing){

        existing.quantity =
            Math.min(
                10,
                Number(
                    existing.quantity || 1
                ) + quantity
            );

    }else{

        cart.push({

            id:product.id,

            name:product.name,

            price:product.price,

            quantity:quantity,

            type:product.type,

            media:product.media

        });

    }


    saveCart(cart);


    if(goToCart){

        toast(
            "Taking you to your bag"
        );


        setTimeout(
            () => {

                location.href =
                    "cart.html";

            },
            350
        );

    }else{

        toast(
            "Added to your bag"
        );

    }

}


/* =========================================================
   ACTIONS
   ========================================================= */

function bindActions() {

    const minus = document.getElementById("qtyMinus");
    const plus = document.getElementById("qtyPlus");
    const value = document.getElementById("qtyValue");

    if (minus) {
        minus.onclick = () => {
            quantity = Math.max(1, quantity - 1);
            value.textContent = quantity;
        };
    }

    if (plus) {
        plus.onclick = () => {
            quantity = Math.min(10, quantity + 1);
            value.textContent = quantity;
        };
    }

    const addCartButton = document.getElementById("addCart");

    if (addCartButton) {
        addCartButton.onclick = () => {
            addToCart(false);
        };
    }

    const buyNowButton = document.getElementById("buyNow");

    if (buyNowButton) {
        buyNowButton.onclick = () => {
            addToCart(true);
        };
    }

    const whatsappButton =
        document.getElementById("whatsappBtn");

    if (whatsappButton) {

        whatsappButton.onclick = () => {

            const message =
                `Hello 50 Mirars, I am interested in ${product.name} (₹${product.price.toLocaleString("en-IN")}).`;

            const whatsappURL =
                `https://wa.me/918209989013?text=${encodeURIComponent(message)}`;

            window.open(
                whatsappURL,
                "_blank",
                "noopener,noreferrer"
            );
        };
    }
}

/* =========================================================
   TOAST
   ========================================================= */

function toast(message){

    const element =
        document.getElementById(
            "toast"
        );


    if(!element){
        return;
    }


    element.textContent =
        message;


    element.classList.add(
        "show"
    );


    clearTimeout(
        window.__toastTimer
    );


    window.__toastTimer =
        setTimeout(
            () => {

                element.classList.remove(
                    "show"
                );

            },
            2200
        );

}
