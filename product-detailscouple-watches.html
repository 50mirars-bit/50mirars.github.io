<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=1000"
>

<meta
    name="theme-color"
    content="#f7f3e9"
>

<meta
    name="description"
    content="50 Mirars — Royal Watch Atelier. Explore premium couple watches through an elegant editorial product experience."
>

<title>Couple Watch Details | 50 Mirars</title>

<link
    rel="preconnect"
    href="https://fonts.googleapis.com"
>

<link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
>

<link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Inter:wght@300;400;500;600&display=swap"
    rel="stylesheet"
>

<style>

/* =========================================================
   ROOT
========================================================= */

:root{

    --ivory:#f7f3e9;
    --paper:#fbf9f4;

    --ink:#111111;
    --soft-ink:#252525;

    --muted:#716d64;

    --gold:#c9a24d;
    --gold-dark:#9b762c;

    --line:rgba(17,17,17,.14);
    --soft-line:rgba(17,17,17,.08);

    --white:#ffffff;
    --black:#090909;

    --max:1380px;

}


/* =========================================================
   RESET
========================================================= */

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html{
    scroll-behavior:smooth;
}

body{

    background:var(--ivory);

    color:var(--ink);

    font-family:
        Inter,
        Arial,
        sans-serif;

    font-weight:400;

    line-height:1.6;

    -webkit-font-smoothing:antialiased;

}

img,
video{
    display:block;
    max-width:100%;
}

button,
input{
    font:inherit;
}

button{
    cursor:pointer;
}

a{
    color:inherit;
    text-decoration:none;
}


/* =========================================================
   HEADER
========================================================= */

.site-header{

    position:sticky;

    top:0;

    z-index:1000;

    height:74px;

    display:flex;

    align-items:center;

    padding:0 42px;

    background:rgba(247,243,233,.94);

    backdrop-filter:blur(16px);

    -webkit-backdrop-filter:blur(16px);

    border-bottom:1px solid var(--line);

}


.brand-link{
    display:inline-block;
}


.brand{

    font-family:
        Cormorant Garamond,
        Georgia,
        serif;

    font-size:27px;

    font-weight:600;

    letter-spacing:.16em;

    line-height:1;

}


.brand-sub{

    display:block;

    margin-top:7px;

    font-family:
        Inter,
        Arial,
        sans-serif;

    font-size:8px;

    font-weight:500;

    letter-spacing:.25em;

    color:var(--muted);

}


/* =========================================================
   APP
========================================================= */

#app{
    min-height:500px;
}


/* =========================================================
   PAGE CONTAINER
========================================================= */

.page-wrap{

    width:min(
        calc(100% - 64px),
        var(--max)
    );

    margin:0 auto;

}


/* =========================================================
   BREADCRUMBS
========================================================= */

.crumbs{

    display:flex;

    align-items:center;

    flex-wrap:wrap;

    gap:10px;

    padding:25px 0 24px;

    font-size:11px;

    letter-spacing:.04em;

    color:var(--muted);

}

.crumbs a{

    transition:.25s ease;

}

.crumbs a:hover{
    color:var(--ink);
}

.crumb-separator{
    opacity:.45;
}


/* =========================================================
   HERO
========================================================= */

.product-hero{

    display:grid;

    grid-template-columns:
        minmax(0,1.12fr)
        minmax(360px,.88fr);

    gap:70px;

    align-items:start;

    padding-bottom:115px;

}


/* =========================================================
   GALLERY
========================================================= */

.gallery{

    min-width:0;

}

.gallery-label{

    margin-bottom:15px;

    font-size:9px;

    font-weight:600;

    letter-spacing:.22em;

    text-transform:uppercase;

    color:var(--muted);

}


.main-media-wrap{

    position:relative;

    width:100%;

}


.main-media{

    position:relative;

    display:flex;

    align-items:center;

    justify-content:center;

    overflow:hidden;

    min-height:600px;

    background:

        radial-gradient(
            circle at 50% 45%,
            rgba(201,162,77,.13),
            transparent 42%
        ),

        var(--paper);

    border:1px solid var(--soft-line);

}


.main-media img,
.main-media video{

    width:100%;

    height:600px;

    object-fit:contain;

    padding:34px;

    position:relative;

    z-index:2;

}


.main-media video{

    background:#000;

    object-fit:contain;

    padding:0;

}


/* =========================================================
   GALLERY CONTROLS
========================================================= */

.media-counter{

    position:absolute;

    top:20px;

    right:22px;

    z-index:5;

    padding:6px 10px;

    background:rgba(251,249,244,.85);

    border:1px solid var(--line);

    font-size:9px;

    letter-spacing:.12em;

    color:var(--muted);

}


.gallery-arrow{

    position:absolute;

    top:50%;

    z-index:8;

    width:43px;

    height:43px;

    transform:translateY(-50%);

    display:flex;

    align-items:center;

    justify-content:center;

    border:1px solid rgba(17,17,17,.18);

    background:rgba(251,249,244,.9);

    color:var(--ink);

    font-size:21px;

    transition:.25s ease;

}


.gallery-arrow:hover{

    background:var(--ink);

    color:var(--white);

}


.gallery-arrow.prev{
    left:18px;
}

.gallery-arrow.next{
    right:18px;
}


.gallery-arrow.hidden{
    display:none;
}


/* =========================================================
   THUMBNAILS
========================================================= */

.thumbnails{

    display:flex;

    gap:10px;

    overflow-x:auto;

    padding-top:12px;

    scrollbar-width:thin;

}

.thumb{

    position:relative;

    flex:0 0 78px;

    width:78px;

    height:78px;

    overflow:hidden;

    border:1px solid var(--line);

    background:var(--paper);

    opacity:.62;

    transition:.25s ease;

}

.thumb.active{

    opacity:1;

    border-color:var(--gold);

}

.thumb img,
.thumb video{

    width:100%;

    height:100%;

    object-fit:cover;

}

.thumb-video{

    position:absolute;

    inset:0;

    display:flex;

    align-items:center;

    justify-content:center;

    background:rgba(0,0,0,.28);

    color:white;

    font-size:16px;

    pointer-events:none;

}


/* =========================================================
   PRODUCT COPY
========================================================= */

.product-copy{

    position:sticky;

    top:105px;

}


.eyebrow{

    margin-bottom:16px;

    font-size:10px;

    font-weight:600;

    letter-spacing:.25em;

    text-transform:uppercase;

    color:var(--gold-dark);

}


.product-title{

    max-width:650px;

    font-family:
        Cormorant Garamond,
        Georgia,
        serif;

    font-size:clamp(
        46px,
        5vw,
        78px
    );

    font-weight:500;

    line-height:.94;

    letter-spacing:-.025em;

}


.gold-rule{

    width:70px;

    height:1px;

    margin:29px 0 25px;

    background:var(--gold);

}


.price{

    font-family:
        Cormorant Garamond,
        Georgia,
        serif;

    font-size:37px;

    font-weight:600;

    line-height:1;

}


.availability{

    display:flex;

    align-items:center;

    gap:8px;

    margin-top:12px;

    font-size:10px;

    letter-spacing:.13em;

    text-transform:uppercase;

    color:var(--muted);

}


.availability-dot{

    width:7px;

    height:7px;

    border-radius:50%;

    background:var(--gold);

}


.lead{

    max-width:570px;

    margin-top:29px;

    font-size:14px;

    line-height:1.9;

    color:#555149;

}


/* =========================================================
   PURCHASE
========================================================= */

.purchase{

    margin-top:34px;

    padding-top:28px;

    border-top:1px solid var(--line);

}


.quantity-row{

    display:flex;

    align-items:center;

    justify-content:space-between;

    margin-bottom:15px;

}


.quantity-label{

    font-size:9px;

    font-weight:600;

    letter-spacing:.18em;

    text-transform:uppercase;

    color:var(--muted);

}


.quantity-control{

    display:flex;

    align-items:center;

    border:1px solid var(--line);

    background:var(--paper);

}


.quantity-control button{

    width:39px;

    height:39px;

    border:0;

    background:transparent;

    color:var(--ink);

    font-size:18px;

}


.quantity-control input{

    width:42px;

    height:39px;

    text-align:center;

    border:0;

    border-left:1px solid var(--line);

    border-right:1px solid var(--line);

    background:transparent;

    outline:none;

}


.primary-actions{

    display:grid;

    grid-template-columns:1fr 1fr;

    gap:10px;

}


.action{

    min-height:53px;

    border:1px solid var(--ink);

    font-size:10px;

    font-weight:600;

    letter-spacing:.17em;

    text-transform:uppercase;

    transition:.25s ease;

}


.action.primary{

    background:var(--ink);

    color:white;

}


.action.primary:hover{

    background:var(--gold-dark);

    border-color:var(--gold-dark);

}


.action.secondary{

    background:transparent;

    color:var(--ink);

}


.action.secondary:hover{

    background:var(--ink);

    color:white;

}


.secondary-actions{

    margin-top:12px;

}


.text-action{

    width:100%;

    min-height:45px;

    border:0;

    background:transparent;

    font-size:10px;

    font-weight:600;

    letter-spacing:.17em;

    text-transform:uppercase;

    color:var(--gold-dark);

}


.text-action:hover{
    text-decoration:underline;
}


/* =========================================================
   TRUST
========================================================= */

.trust{

    display:grid;

    grid-template-columns:
        repeat(3,1fr);

    margin-top:30px;

    border-top:1px solid var(--line);

    border-bottom:1px solid var(--line);

}


.trust-item{

    padding:17px 12px;

    font-size:9px;

    line-height:1.6;

    letter-spacing:.08em;

    text-transform:uppercase;

    color:var(--muted);

}


.trust-item + .trust-item{

    border-left:1px solid var(--line);

}


/* =========================================================
   EDITORIAL SECTION
========================================================= */

.editorial{

    padding:100px 0 120px;

    border-top:1px solid var(--line);

}


.section-head{

    display:grid;

    grid-template-columns:
        230px
        minmax(0,1fr);

    gap:55px;

    margin-bottom:55px;

}


.section-number{

    padding-top:8px;

    font-size:9px;

    font-weight:600;

    letter-spacing:.2em;

    text-transform:uppercase;

    color:var(--gold-dark);

}


.section-title{

    font-family:
        Cormorant Garamond,
        Georgia,
        serif;

    font-size:clamp(
        42px,
        5vw,
        67px
    );

    font-weight:500;

    line-height:.95;

}


.section-intro{

    max-width:650px;

    margin-top:18px;

    font-size:13px;

    line-height:1.9;

    color:var(--muted);

}


/* =========================================================
   DETAILS GRID
========================================================= */

.details-grid{

    display:grid;

    grid-template-columns:
        repeat(4,1fr);

    border-top:1px solid var(--line);

    border-left:1px solid var(--line);

}


.detail{

    min-height:145px;

    padding:25px;

    border-right:1px solid var(--line);

    border-bottom:1px solid var(--line);

}


.detail-label{

    margin-bottom:18px;

    font-size:8px;

    font-weight:600;

    letter-spacing:.18em;

    text-transform:uppercase;

    color:var(--gold-dark);

}


.detail-value{

    font-family:
        Cormorant Garamond,
        Georgia,
        serif;

    font-size:21px;

    line-height:1.2;

    word-break:break-word;

}


/* =========================================================
   DESCRIPTION + FEATURES
========================================================= */

.description-block{

    display:grid;

    grid-template-columns:
        1.1fr
        .9fr;

    gap:80px;

    margin-top:80px;

}


.description-title{

    margin-bottom:20px;

    font-family:
        Cormorant Garamond,
        Georgia,
        serif;

    font-size:38px;

    font-weight:500;

}


.description-text{

    max-width:700px;

    font-size:14px;

    line-height:2;

    color:#555149;

}


.features-title{

    margin-bottom:22px;

    font-family:
        Cormorant Garamond,
        Georgia,
        serif;

    font-size:38px;

    font-weight:500;

}


.features-list{

    list-style:none;

}


.features-list li{

    position:relative;

    padding:12px 0 12px 21px;

    border-bottom:1px solid var(--soft-line);

    font-size:12px;

    color:#4e4b45;

}


.features-list li::before{

    content:"";

    position:absolute;

    left:0;

    top:21px;

    width:5px;

    height:5px;

    border-radius:50%;

    background:var(--gold);

}


/* =========================================================
   STATEMENT
========================================================= */

.statement{

    position:relative;

    overflow:hidden;

    background:var(--black);

    color:white;

}


.statement::before{

    content:"";

    position:absolute;

    width:500px;

    height:500px;

    border-radius:50%;

    background:radial-gradient(
        circle,
        rgba(201,162,77,.13),
        transparent 70%
    );

    top:-220px;

    right:-120px;

}


.statement-inner{

    position:relative;

    z-index:2;

    width:min(
        calc(100% - 64px),
        var(--max)
    );

    margin:auto;

    padding:125px 0 135px;

}


.statement-small{

    margin-bottom:25px;

    font-size:9px;

    font-weight:600;

    letter-spacing:.23em;

    text-transform:uppercase;

    color:#bca36d;

}


.statement h2{

    font-family:
        Cormorant Garamond,
        Georgia,
        serif;

    font-size:clamp(
        50px,
        7vw,
        100px
    );

    font-weight:400;

    line-height:.9;

    letter-spacing:-.025em;

}


.statement p{

    max-width:530px;

    margin-top:30px;

    font-size:13px;

    line-height:1.9;

    color:#aaa59b;

}


/* =========================================================
   RELATED
========================================================= */

.related{

    padding:110px 0 120px;

}


.related-grid{

    display:grid;

    grid-template-columns:
        repeat(4,1fr);

    gap:20px;

}


.related-card{

    display:block;

    background:var(--paper);

    border:1px solid var(--soft-line);

    transition:
        transform .3s ease,
        box-shadow .3s ease;

}


.related-card:hover{

    transform:translateY(-5px);

    box-shadow:
        0 15px 40px rgba(17,17,17,.07);

}


.related-media{

    position:relative;

    height:330px;

    overflow:hidden;

    background:

        radial-gradient(
            circle at 50% 45%,
            rgba(201,162,77,.10),
            transparent 50%
        ),

        var(--paper);

}


.related-media img,
.related-media video{

    width:100%;

    height:100%;

    object-fit:contain;

    padding:18px;

}


.related-info{

    padding:20px 20px 23px;

    border-top:1px solid var(--soft-line);

}


.related-brand{

    margin-bottom:7px;

    font-size:8px;

    font-weight:600;

    letter-spacing:.18em;

    text-transform:uppercase;

    color:var(--gold-dark);

}


.related-name{

    min-height:45px;

    font-family:
        Cormorant Garamond,
        Georgia,
        serif;

    font-size:21px;

    line-height:1.05;

}


.related-price{

    margin-top:13px;

    font-size:11px;

    color:var(--muted);

}


/* =========================================================
   FOOTER
========================================================= */

.main-footer{

    margin-top:0;

    background:#111;

    color:#fff;

    border-top:
        1px solid
        rgba(17,17,17,.12);

}


.footer-container{

    width:100%;

    max-width:1400px;

    margin:0 auto;

    padding:
        60px
        50px
        0;

}


/* Footer top */

.footer-top{

    display:grid;

    grid-template-columns:
        1fr
        1fr
        1fr;

    gap:50px;

    padding-bottom:50px;

    border-bottom:
        1px solid
        rgba(255,255,255,.15);

}


.footer-top > h2{

    grid-column:
        1 / -1;

    text-align:center;

    margin:
        0
        0
        10px;

    font-family:
        Georgia,
        "Times New Roman",
        serif;

    font-size:38px;

    font-weight:400;

    color:#c9a24d;

}


/* Footer headings */

.contact-column h3,
.whatsapp-column h3,
.footer-links-column h3,
.footer-social h3{

    color:#c9a24d;

    font-size:12px;

    letter-spacing:.12em;

    text-transform:uppercase;

    margin:
        0
        0
        18px;

}


/* Contact */

.contact-column{

    text-align:left;

}


.contact-column p{

    color:#999;

    font-size:13px;

    line-height:1.7;

}


.footer-link{

    display:block;

    color:#fff;

    text-decoration:none;

    margin-bottom:12px;

    font-size:13px;

    transition:.25s ease;

}


.footer-link:hover{

    color:#c9a24d;

}


/* =========================================================
   WHATSAPP
========================================================= */

.whatsapp-column{

    text-align:center;

}


.whatsapp-title{

    display:flex;

    align-items:center;

    justify-content:center;

    gap:10px;

}


.whatsapp-icon{

    width:28px !important;

    height:28px !important;

    object-fit:contain !important;

}


.whatsapp-button{

    display:inline-block;

    background:#c9a24d;

    color:#111;

    text-decoration:none;

    padding:
        12px
        28px;

    border-radius:0;

    font-size:11px;

    font-weight:700;

    letter-spacing:.08em;

    text-transform:uppercase;

    transition:.25s ease;

}


.whatsapp-button:hover{

    background:#fff;

    color:#111;

}


/* =========================================================
   FOOTER MIDDLE
========================================================= */

.footer-middle{

    display:grid;

    grid-template-columns:
        1fr
        1fr
        1fr;

    gap:50px;

    padding:50px 0;

}


.footer-links-column{

    display:flex;

    flex-direction:column;

}


.footer-links-column a{

    color:#bbb;

    text-decoration:none;

    margin-bottom:13px;

    font-size:13px;

    transition:.25s ease;

}


.footer-links-column a:hover{

    color:#c9a24d;

}


/* =========================================================
   INSTAGRAM
========================================================= */

.footer-social{

    text-align:center;

}


.footer-social p{

    color:#999;

    margin-bottom:15px;

    font-size:13px;

}


.instagram-button{

    display:inline-flex;

    align-items:center;

    justify-content:center;

    width:50px;

    height:50px;

    border:
        1px solid
        #c9a24d;

    border-radius:50%;

    transition:.25s ease;

}


.instagram-button:hover{

    background:#c9a24d;

}


.instagram-button img{

    width:28px;

    height:28px;

    object-fit:contain;

}


/* =========================================================
   COPYRIGHT
========================================================= */

.footer-bottom{

    border-top:
        1px solid
        rgba(255,255,255,.15);

    text-align:center;

    padding:
        25px
        10px;

}


.footer-bottom p{

    margin:0;

    color:#777;

    font-size:12px;

    line-height:1.6;

}

/* =========================================================
   TOAST
========================================================= */

.toast{

    position:fixed;

    right:25px;

    bottom:25px;

    z-index:5000;

    max-width:320px;

    padding:15px 19px;

    background:var(--ink);

    color:white;

    border-left:3px solid var(--gold);

    font-size:11px;

    line-height:1.5;

    opacity:0;

    visibility:hidden;

    transform:translateY(12px);

    transition:.3s ease;

}


.toast.show{

    opacity:1;

    visibility:visible;

    transform:translateY(0);

}


/* =========================================================
   EMPTY / ERROR
========================================================= */

.error-page{

    min-height:60vh;

    display:flex;

    align-items:center;

    justify-content:center;

    text-align:center;

    padding:80px 20px;

}


.error-page h1{

    font-family:
        Cormorant Garamond,
        Georgia,
        serif;

    font-size:60px;

    font-weight:500;

}


.error-page p{

    margin-top:15px;

    color:var(--muted);

}


.back-link{

    display:inline-block;

    margin-top:30px;

    padding:13px 22px;

    background:var(--ink);

    color:white;

    font-size:10px;

    font-weight:600;

    letter-spacing:.15em;

    text-transform:uppercase;

}


/* =========================================================
   RESPONSIVE
========================================================= */

@media(max-width:1100px){

    .product-hero{

        grid-template-columns:
            1fr
            1fr;

        gap:40px;

    }

    .main-media,
    .main-media img,
    .main-media video{

        min-height:500px;

        height:500px;

    }

    .related-grid{

        grid-template-columns:
            repeat(2,1fr);

    }

    .details-grid{

        grid-template-columns:
            repeat(2,1fr);

    }

}


@media(max-width:850px){

    .site-header{
        padding:0 25px;
    }

    .page-wrap,
    .footer-inner,
    .statement-inner{

        width:min(
            calc(100% - 40px),
            var(--max)
        );

    }

    .product-hero{

        grid-template-columns:1fr;

        padding-bottom:80px;

    }

    .product-copy{

        position:static;

    }

    .main-media,
    .main-media img,
    .main-media video{

        min-height:480px;

        height:480px;

/* =========================================================
   HELPERS
========================================================= */

function money(value){

    return "₹" +
        Number(value).toLocaleString(
            "en-IN"
        );

}


function esc(value){

    return String(value ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


function url(value){

    return encodeURI(value);

}


function isVideo(file){

    return /\.(mp4|webm|ogg)$/i.test(
        String(file)
    );

}


/* =========================================================
   MEDIA NORMALIZATION
========================================================= */

function getMedia(product){

    if(
        Array.isArray(product.media) &&
        product.media.length
    ){
        return product.media;
    }

    if(
        Array.isArray(product.files) &&
        product.files.length
    ){
        return product.files;
    }

    if(product.file){
        return [product.file];
    }

    return [];
}


/* =========================================================
   MEDIA HTML
========================================================= */

function mediaHTML(file, large = false){

    const safeFile = url(file);

    if(isVideo(file)){

        return `

            <video
                ${large ? 'id="mainVideo"' : ''}
                src="${safeFile}"
                controls
                playsinline
                preload="metadata"
            ></video>

        `;

    }

    return `

        <img
            src="${safeFile}"
            alt="${esc(product.name)}"
            ${large ? 'id="mainImage"' : ''}
        >

    `;

}

/* =========================================================
   RELATED PRODUCTS
========================================================= */

function buildRelated(){

    const grid =
        document.getElementById(
            "relatedGrid"
        );

    if(!grid){
        return;
    }


    let related = [];


    /*
       First use the exact similar
       products supplied in database.
    */

    if(
        Array.isArray(product.similar)
    ){

        product.similar.forEach(slug => {

            const item =
                coupleWatches.find(
                    p => p.slug === slug
                );

            if(
                item &&
                item.slug !== product.slug &&
                !related.some(
                    p => p.slug === item.slug
                )
            ){

                related.push(item);

            }

        });

    }


    /*
       If fewer than 4 are available,
       fill from the remaining collection.
    */

    coupleWatches.forEach(item => {

        if(
            related.length >= 4
        ){
            return;
        }

        if(
            item.slug === product.slug
        ){
            return;
        }

        if(
            !related.some(
                p => p.slug === item.slug
            )
        ){

            related.push(item);

        }

    });


    related =
        related.slice(0,4);


    grid.innerHTML =
        related.map(item => {

            const media =
                getMedia(item)[0];

            return `

                <a
                    class="related-card"
                    href="product-detailscouple-watches.html?id=${item.id}"
                >

                    <div class="related-media">

                        ${
                            media
                            ?

                            (
                                isVideo(media)

                                ?

                                `
                                <video
                                    src="${url(media)}"
                                    muted
                                    autoplay
                                    loop
                                    playsinline
                                    preload="metadata"
                                ></video>
                                `

                                :

                                `
                                <img
                                    src="${url(media)}"
                                    alt="${esc(item.name)}"
                                    loading="lazy"
                                >
                                `
                            )

                            :

                            ""
                        }

                    </div>

                    <div class="related-info">

                        <div class="related-brand">
                            ${esc(item.brand)}
                        </div>

                        <div class="related-name">
                            ${esc(item.name)}
                        </div>

                        <div class="related-price">
                            ${money(item.price)}
                        </div>

                    </div>

                </a>

            `;

        }).join("");

}

/* =========================================================

========================================================= */

function addToCart(){

    const quantityInput =
        document.getElementById(
            "quantity"
        );

    let quantity =
        Number(
            quantityInput?.value || 1
        );

    quantity =
        Math.max(
            1,
            Math.min(
                10,
                quantity
            )
        );


    const cart =
        getCart();


    const existing =
        cart.find(
            item =>
                String(item.slug) ===
                String(product.slug)
        );


    if(existing){

        existing.quantity =
            Math.min(
                10,
                Number(existing.quantity || 0)
                + quantity
            );

    }else{

        cart.push({

            slug:product.slug,

            name:product.name,

            price:product.price,

            quantity:quantity,

            media:getMedia(product)[0] || "",

            brand:product.brand,

            category:"Couple Watches"

        });

    }


    saveCart(cart);


    toast(
        `${product.name} added to your cart.`
    );

}

/* =========================================================
   TOAST
========================================================= */

let toastTimer;


function toast(message){

    const element =
        document.getElementById(
            "toast"
        );

    if(!element){
        return;
    }


    element.textContent =
        message;


    element.classList.add(
        "show"
    );


    clearTimeout(
        toastTimer
    );


    toastTimer =
        setTimeout(() => {

            element.classList.remove(
                "show"
            );

        },3000);

}


/* =========================================================
   GALLERY BINDING
========================================================= */

function bindGallery(media){

    let currentIndex = 0;


    const content =
        document.getElementById(
            "mainMediaContent"
        );

    const counter =
        document.getElementById(
            "mediaCounter"
        );

    const previous =
        document.getElementById(
            "prevMedia"
        );

    const next =
        document.getElementById(
            "nextMedia"
        );

    const thumbs =
        document.querySelectorAll(
            ".thumb"
        );


    function renderMedia(){

        if(!content){
            return;
        }


        const file =
            media[currentIndex];


        content.innerHTML =
            mediaHTML(
                file,
                true
            );


        if(counter){

            counter.textContent =
                `${currentIndex + 1} / ${media.length}`;

        }


        thumbs.forEach(
            (thumb,index) => {

                thumb.classList.toggle(
                    "active",
                    index === currentIndex
                );

            }
        );


        const video =
            content.querySelector(
                "video"
            );


        if(video){

            video.addEventListener(
                "loadeddata",
                () => {

                    video.play()
                        .catch(
                            () => {}
                        );

                }
            );

        }

    }


    function move(direction){

        if(media.length <= 1){
            return;
        }


        currentIndex =
            (
                currentIndex +
                direction +
                media.length
            ) %
            media.length;


        renderMedia();

    }


    if(previous){

        previous.addEventListener(
            "click",
            () => move(-1)
        );

    }


    if(next){

        next.addEventListener(
            "click",
            () => move(1)
        );

    }


    thumbs.forEach(
        (thumb,index) => {

            thumb.addEventListener(
                "click",
                () => {

                    currentIndex =
                        index;

                    renderMedia();

                }
            );

        }
    );


    /*
       Keyboard gallery navigation
    */

    document.addEventListener(
        "keydown",
        event => {

            if(event.key === "ArrowLeft"){

                move(-1);

            }

            if(event.key === "ArrowRight"){

                move(1);

            }

        }
    );

}


/* =========================================================
   ACTION BINDING
========================================================= */

function bindActions(){

    const quantity =
        document.getElementById(
            "quantity"
        );


    const minus =
        document.getElementById(
            "quantityMinus"
        );


    const plus =
        document.getElementById(
            "quantityPlus"
        );


    if(minus){

        minus.addEventListener(
            "click",
            () => {

                let value =
                    Number(
                        quantity.value || 1
                    );

                value =
                    Math.max(
                        1,
                        value - 1
                    );

                quantity.value =
                    value;

            }
        );

    }


    if(plus){

        plus.addEventListener(
            "click",
            () => {

                let value =
                    Number(
                        quantity.value || 1
                    );

                value =
                    Math.min(
                        10,
                        value + 1
                    );

                quantity.value =
                    value;

            }
        );

    }


    if(quantity){

        quantity.addEventListener(
            "change",
            () => {

                let value =
                    Number(
                        quantity.value || 1
                    );

                value =
                    Math.max(
                        1,
                        Math.min(
                            10,
                            value
                        )
                    );

                quantity.value =
                    value;

            }
        );

    }


    const add =
        document.getElementById(
            "addCart"
        );


    const buy =
        document.getElementById(
            "buyNow"
        );


    const whatsapp =
        document.getElementById(
            "whatsappBtn"
        );


    if(add){

        add.addEventListener(
            "click",
            addToCart
        );

    }


    if(buy){

        buy.addEventListener(
            "click",
            buyNow
        );

    }


    if(whatsapp){

        whatsapp.addEventListener(
            "click",
            enquireWhatsApp
        );

    }

}
