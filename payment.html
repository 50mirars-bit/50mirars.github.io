<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Payment Page</title>
  <style>
    body {
      margin:0;
      font-family:'Segoe UI',Arial,sans-serif;
      background:#f5f5f5;
      display:flex;
      justify-content:center;
      padding:40px;
    }
    .container {
      display:flex;
      gap:40px;
      max-width:1200px;
      width:100%;
    }
    .payment-options {
      flex:2;
      background:#fff8f0;
      padding:30px;
      border-radius:16px;
      box-shadow:0 8px 20px rgba(0,0,0,0.1);
    }
    .payment-options h2 {
      color:#ff6f00;
      margin-bottom:20px;
    }
    .option {
      margin-bottom:25px;
      padding:20px;
      border:1px solid #ddd;
      border-radius:12px;
      background:#fff;
    }
    .option h3 {
      margin-bottom:10px;
      color:#333;
    }
    .transaction-section {
      margin-top:30px;
      padding:20px;
      background:#fff;
      border:1px solid #ddd;
      border-radius:12px;
    }
    .transaction-section label {
      font-weight:600;
      margin-bottom:10px;
      display:block;
    }
    .transaction-section input {
      width:100%;
      padding:14px;
      border:1px solid #ccc;
      border-radius:10px;
      font-size:15px;
      margin-bottom:20px;
    }
    .submit-btn {
      width:100%;
      padding:16px;
      background:#ff6f00;
      color:#fff;
      font-size:17px;
      font-weight:600;
      border:none;
      border-radius:10px;
      cursor:pointer;
      transition:0.3s;
    }
    .submit-btn:hover {
      background:#e65100;
      transform:translateY(-2px);
      box-shadow:0 6px 12px rgba(0,0,0,0.2);
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- Payment Options -->
    <div class="payment-options">
      <h2>Choose Payment Method</h2>

      <div class="option">
        <div style="display:flex; align-items:center; justify-content:space-between;">
          <div>
            <h3>UPI QR Code</h3>
            <p>Scan the QR code to pay instantly.</p>
          </div>
          <img src="QR CODE.jpeg" alt="UPI QR Code" style="width:180px; border-radius:10px;">
        </div>
      </div>

      <div class="option">
        <h3>UPI ID</h3>
        <p>Use this UPI ID to make payment:</p>
        <strong>yourupi@bank</strong>
      </div>

      <div class="option">
        <h3>Bank Transfer</h3>
        <p>Transfer to the following bank details:</p>
        <strong>Account Name:</strong> Your Name <br>
        <strong>Account Number:</strong> 1234567890 <br>
        <strong>IFSC:</strong> ABCD0123456 <br>
        <strong>Bank:</strong> Your Bank Name
      </div>

      <!-- Transaction ID Section -->
      <div class="transaction-section">
        <form id="transactionForm" action="https://formspree.io/f/xjgnnebl" method="POST">
          <label for="transactionId">Enter Transaction ID</label>
          <input type="text" id="transactionId" name="transactionId" required>
          <button type="submit" class="submit-btn">Submit Transaction</button>
        </form>
      </div>
    </div>
  </div>

  <script>
    // Handle form submission with Formspree and redirect
    const form = document.getElementById("transactionForm");
    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const data = new FormData(form);
      const response = await fetch(form.action, {
        method: form.method,
        body: data,
        headers: { 'Accept': 'application/json' }
      });
      if (response.ok) {
        window.location.href = "confirmation.html";
      } else {
        alert("Error submitting transaction. Please try again.");
      }
    });
  </script>
</body>
</html>
