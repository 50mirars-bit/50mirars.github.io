<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Order Confirmation - 50 Mirars</title>
  <style>
    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: #f5f5f5;
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    /* Progress Bar */
    .progress-bar {
      display: flex;
      justify-content: center;
      align-items: center;
      margin-bottom: 40px;
    }

    .step {
      flex: none;
      text-align: center;
      font-weight: 600;
      color: #999;
      position: relative;
      margin: 0 20px;
    }

    .step span {
      display: inline-block;
      padding: 10px 25px;
      border-radius: 25px;
      background: #ddd;
      color: #fff;
      z-index: 1;
      position: relative;
    }

    .step.active span {
      background: #28a745; /* green */
    }

    .step.completed span {
      background: #ff6f00; /* orange */
    }

    .step:not(:last-child)::after {
      content: "";
      position: absolute;
      top: 50%;
      right: -40px;
      width: 40px;
      height: 4px;
      background: #ddd;
      transform: translateY(-50%);
      z-index: 0;
    }

    /* Confirmation Box */
    .confirmation-box {
      background: #ffffff;
      padding: 50px;
      border-radius: 16px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.15);
      text-align: center;
      max-width: 600px;
      width: 90%;
      animation: fadeIn 0.6s ease;
    }

    .confirmation-box h2 {
      color: #28a745;
      font-size: 32px;
      margin-bottom: 20px;
    }

    .confirmation-box p {
      font-size: 18px;
      color: #333;
      margin-bottom: 10px;
    }

    .confirmation-box .brand {
      font-weight: 700;
      color: #ff6f00;
    }

    @keyframes fadeIn {
      from {opacity: 0; transform: translateY(20px);}
      to {opacity: 1; transform: translateY(0);}
    }

    .btn {
      display: inline-block;
      margin-top: 25px;
      padding: 14px 28px;
      background: #ff6f00;
      color: #fff;
      font-size: 16px;
      font-weight: 600;
      border: none;
      border-radius: 10px;
      text-decoration: none;
      transition: 0.3s;
    }

    .btn:hover {
      background: #e65100;
      transform: translateY(-2px);
      box-shadow: 0 6px 12px rgba(0,0,0,0.2);
    }
  </style>
</head>
<body>

  <!-- Progress Bar -->
  <div class="progress-bar">
    <div class="step completed"><span>Delivery Details</span></div>
    <div class="step completed"><span>Payment</span></div>
    <div class="step active"><span>Order Confirmed</span></div>
  </div>

  <!-- Confirmation Box -->
  <div class="confirmation-box">
    <h2>✅ Order Confirmed</h2>
    <p>Thanks! for shopping from <span class="brand">50 Mirars</span></p>
    <p>Your order is confirmed and will be processed shortly.</p>
    <a href="index.html" class="btn">Continue Shopping</a>
  </div>

</body>
</html>
